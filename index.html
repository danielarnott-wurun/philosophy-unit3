 reject the view that society has the right to make people live well.","L"],["The right in this passage belongs to the individual, who has full authority over his own body and mind in whatever concerns only himself.","L"],["Mill’s reason is that people gain more from living as they think best than from being forced to live as others think best.","L"],["However, this right has limits.","N"],["Elsewhere Mill says it applies only to adults, and that children must be protected from their own choices.","N"]],"bQ":"How might one other thinker studied in Unit 3 respond to Mill’s view on the role of rights in the good life?","b":[{"label":"Weil","thinker":"Weil","s":[["Weil would say Mill gives rights the wrong place in the good life.","I"],["Mill calls the individual “sovereign” over himself.","I"],["Weil argues that “a right is not effectual by itself”, because it depends on others who feel “a certain obligation towards him”.","R"],["So Mill’s right to be left alone only works if others accept the duty.","R"],["She also says a person has “duties towards himself”, so even what Mill leaves to our own choice is a matter of duty for Weil.","R"],["However, Weil could accept Mill’s right as one side of an obligation, since the words “only express differences in point of view”.","N"],["So both want each person respected, but Weil begins with what we owe and Mill with what must be left free.","N"]]},{"label":"Allen","thinker":"Allen","s":[["Allen would say that Mill’s view makes rights too central to the good life.","I"],["For Mill the individual is “sovereign”, and real freedom is “pursuing our own good in our own way”.","I"],["Allen also values autonomy, but says it means “getting one’s way in concert with others, and as modified by them”.","R"],["Her model is Aristotle’s equitable man, who “does not stand on his rights unduly” even when “he has the law on his side”.","R"],["Her reason is that citizens who always act on their “unrestrained interests” will “corrode the trust that supports political bonds”.","R"],["So both value autonomy, but Mill protects it with rights, while Allen thinks it also needs people willing to give up some of what they are entitled to.","N"]]}],"cQ":"Do we have the right to make choices that are bad for us? Provide your own justified response to this question. Support your reasoning with an example.","c":[["I think we do have the right to make choices that are bad for us, because an adult’s life is their own, but it has to be balanced with care for our wellbeing.","P"],["For example, imagine my twenty-two-year-old brother starts gambling online most nights.","E"],["I cannot make him stop, and it would be wrong to force him, because it is his life and only he can change it.","E"],["However, we should not stop caring.","E"],["His choice is only really free if he has other options, such as people to talk to, easy access to counselling, and limits he can set on his account.","E"],["Someone might argue that offering this is another way of interfering.","D"],["I disagree, because it adds to what he can choose and takes nothing away.","D"],["So we have the right to make bad choices, but the people around us should work to make better ones possible.","D"]]}]},{"id":"aos2-bq3","n":3,"text":"What does a good life have to do with being morally good?","qs":[{"id":"q27","n":1,"thinker":"Wolf","title":"too good for his own wellbeing","aC":"moral goodness","cC":"wellbeing","sum":"A moral saint may be too good for his own wellbeing, because moral virtues held to an extreme crowd out the nonmoral interests that make a rounded character, leaving a life strangely barren.","stim":["Perhaps what I have already said is enough to make some people begin to regard the absence of moral saints in their lives as a blessing. For there comes a point in the listing of virtues that a moral saint is likely to have where one might naturally begin to wonder whether the moral saint isn’t, after all, too good – if not too good for his own good, at least too good for his own well-being. For the moral virtues, given that they are, by hypothesis, all present in the same individual, and to an extreme degree, are apt to crowd out the nonmoral virtues, as well as many of the interests and personal characteristics that we generally think contribute to a healthy, well-rounded, richly developed character. In other words, if the moral saint is devoting all his time to feeding the hungry or healing the sick or raising money for Oxfam, then necessarily he is not reading Victorian novels, playing the oboe, or improving his backhand. Although no one of the interests or tastes in the category containing these latter activities could be claimed to be a necessary element in a life well lived, a life in which none of these possible aspects of character are developed may seem to be a life strangely barren."],"src":"S Wolf, “Moral Saints”, The Journal of Philosophy, vol. 79, no. 8, August 1982, pp. 421–422","aQ":"With reference to the passage above, explain how Wolf might respond to the view that being morally good is essential to the good life.","a":[["Wolf argues that a moral saint may be too good for his own wellbeing.","I"],["Because the saint has every moral virtue to an extreme degree, these push out the non-moral virtues and interests that make a rounded character.","I"],["If all his time goes to feeding the hungry or raising money, none is left for reading, music or sport, and such a life seems empty.","I"],["She would only partly agree that being morally good is essential to the good life.","L"],["A good life needs some moral goodness, but it also needs room for interests that have nothing to do with morality.","L"],["However, Wolf is not against morality.","N"],["Elsewhere she says moral value may even be the most important kind of value.","N"]],"bQ":"How might one other thinker studied in Unit 3 respond to Wolf’s view on the relationship between moral goodness and the good life?","b":[{"label":"Singer","thinker":"Singer","s":[["Singer would reject Wolf’s view that too much moral goodness spoils the good life.","I"],["Wolf thinks a life given over to “raising money for Oxfam” is “strangely barren”.","I"],["Singer argues that this is close to how we should live.","R"],["He says people in our position “ought to give as much as possible”.","R"],["He would say the interests Wolf defends are not of “comparable moral importance” to “suffering and death from lack of food”.","R"],["However, Singer’s principle is narrower than sainthood.","N"],["It asks us “only to prevent what is bad, and not to promote what is good”.","N"],["So both accept that morality makes real demands on us, but Wolf thinks a good life must limit them, while Singer thinks our other interests rarely outweigh them.","N"]]},{"label":"Aristotle","thinker":"Aristotle","s":[["Aristotle would give moral goodness a more central place in the good life than Wolf does.","I"],["Wolf says moral value need not sit “at the top” of our values.","I"],["Aristotle defines the human good as “activity of soul exhibiting virtue”, so a good life is built on being a good person.","R"],["However, he would share Wolf’s worry about the saint.","N"],["He says temperance and courage are “destroyed by excess and defect, and preserved by the mean”, so a person who “shuns every pleasure” becomes “insensible”.","N"],["He also calls virtue alone “somewhat incomplete”, since a good person could still suffer greatly.","N"],["So both doubt the saint’s extreme, but for Aristotle the saint has got virtue wrong, while for Wolf he has too much of it.","N"]]}],"cQ":"To what extent is personal wellbeing compatible with being morally good? Provide your own justified response to this question. Support your reasoning with an example.","c":[["I think personal wellbeing and being morally good are mostly compatible, but only when morality does not take over a person’s whole life.","P"],["For example, imagine a Year 12 student who volunteers at a food bank one afternoon a week.","E"],["She feels useful, meets people and still has time for netball and friends, so helping others adds to her wellbeing.","E"],["Now imagine she also tutors every lunchtime, never says no and gives up netball to fit it all in.","E"],["She is doing more good, but she is exhausted and has lost the things she enjoyed.","E"],["Someone might argue that her wellbeing should not count while others are in real need.","D"],["However, hers is one of the lives that matter, and a person who burns out helps nobody.","D"],["So wellbeing and moral goodness support each other up to a point, and clash when being good leaves room for nothing else.","D"]]},{"id":"q28","n":2,"thinker":"Wolf","title":"no permission needed","aC":"moral goodness","cC":"being admirable","sum":"We do not need morality’s permission to pursue goals that are not maximally moral; our nonmoral reasons are good reasons, and a person may be perfectly wonderful without being perfectly moral.","stim":["It is misleading to insist that one is permitted to live a life in which the goals, relationships, activities, and interests that one pursues are not maximally morally good. For our lives are not so comprehensively subject to the requirement that we apply for permission, and our nonmoral reasons for the goals we set ourselves are not excuses, but may rather be positive, good reasons which do not exist despite any reasons that might threaten to outweigh them. In other words, a person may be perfectly wonderful without being perfectly moral. Recognizing this requires a perspective which contemporary moral philosophy has generally ignored. This perspective yields judgments of a type that is neither moral nor egoistic. Like moral judgments, judgments about what it would be good for a person to be are made from a point of view outside the limits set by the values, interests, and desires that the person might actually have. And, like moral judgments, these judgments claim for themselves a kind of objectivity or a grounding in a perspective which any rational and perceptive being can take up. Unlike moral judgments, however, the good with which these judgments are concerned is not the good of anyone or any group other than the individual himself."],"src":"S Wolf, “Moral Saints”, The Journal of Philosophy, vol. 79, no. 8, August 1982, pp. 421–422","aQ":"With reference to the passage above, explain how Wolf might respond to the view that the good life requires us to be as morally good as possible.","a":[["Wolf argues that we do not need permission from morality to pursue goals that are not the most moral available.","I"],["Our non-moral reasons, such as loving an activity or wanting to excel at it, are good reasons and not excuses.","I"],["She describes a way of judging what is good for a person to be that is neither moral nor selfish.","I"],["Wolf would therefore reject the view that the good life requires us to be as morally good as possible, because a person can be wonderful without being morally perfect.","L"],["However, this does not mean morality can be ignored.","N"],["Elsewhere Wolf says we hope the people we take as ideals are morally good, as well as talented in other ways.","N"]],"bQ":"How might one other thinker studied in Unit 3 respond to Wolf’s view on the relationship between moral goodness and the good life?","b":[{"label":"Nietzsche","thinker":"Nietzsche","s":[["Nietzsche would agree with Wolf that the good life does not require maximum moral goodness, but he would reject her respect for morality.","I"],["Wolf says we need not “apply for permission” from morality.","I"],["Nietzsche’s noble person “does not need to be approved of” either, though he “creates values” himself.","I"],["However, Wolf still thinks moral value may be “the most important” kind, and she does not “condemn the moral saint”.","R"],["Nietzsche treats virtues like “pity” and “humility” as slave morality, which honours them because they are “the most useful qualities” for the weak.","R"],["So both think a person can be admirable beyond morality, but Wolf wants morality kept alongside other values, while Nietzsche sees ordinary morality as an obstacle to greatness.","N"]]},{"label":"Singer","thinker":"Singer","s":[["Singer would reject Wolf’s view that a good life need not be as morally good as possible.","I"],["Wolf says our non-moral reasons “are not excuses” but “positive, good reasons”.","I"],["Singer would treat many of them as excuses.","R"],["When we buy clothes to look “well-dressed”, he says, “we are not providing for any important need”, and “it is wrong not to” give that money to famine relief.","R"],["However, Singer does not demand everything.","N"],["His principle applies only when we can help “without thereby sacrificing anything else morally significant”.","N"],["So the real disagreement is about whether such pursuits need a moral defence.","N"],["Wolf thinks music and sport need none, while Singer would say they weigh very little against “suffering and death”.","N"]]},{"label":"Aristotle","thinker":"Aristotle","s":[["Aristotle would disagree with Wolf’s view that moral goodness is only one part of a good life and not its centre.","I"],["He argues that a thing is good when it performs its function well, as “a good lyre-player” plays well.","I"],["The human function is activity guided by reason, so the human good is “activity of soul exhibiting virtue”, following “the best and most complete” virtue.","I"],["So a good life cannot be separated from being good.","R"],["However, Aristotle’s question is close to Wolf’s.","N"],["Like her, he asks what it is good for a person to be, and he calls virtue alone “somewhat incomplete”.","N"],["So both judge whole lives, but Aristotle puts virtue at the centre, while Wolf makes moral goodness one value among several.","N"]]}],"cQ":"Can a person be admirable without being morally good? Provide your own justified response to this question. Support your reasoning with an example.","c":[["I think a person can be admirable without being especially morally good, because skill and effort deserve admiration in their own right, as long as they are not actually bad.","P"],["For example, imagine a girl in my year who is the best swimmer in the school.","E"],["She trains at five every morning, and she says no to helping with fundraisers because she has no time.","E"],["She is not unkind, but nobody would call her generous.","E"],["I still admire her discipline and skill.","E"],["Someone might argue that we should only admire people for being good, since talent is partly luck.","D"],["However, getting up at five every day is not luck, and admiring her effort is different from saying she is a moral example.","D"],["If she bullied younger swimmers I would stop admiring her, so morality sets a minimum.","D"],["Above that minimum, people can be admirable for many things besides goodness.","D"]]},{"id":"q29","n":3,"thinker":"Singer","title":"give as much as possible","aC":"moral goodness","cC":"sacrifice","sum":"We ought to give as much as possible, at least until giving more would cause serious suffering to ourselves and our dependants, and perhaps up to the point of marginal utility.","stim":["It follows that I and everyone else in similar circumstances ought to give as much as possible, that is, at least up to the point at which by giving more one would begin to cause serious suffering for oneself and one’s dependents – perhaps even beyond this point to the point of marginal utility, at which by giving more one would cause oneself and one’s dependents as much suffering as one would prevent in Bengal. If everyone does this, however, there will be more than can be used for the benefit of the refugees, and some of the sacrifice will have been unnecessary. Thus, if everyone does what he ought to do, the result will not be as good as it would be if everyone did a little less than he ought to do, or if only some do all that they ought to do."],"src":"P Singer, “Famine, Affluence, and Morality”, Philosophy & Public Affairs, vol. 1, no. 3, Spring 1972, p. 234","aQ":"With reference to the passage above, explain how Singer might respond to the view that being morally good is essential to the good life.","a":[["Singer argues that because few people give much, each of us ought to give as much as possible.","I"],["This means giving at least until we would cause serious suffering to ourselves and our dependants, and perhaps until we would lose as much as others would gain.","I"],["Singer’s argument is about duty, but he would agree that being morally good is essential to the good life.","L"],["For him a life of comfort cannot be justified while others are dying from lack of food, so living well would mean giving up a great deal to prevent suffering.","L"],["However, he is not asking for sacrifice for its own sake.","N"],["Elsewhere he says that when others are also giving, each person is obliged to give less.","N"]],"bQ":"How might one other thinker studied in Unit 3 respond to Singer’s view on the relationship between moral goodness and the good life?","b":[{"label":"Wolf","thinker":"Wolf","s":[["Wolf would reject Singer’s view that the good life means being as morally good as we can.","I"],["Singer says we “ought to give as much as possible”.","I"],["Wolf thinks a person who lives this way is a moral saint who “sacrifices his own interests to the interests of others”, and that this requires “the denial of the existence of an identifiable, personal self”.","R"],["However, Wolf’s account of morality resembles Singer’s.","N"],["She describes the moral point of view as recognising that “one is just one person among others equally real and deserving”, which is close to Singer’s impartiality.","N"],["So both take the needs of others seriously, but Singer lets them decide how we should live, while Wolf says a good life also answers to “individual perfection”.","N"]]},{"label":"Nietzsche","thinker":"Nietzsche","s":[["Nietzsche would reject Singer’s view that the good life depends on moral goodness understood as relieving suffering.","I"],["Singer assumes that suffering is “bad” and that we should prevent it.","I"],["Nietzsche calls this kind of thinking a “naïvety”.","R"],["He says those who “want if possible” to “abolish suffering” are making man smaller, because hardship is what develops a person’s “inventiveness and bravery”.","R"],["However, neither thinks a comfortable life is a good one.","N"],["Singer wants the affluent “way of life” changed, and Nietzsche says “wellbeing as you understand it” is “no goal”.","N"],["So both ask people to give up comfort, but Singer asks it for the sake of others, while Nietzsche asks it for the sake of a person’s own growth.","N"]]},{"label":"Allen","thinker":"Allen","s":[["Allen would agree with Singer that a good life involves giving things up for others, but she understands sacrifice differently.","I"],["Singer measures it as a loss, giving until we cause “serious suffering” to ourselves.","I"],["Allen calls sacrifice “friendship’s fundamental act”, but accepts that when we treat others’ good as part of our own we are “not so much sacrificing oneself” as acting for an “extended self”.","R"],["She adds that “there should be limits to what one is willing to give up”.","R"],["She also warns that people who “give money” without “giving them real power” may be “distrusted”.","R"],["So both make sacrifice part of being good, but Singer’s is a duty the rich owe to the poor, while Allen’s is an exchange between equals.","N"]]},{"label":"Aristotle","thinker":"Aristotle","s":[["Aristotle would agree with Singer that moral goodness is central to the good life, but not that it requires giving as much as possible.","I"],["Aristotle says “to confer benefits is characteristic of the good man and of virtue”, so a good person does help others.","I"],["However, he would reject giving to the point of “serious suffering”, because nobody would call a person happy who has virtue together with “the greatest sufferings and misfortunes”.","R"],["He also says “it is nobler to do well by friends than by strangers”.","R"],["Singer denies that distance makes any moral difference.","R"],["So both tie the good life to doing good, but Aristotle keeps it close to home and within what a person can bear.","N"]]}],"cQ":"To what extent should we sacrifice our own interests for the good of others? Provide your own justified response to this question. Support your reasoning with an example.","c":[["I think we should sacrifice a real share of our own interests for others, though not everything, because a small cost to us can do a lot of good.","P"],["For example, effective altruists try to do the most good they can.","E"],["The Melbourne-born philosopher Toby Ord co-founded Giving What We Can, whose members pledge ten per cent of their income to charity, and he gives away everything he earns above £18,000 a year.","E"],["Donations like these can pay for treatments that stop people in poor countries going blind.","E"],["Someone might argue that giving this much means missing out on a good life.","D"],["However, Ord says he can live comfortably and happily on what he keeps, and I think a life that saves many people’s sight is a life well lived.","D"],["So we should give up luxuries for others, but keep enough to live well ourselves, as Ord does.","D"]]},{"id":"q30","n":4,"thinker":"Aristotle","title":"honour and incomplete virtue","aC":"moral goodness","cC":"suffering","sum":"Honour is too superficial to be the good, since it depends on those who give it; virtue is better, but even virtue is incomplete, since it is compatible with inactivity and great misfortune.","stim":["A consideration of the prominent types of life shows that people of superior refinement and of active disposition identify happiness with honour; for this is, roughly speaking, the end of the political life. But it seems too superficial to be what we are looking for, since it is thought to depend on those who bestow honour rather than on him who receives it, but the good we divine to be something of one’s own and not easily taken from one. Further, men seem to pursue honour in order that they may be assured of their merit; at least it is by men of practical wisdom that they seek to be honoured, and among those who know them, and on the ground of their virtue; clearly, then, according to them, at any rate, virtue is better. And perhaps one might even suppose this to be, rather than honour, the end of the political life. But even this appears somewhat incomplete; for possession of virtue seems actually compatible with being asleep, or with lifelong inactivity, and, further, with the greatest sufferings and misfortunes; but a man who was living so no one would call happy, unless he were maintaining a thesis at all costs."],"src":"Aristotle, The Nicomachean Ethics, trans. David Ross, ed. Lesley Brown, Oxford World’s Classics, Oxford University Press, 2009","aQ":"With reference to the passage above, explain how Aristotle might respond to the view that being a good person is all that matters for a good life.","a":[["Aristotle argues that honour is too shallow to be the good, because it depends on the people who give it.","I"],["People want honour as proof of their virtue, so virtue is better.","I"],["Yet he says virtue is also incomplete.","I"],["A person could have a good character and still be asleep or inactive all their life, or suffer terrible misfortunes, and nobody would call that person happy.","I"],["Aristotle would therefore reject the view that being a good person is all that matters for a good life.","L"],["Being good is necessary, but it has to be put to use, and the person needs some good fortune.","L"],["However, virtue stays at the centre.","N"],["Elsewhere he defines the human good as activity that shows virtue over a complete life.","N"]],"bQ":"How might one other thinker studied in Unit 3 respond to Aristotle’s view on the relationship between moral goodness and the good life?","b":[{"label":"Nietzsche","thinker":"Nietzsche","s":[["Nietzsche would reject Aristotle’s view that moral goodness cannot make a life good when the person suffers greatly.","I"],["Aristotle says virtue is compatible with “the greatest sufferings and misfortunes”, and that such a man “no one would call happy”.","I"],["Nietzsche argues that “the discipline of suffering” has “created every elevation of mankind”.","R"],["For him hardship is a chance to grow, where for Aristotle it spoils a life.","R"],["However, neither makes the good depend on other people’s approval.","N"],["Aristotle rejects honour because it depends “on those who bestow honour”, and Nietzsche’s noble person “does not need to be approved of”.","N"],["So both want a goodness that belongs to the person, but Aristotle thinks it needs good fortune, while Nietzsche thinks it is built through hardship.","N"]]},{"label":"Wolf","thinker":"Wolf","s":[["Wolf would agree with Aristotle that moral goodness is not enough for a good life, but she disagrees about what is missing.","I"],["Aristotle calls virtue “somewhat incomplete” because a virtuous person might be inactive or suffer “misfortunes”.","I"],["Virtue stays central for him.","I"],["Wolf thinks what is missing is the “nonmoral virtues”, such as humour and talent.","R"],["She also questions “the assumption that it is always better to be morally better”, and says a moral saint can be “too good for his own well-being”.","R"],["Aristotle does not say a person could have too much virtue.","R"],["So both deny that being good is all that matters, but Aristotle thinks virtue needs activity and good fortune added, while Wolf thinks it should not take over a life.","N"]]}],"cQ":"Can a virtuous person who suffers greatly still be living a good life? Provide your own justified response to this question. Support your reasoning with an example.","c":[["I think a virtuous person who suffers greatly can still be living a good life, because a life is judged by what a person does with it, as long as they can still act on what they care about.","P"],["For example, the former AFL coach Neale Daniher was diagnosed with motor neurone disease in 2013, an incurable disease that gradually paralyses the body.","E"],["He co-founded FightMND, which has raised more than $115 million for research, and he was named Australian of the Year in 2025 before he died in 2026.","E"],["Someone might argue that calling this a good life ignores how terrible the disease was.","D"],["I agree the suffering was bad in itself.","D"],["However, his life was good because of the courage and generosity he showed during it, and because it mattered to many people.","D"],["So great suffering makes a good life harder, but it does not rule one out.","D"]]},{"id":"q31","n":5,"thinker":"Nietzsche","title":"slave morality","aC":"moral virtues","cC":"the weak and the strong","sum":"Slave morality comes from the oppressed and suffering; it distrusts the virtues of the powerful and honours pity, patience, humility and friendliness because they make existence easier to bear.","stim":["It is otherwise with the second type of morality, slave morality. Suppose the abused, oppressed, suffering, unfree, those uncertain of themselves and weary should moralize: what would their moral evaluations have in common? Probably a pessimistic mistrust of the entire situation of man will find expression, perhaps a condemnation of man together with his situation. The slave is suspicious of the virtues of the powerful: he is sceptical and mistrustful, keenly mistrustful, of everything ‘good’ that is honoured among them – he would like to convince himself that happiness itself is not genuine among them. On the other hand, those qualities which serve to make easier the existence of the suffering will be brought into prominence and flooded with light: here it is that pity, the kind and helping hand, the warm heart, patience, industriousness, humility, friendliness come into honour – for here these are the most useful qualities and virtually the only means of enduring the burden of existence. Slave morality is essentially the morality of utility. Here is the source of the famous antithesis ‘good’ and ‘evil’… The antithesis reaches its height when, consistently with slave morality, a breath of disdain finally also comes to be attached to the ‘good’ of this morality – it may be a slight and benevolent disdain – because within the slaves’ way of thinking the good man has in any event to be a harmless man: he is good-natured, easy to deceive, perhaps a bit stupid, un bonhomme. Wherever slave morality comes to predominate, language exhibits a tendency to bring the words ‘good’ and ‘stupid’ closer to each other."],"src":"F Nietzsche, Beyond Good and Evil, trans. R. J. Hollingdale, Penguin Classics, London, 2003, p. 93","aQ":"With reference to the passage above, explain how Nietzsche might respond to the view that moral virtues such as kindness and humility are essential to the good life.","a":[["Nietzsche argues that slave morality comes from people who are oppressed, suffering and unsure of themselves.","I"],["They distrust the strengths of the powerful, and they honour qualities such as pity, patience, humility and friendliness because these make a hard life easier to bear.","I"],["Nietzsche would therefore reject the view that kindness and humility are essential to the good life.","L"],["For him they are valued because they are useful to those who suffer, and the good person of this morality must be harmless, even foolish.","L"],["A good life needs strength and pride, which this morality treats with suspicion.","L"],["However, Nietzsche does not reject every gentle quality.","N"],["Elsewhere he lists sympathy among a noble person’s virtues, but as something to be kept under control like the others.","N"]],"bQ":"How might one other thinker studied in Unit 3 respond to Nietzsche’s view on the relationship between moral goodness and the good life?","b":[{"label":"Singer","thinker":"Singer","s":[["Singer would reject Nietzsche’s view that moral goodness holds back the good life, although he would accept part of his description of morality.","I"],["Nietzsche says the “kind and helping hand” is honoured because it is among “the most useful qualities”, and calls this “the morality of utility”.","I"],["Singer would agree that helping matters because it relieves suffering.","I"],["He assumes that “suffering and death from lack of food, shelter, and medical care are bad”.","I"],["However, for Singer this usefulness is what makes helping right.","R"],["His morality is also a demand on the strong, “people in relatively affluent countries”.","R"],["So both see everyday morality as a response to suffering, but Nietzsche thinks this makes a life smaller, while Singer thinks a life without it “cannot be justified”.","N"]]},{"label":"Aristotle","thinker":"Aristotle","s":[["Aristotle would reject Nietzsche’s view that moral virtues are only tools that help the weak to cope.","I"],["For Aristotle virtue is how any human being thrives.","I"],["He defines the human good as “activity of soul exhibiting virtue”, and says we choose the virtues “for themselves” and also because “through them we shall be happy”.","I"],["He also says “to confer benefits is characteristic of the good man”, so helping others is a sign of excellence.","R"],["However, Aristotle also values courage.","N"],["He says the person who “fears everything” becomes “a coward”, so he would not praise a merely timid person either.","N"],["So both prize courage, but Aristotle counts it among the moral virtues, while Nietzsche thinks ordinary moral virtue works against it.","N"]]},{"label":"Allen","thinker":"Allen","s":[["Allen would reject Nietzsche’s view that caring for others belongs to the weak and holds people back.","I"],["She argues that habits of “sacrifice”, “equity” and attention to others are what make a shared life possible.","I"],["Without them, “we will corrode the trust that supports political bonds”, and a society cannot keep cooperating.","R"],["However, she would accept that these qualities are useful.","N"],["She says a citizen’s regard for others must be equitable “if it is to serve her well”.","N"],["For Nietzsche these virtues help the suffering to endure, while for Allen they build a society in which everyone can thrive.","N"],["So both connect morality to usefulness, but Allen treats that as a strength of morality and Nietzsche as a mark against it.","N"]]}],"cQ":"Does morality let the weak feel superior to the strong? Provide your own justified response to this question. Support your reasoning with an example.","c":[["I think morality can be used to let people feel superior to those who are stronger, but that is a misuse and not what morality is for.","P"],["For example, imagine a girl in my year who tops every subject and is made school captain.","E"],["Some classmates call her arrogant and a try-hard, even though she has never put anyone down.","E"],["I think they are using the language of humility to feel better about doing less well.","E"],["Someone might argue that this shows all talk of humility is envy in disguise.","D"],["However, if the same girl mocked other students for their marks, calling her arrogant would be fair, because she would be hurting people.","D"],["The difference is whether someone has actually been wronged.","D"],["So morality sometimes gives the envious a way to feel superior, but its real job is to protect people, and it does that for strong and weak alike.","D"]]}]},{"id":"aos2-bq4","n":4,"text":"What is the relationship between the good for the individual and the good for others?","qs":[{"id":"q32","n":1,"thinker":"Allen","title":"equitable self-interest","aC":"individual and others","cC":"friendship","sum":"Because we live among strangers, self-interest should be equitable, not rivalrous; friendship teaches the practice of sacrifice and an awareness that preserving relationships is in our own interest.","stim":["For my own long-term good, because I desire to continue living among strangers, the self-interest that marks my regard for my fellow citizens should be equitable, not rivalrous. Now we can see how friendship extends beyond justice. It contributes to politics two things that justice cannot. First, friendship cultivates a habitual expertise at the only practice that converts rivalrous into equitable self-interest. Sacrifice is the only act that might convince others to abandon legal for ethical forms of reciprocity and to seek suppler means than strict barter to preserve autonomy. A signal sacrifice, like Elizabeth Eckford’s, declares a context of equitability, not rivalry, to obtain; her gift was one of faith. Second, friendship develops an awareness that our interests, properly understood, include a desire to preserve key relationships. Among these, the political bond especially requires active and constant rejuvenation."],"src":"DS Allen, Talking to Strangers: Anxieties of Citizenship since Brown v. Board of Education, The University of Chicago Press, Chicago, 2004, p. 136","aQ":"With reference to the passage above, explain how Allen might respond to the view that the good for the individual and the good for others are in tension.","a":[["Allen argues that it is in my long-term interest to treat fellow citizens equitably and not as rivals, because I want to keep living among them.","I"],["Friendship teaches two things that justice, meaning laws and the fair distribution of goods, cannot.","I"],["It gives us practice at sacrifice, which shows others we are not rivals, and it makes us aware that keeping relationships going is part of our own good.","I"],["Allen would therefore reject the view that the good for the individual and the good for others are in tension.","L"],["Being good to others helps create the community in which we can thrive.","L"],["However, she accepts that the tension is real when self-interest is rivalrous.","N"],["Elsewhere she says rivalrous self-interest creates the conflicts that drive politics.","N"]],"bQ":"How might one other thinker studied in Unit 3 respond to Allen’s view on the relationship between the good for the individual and the good for others?","b":[{"label":"Nietzsche","thinker":"Nietzsche","s":[["Nietzsche would reject Allen’s view that the good for the individual and the good for others can be brought together.","I"],["Allen thinks citizens thrive when they make sacrifices and treat strangers equitably.","I"],["Nietzsche argues that a community protects itself by holding its strongest members down.","I"],["He says “everything that raises the individual above the herd” is called “evil”, while “the fair, modest, obedient, self-effacing disposition” is honoured.","I"],["For him the qualities Allen praises serve the group at the individual’s expense.","R"],["However, Nietzsche counts “a refined conception of friendship” among the marks of noble morality, where “one has duties only towards one’s equals”.","N"],["So both value friendship, but Allen extends it to strangers, while Nietzsche thinks the exceptional individual must keep apart from the many.","N"]]},{"label":"Wolf","thinker":"Wolf","s":[["Wolf would say that Allen removes the tension between the good for the individual and the good for others too easily.","I"],["Allen argues that when we treat others’ good as part of our own, sacrifice is not a loss.","I"],["Wolf’s Loving Saint is such a person, for whom “the dictates of rational self-interest and the dictates of morality coincide”.","I"],["Yet she says “we have reason not to aspire to this ideal”, because he seems “blind to some of what the world has to offer”.","R"],["However, both think sacrifice needs a limit.","N"],["Allen says “there should be limits to what one is willing to give up”.","N"],["So both protect the individual, but Allen thinks self and others can be reconciled, while Wolf thinks some tension remains.","N"]]}],"cQ":"Is friendship a good model for political life? Provide your own justified response to this question. Support your reasoning with an example.","c":[["I think friendship is a good model for political life, as long as it works alongside fair laws.","P"],["Friends help each other without keeping score, and a society needs some of that.","R"],["For example, after the Brisbane floods in January 2011, more than 50,000 volunteers turned up on one weekend to shovel mud out of strangers’ homes.","E"],["Nobody was paid, and they treated people they had never met the way they would treat a friend.","E"],["Someone might argue that this only happens in a crisis, and that everyday politics is about competing interests.","D"],["I agree that we cannot rely on goodwill alone, which is why we need laws.","D"],["However, the same goodwill shows up in ordinary life when people volunteer at a local club, and no law can produce it.","D"],["So friendship is a good model for how citizens should treat each other, with justice as the back-up.","D"]]},{"id":"q33","n":2,"thinker":"Wolf","title":"two kinds of moral saint","aC":"individual and others","cC":"sacrifice","sum":"Two kinds of moral saint: the Loving Saint, whose happiness lies in the happiness of others, and the Rational Saint, who sacrifices his own interests for morality and feels the loss.","stim":["A necessary condition of moral sainthood would be that one’s life be dominated by a commitment to improving the welfare of others or of society as a whole. As to what role this commitment must play in the individual’s motivational system, two contrasting accounts suggest themselves to me which might equally be thought to qualify a person for moral sainthood. First, a moral saint might be someone whose concern for others plays the role that is played in most of our lives by more selfish, or, at any rate, less morally worthy concerns. For the moral saint, the promotion of the welfare of others might play the role that is played for most of us by the enjoyment of material comforts, the opportunity to engage in the intellectual and physical activities of our choice, and the love, respect, and companionship of people whom we love, respect, and enjoy. The happiness of the moral saint, then, would truly lie in the happiness of others, and so he would devote himself to others gladly, and with a whole and open heart. On the other hand, a moral saint might be someone for whom the basic ingredients of happiness are not unlike those of most of the rest of us. What makes him a moral saint is rather that he pays little or no attention to his own happiness in light of the overriding importance he gives to the wider concerns of morality. In other words, this person sacrifices his own interests to the interests of others, and feels the sacrifice as such."],"src":"S Wolf, “Moral Saints”, The Journal of Philosophy, vol. 79, no. 8, August 1982, pp. 421–422","aQ":"With reference to the passage above, explain how Wolf might respond to the view that the good for the individual and the good for others are in tension.","a":[["Wolf describes two moral saints who give their lives to the welfare of others.","I"],["The Loving Saint is made happy by others’ happiness, so he helps gladly.","I"],["The Rational Saint wants the same things as the rest of us but puts them aside for morality, and he feels the loss.","I"],["Wolf would agree that the good for the individual and the good for others are in tension, because a life dominated by others’ welfare crowds out a person’s other interests and talents.","L"],["However, she does not think the answer is a better balance between giving and receiving.","N"],["Elsewhere she says morality need not be “an ever-present filter through which all other values must pass”, so we do not always have to think in moral terms.","N"]],"bQ":"How might one other thinker studied in Unit 3 respond to Wolf’s view on the relationship between the good for the individual and the good for others?","b":[{"label":"Singer","thinker":"Singer","s":[["Singer would agree with Wolf that the good for the individual and the good for others are in tension, but he would weigh it differently.","I"],["His giver is close to Wolf’s Rational Saint, who “sacrifices his own interests to the interests of others, and feels the sacrifice as such”.","I"],["Singer admits the cost.","R"],["When few others give, we ought to give up to the point where more would cause “serious suffering” to ourselves.","R"],["However, he thinks the two goods are rarely equal.","R"],["New clothes meet no “important need”, while the money could prevent “another person from starving”.","R"],["So both admit that helping others costs us something, but Singer says we ought to pay it, while Wolf says a good life needs room for other interests.","N"]]},{"label":"Allen","thinker":"Allen","s":[["Allen would disagree with Wolf’s view that the good for the individual and the good for others are in tension.","I"],["She says “equitable self-interest treats the good of others as part of one’s own interests”, so someone who gives is “acting in the interests of this new extended self”.","R"],["However, Allen would share Wolf’s doubts about the saint, who only gives.","N"],["Allen says friends are “people to whom we are willing to be in debt”, and that those who give without making themselves “vulnerable” may be “distrusted”.","N"],["For her, sacrifice belongs where each side gives and is willing to receive.","N"],["So both are wary of one-way giving, Wolf because it crowds out the giver’s other interests and Allen because it keeps power on one side.","N"]]}],"cQ":"To what extent can sacrificing our own interests for others impact on the good life? Provide your own justified response to this question. Support your reasoning with an example.","c":[["I think sacrificing our own interests for others can make a life better or worse, depending on how much we give up and whether we choose it.","P"],["For example, imagine a Year 11 student who chooses to give up Saturday netball to look after her little brother while their mum works.","E"],["She misses her team, so it is a real cost.","E"],["However, she becomes closer to her brother and knows her family depends on her, which adds meaning to her life.","E"],["Someone might argue that if the sacrifice improves her life then it is not really a sacrifice.","D"],["I disagree, because she has still lost something she loved.","D"],["The harm comes when the giving never stops.","D"],["If she also gave up her friends and her study, she would have no life of her own left.","D"],["So some sacrifice improves the good life, but too much takes it away.","D"]]},{"id":"q34","n":3,"thinker":"Mill","title":"pursuing our own good in our own way","aC":"individual and others","cC":"freedom","sum":"The only freedom worth the name is pursuing our own good in our own way without impeding others; mankind gains more by letting each live as seems good to them than by compulsion.","stim":["No society in which these liberties are not, on the whole, respected, is free, whatever may be its form of government; and none is completely free in which they do not exist absolute and unqualified. The only freedom which deserves the name, is that of pursuing our own good in our own way, so long as we do not attempt to deprive others of theirs, or impede their efforts to obtain it. Each is the proper guardian of his own health, whether bodily, or mental and spiritual. Mankind are greater gainers by suffering each other to live as seems good to themselves, than by compelling each to live as seems good to the rest."],"src":"JS Mill, On Liberty (1859), Penguin Classics, London, 1982, p. 82","aQ":"With reference to the passage above, explain how Mill might respond to the view that the good for the individual and the good for others are in tension.","a":[["Mill argues that the only real freedom is the freedom to pursue our own good in our own way, as long as we do not stop others pursuing theirs.","I"],["Each person is the rightful guardian of their own health of body and mind.","I"],["Mill would largely reject the view that the good for the individual and the good for others are in tension.","L"],["He thinks people gain more when each is left to live as they choose than when everyone is made to live as others think best, so individual freedom is good for everyone.","L"],["The tension only appears when one person’s choices harm another.","L"],["However, the line is not always clear.","N"],["Elsewhere Mill admits that whatever affects a person may affect others through them.","N"]],"bQ":"How might one other thinker studied in Unit 3 respond to Mill’s view on the relationship between the good for the individual and the good for others?","b":[{"label":"Allen","thinker":"Allen","s":[["Allen would agree with Mill that the good for the individual and the good for others can fit together, but she asks for more than not harming each other.","I"],["Mill says “mankind are greater gainers by suffering each other to live as seems good to themselves”.","I"],["Allen would say a rule against harm cannot hold society together.","R"],["She calls it “a sad mistake” to think the common good results if every citizen “simply pursues her own self-interest without reservation”.","R"],["Citizens need “equitable self-interest”, which “treats the good of others as part of one’s own interests”.","R"],["So both think individuals and communities can thrive together, but for Mill this mainly needs people not to harm each other, while for Allen it needs them to make sacrifices.","N"]]},{"label":"de Beauvoir","thinker":"de Beauvoir","s":[["De Beauvoir would agree with Mill that freedom is central to a good life, but she ties the individual’s good more closely to the good of others.","I"],["Both oppose forcing a way of life on people.","I"],["Mill rejects “compelling each to live as seems good to the rest”, and de Beauvoir condemns those who “impose a credo”.","I"],["However, Mill mainly asks us not to “impede” others.","R"],["De Beauvoir says the freedom of others “must be respected and they must be helped to free themselves”.","R"],["Her reason is that “every man needs the freedom of other men”.","R"],["So for Mill my good and yours are mostly compatible if we do not harm each other, while for de Beauvoir mine depends on yours.","N"]]}],"cQ":"To what extent should we be free to pursue our own good in our own way? Provide your own justified response to this question. Support your reasoning with an example.","c":[["I think we should be free to pursue our own good in our own way to a large extent, because nobody else can know for certain what will make my life go well.","P"],["The limit is harm to others.","R"],["For example, imagine a student who gets a high ATAR and chooses a carpentry apprenticeship when her parents want her to study law.","E"],["Her parents may honestly believe law is better for her.","E"],["However, she has to live the life, and a career chosen to please them might leave her successful and unhappy.","E"],["Someone might argue that her parents have more experience and she may regret it.","D"],["I agree that she should listen to them, but listening is different from obeying.","D"],["If she is wrong, the mistake is hers and she can learn from it.","D"],["So we should be free to choose our own good, provided nobody else is harmed.","D"]]},{"id":"q35","n":4,"thinker":"de Beauvoir","title":"the adventurer","aC":"individual and others","cC":"the freedom of others","sum":"The adventurer always meets others, and every undertaking affects them; freedom can will itself only by seeking an open future through the freedom of others, who must be respected and helped to free themselves.","stim":["But even if we consider adventure in its purity, it appears to us to be satisfying only at a subjective moment, which, in fact, is a quite abstract moment. The adventurer always meets others along the way; the conquistador meets the Indians; the condottiere hacks out a path through blood and ruins; the explorer has comrades about him or soldiers under his orders; every Don Juan is confronted with Elviras. Every undertaking unfolds in a human world and affects men. What distinguishes adventure from a simple game is that the adventurer does not limit himself to asserting his existence in solitary fashion. He asserts it in relationship to other existences. He has to declare himself.","Two attitudes are possible. He can become conscious of the real requirements of his own freedom, which can will itself only by destining itself to an open future, by seeking to extend itself by means of the freedom of others. Therefore, in any case, the freedom of other men must be respected and they must be helped to free themselves. Such a law imposes limits upon action and at the same time immediately gives it a content. Beyond the rejected seriousness is found a genuine seriousness. But the man who acts in this way, whose end is the liberation of himself and others, who forces himself to respect this end through the means which he uses to attain it, no longer deserves the name of adventurer."],"src":"S de Beauvoir, The Ethics of Ambiguity, trans. Bernard Frechtman, Open Road Integrated Media, New York, 2015","aQ":"With reference to the passage above, explain how de Beauvoir might respond to the view that we can pursue our own good without considering the good of others.","a":[["De Beauvoir argues that the adventurer, who acts for the enjoyment of acting, never acts alone.","I"],["Every explorer or conqueror meets other people, and every undertaking affects those around it.","I"],["A person’s own freedom can only keep going by reaching towards an open future, and that future depends on other people being free too.","I"],["De Beauvoir would therefore reject the view that we can pursue our own good without considering the good of others.","L"],["We must respect other people’s freedom and help them to free themselves, because our own freedom depends on theirs.","L"],["However, she does not condemn the adventurer’s energy.","N"],["Elsewhere she says his attitude is very close to a moral one, since he throws himself into life without expecting things to justify him.","N"]],"bQ":"How might one other thinker studied in Unit 3 respond to de Beauvoir’s view on the relationship between the good for the individual and the good for others?","b":[{"label":"Nietzsche","thinker":"Nietzsche","s":[["Nietzsche would reject de Beauvoir’s view that our own good requires us to care about the good of others.","I"],["Her adventurer, who “likes action for its own sake”, has the overflowing energy that Nietzsche would count as living well.","I"],["His noble person acts from a “feeling of plenitude, of power which seeks to overflow”.","I"],["De Beauvoir thinks this falls short, because other people “must be helped to free themselves”.","R"],["Nietzsche sees no such duty, since “one has duties only towards one’s equals”.","R"],["However, both criticise people who simply accept the values they are handed.","N"],["So both think living well means setting our own values, but de Beauvoir thinks our freedom depends on freeing others, while Nietzsche thinks the noble individual owes the many nothing.","N"]]},{"label":"Allen","thinker":"Allen","s":[["Allen would agree with de Beauvoir that we cannot pursue our own good without considering the good of others.","I"],["Allen describes “rivalrous self-interest” as “a commitment to one’s own interests without regard to how they affect others”.","I"],["De Beauvoir’s adventurer is not chasing gain, but he shows the same disregard for how his actions affect others.","R"],["Both ask for more than leaving others alone.","R"],["Allen wants “real habits of power sharing”, and de Beauvoir wants others “helped to free themselves”.","R"],["However, Allen argues from self-interest, “for my own long-term good”.","N"],["De Beauvoir argues from freedom, which can only “extend itself by means of the freedom of others”.","N"],["So both join my good to yours, but Allen does it through self-interest and de Beauvoir through freedom.","N"]]}],"cQ":"Can we truly be free if others are not? Provide your own justified response to this question. Support your reasoning with an example.","c":[["I do not think we can be truly free if others are not, because many of our own choices depend on people who have very few.","P"],["For example, Walk Free estimates that Australia imports about US$17 billion of goods a year that are at risk of being made with forced labour, mostly electronics and clothing.","E"],["When I buy a cheap T-shirt I feel free, since I can pick what I like.","E"],["However, that choice may only exist because someone else was forced to work.","E"],["Someone might argue that freedom is about my options, so another person’s situation cannot reduce it.","D"],["I disagree, because a freedom that relies on other people being unfree is really a privilege, and it ties my choices to their suffering.","D"],["So I do not think we are truly free while our everyday choices depend on other people being forced to work.","D"]]},{"id":"q36","n":5,"thinker":"Nietzsche","title":"the herd and the individual","aC":"individual and community","cC":"excellence","sum":"When strong drives lift an individual above the herd, the community loses its confidence and brands those drives evil, while the modest, obedient and average is honoured as moral.","stim":["When the highest and strongest drives, breaking passionately out, carry the individual far above and beyond the average and lowlands of the herd conscience, the self-confidence of the community goes to pieces, its faith in itself, its spine as it were, is broken: consequently it is precisely these drives which are most branded and calumniated. Lofty spiritual independence, the will to stand alone, great intelligence even, are felt to be dangerous; everything that raises the individual above the herd and makes his neighbour quail is henceforth called evil; the fair, modest, obedient, self-effacing disposition, the mean and average in desires, acquires moral names and honours. Eventually, under very peaceful conditions, there is less and less occasion or need to educate one’s feelings in severity and sternness; and now every kind of severity, even severity in justice, begins to trouble the conscience; a stern and lofty nobility and self-responsibility is received almost as an offence and awakens mistrust, ‘the lamb’, even more ‘the sheep’, is held in higher and higher respect."],"src":"F Nietzsche, Beyond Good and Evil, trans. R. J. Hollingdale, Penguin Classics, London, 2003, pp. 87–88","aQ":"With reference to the passage above, explain how Nietzsche might respond to the view that the good of the community should come before the good of the individual.","a":[["Nietzsche argues that when a person’s strongest drives lift them far above the average, the community loses confidence in itself, so it attacks those drives.","I"],["Independence and even great intelligence come to be seen as dangerous and are called evil, while being modest, obedient and average is praised as moral.","I"],["Nietzsche would therefore reject the view that the good of the community should come before the good of the individual.","L"],["For him this is the herd protecting its own comfort out of fear, and the price is paid by the people capable of the most.","L"],["However, he does not think the two must always conflict.","N"],["Elsewhere he says these same strong drives were once honoured, because the community needed them for protection against its enemies.","N"]],"bQ":"How might one other thinker studied in Unit 3 respond to Nietzsche’s view on the relationship between the good for the individual and the good for others?","b":[{"label":"Allen","thinker":"Allen","s":[["Allen would reject Nietzsche’s view that the good of the community is opposed to the good of the individual.","I"],["Nietzsche thinks the community honours “the mean and average” and brands whatever “raises the individual above the herd” as “evil”.","I"],["Allen argues that a good community protects each person’s “autonomy”, and that citizens can pursue “liberty and equality simultaneously”.","R"],["However, both criticise a morality that grows out of fear.","N"],["Nietzsche says of the herd that “fear is the mother of morality”, and Allen criticises Hobbes because he “reduced citizenship to fear”.","N"],["So neither thinks fear is a good basis for a community’s values, but Nietzsche concludes that the individual must rise above the community, while Allen thinks a community built on trust lets individuals thrive.","N"]]},{"label":"Aristotle","thinker":"Aristotle","s":[["Aristotle would reject Nietzsche’s view that the individual’s good is found by rising above the community.","I"],["Nietzsche praises “the will to stand alone”.","I"],["Aristotle argues that “man is a political creature and one whose nature is to live with others”, and that “no one would choose the whole world on condition of being alone”.","R"],["He even says it is “finer and more godlike” to attain the good for a city than for one person.","R"],["However, Aristotle is no admirer of the many.","N"],["He says “the mass of mankind are evidently quite slavish in their tastes”.","N"],["So both set excellence above what most people settle for, but Aristotle thinks excellence is achieved among others and for them, while Nietzsche thinks the community holds it back.","N"]]}],"cQ":"Does society suppress the potential for individual excellence? Provide your own justified response to this question. Support your reasoning with an example.","c":[["I think society does more to create individual excellence than to suppress it, because talent needs training and support that only other people can provide.","P"],["For example, after Australia won no gold medals at the 1976 Olympics, the government set up the Australian Institute of Sport in 1981 to train talented athletes with public money.","E"],["At the 2024 Paris Olympics Australia won 18 gold medals, its best result ever.","E"],["Those athletes are exceptional individuals, but coaches, facilities and taxpayers helped them get there.","E"],["Someone might argue that society still resents people who stand out, and that this pressure stops many from trying.","D"],["I agree this happens, and it is a real loss.","D"],["However, even the most gifted person needs teachers, opportunities and people who value what they do.","D"],["So society sometimes discourages excellence, but far more often it is what makes excellence possible.","D"]]}]}]}],"stim":[{"id":"s1","n":1,"bq":"What is the nature of happiness and what is its role in the good life?","bqId":"aos1-bq2","aos":"aos1","title":"Elon Musk","intro":"Read the following extract about Elon Musk.","stim":["\"So curious that such a wealthy man never posts anything that indicates that he enjoys or is even aware of what virtually everyone appreciates — scenes from nature, pet dog or cat, praise for a movie, music, a book (but doubt that he reads); pride in a friend's or relative's accomplishment; condolences for someone who has died; pleasure in sports, acclaim for a favorite team; references to history. In fact he seems totally uneducated, uncultured. The poorest persons on Twitter may have access to more beauty & meaning in life than the 'most wealthy person in the world.'","But the sad and somewhat degrading fact is that this man is unquestionably important. If we want to think in any kind of consequential way about the present and the future, we have no choice but to take Musk seriously — if not as a man, then as a manifestation.\""],"img":null,"aQ":"Does the good life require engagement with beauty, culture and human connection? Using Musk as your central example, provide your own justified response to this question.","a":[["I think the good life does require engagement with beauty, culture and human connection, because these are what make a life good for the person living it and not only impressive to others.","P"],["The writer points out that Musk, the wealthiest person in the world, never posts about nature, a pet, music, a book, pride in a friend or condolences for a death.","E"],["These things cost almost nothing, which fits the writer’s remark that the poorest people on Twitter may have more beauty and meaning than he does.","E"],["Someone might argue that Musk is “unquestionably important”, and that changing the future gives a life meaning.","D"],["However, importance measures a person’s effect on the world, not how their own life is going.","D"],["If the writer’s picture is accurate, Musk has wealth and influence but is missing what makes life worth living.","D"],["So these things are necessary for a good life.","D"]],"bQ":"Compare how two thinkers studied in Unit 3 might respond to the writer’s claim that a person can be “unquestionably important” while lacking what gives life beauty and meaning. Justify your response.","pair":["Aristotle","Nietzsche"],"pairLabel":"Aristotle and Nietzsche","b":[["Aristotle would agree that a person can be important while lacking a good life.","1"],["He says honour is “too superficial” to be the good, because it depends “on those who bestow honour”, and that wealth is “merely useful and for the sake of something else”.","1"],["For him happiness needs other people, since “no one would choose the whole world on condition of being alone”.","1"],["Nietzsche would accept that an important person can lack these things, but not that it matters.","2"],["He distrusts majority taste, since the herd calls “evil” whatever “raises the individual above the herd”, and he says “solitude is with us a virtue”.","2"],["What he admires is the noble type who “creates values”.","2"],["So both deny that other people’s approval makes a life good, but Aristotle thinks an important life without friendship is incomplete, while Nietzsche thinks a great life may have to do without ordinary pleasures.","X"]],"cQ":"Which of the two responses you discussed in part (b) do you find more compelling? Justify your answer.","c":[["I find Aristotle’s response more compelling.","P"],["Nietzsche is right that what most people like is not a reliable guide to a good life, and that great achievements can demand sacrifice.","R"],["However, he treats solitude as a virtue and ordinary pleasures as secondary, so he cannot explain what the writer thinks is missing from Musk’s life.","R"],["Aristotle explains how the writer can call Musk important and still think his life is lacking.","R"],["Honour and influence depend on others’ attention, while a good life has to be something of one’s own, made up of excellent activity shared with friends.","R"],["Someone might object that Aristotle is only defending an ordinary, sociable life.","D"],["I disagree, because he does not ask everyone to enjoy the same things.","D"],["He asks that a person act well and not live alone.","D"],["A person could change the world and still do that, so Aristotle sets the better standard.","D"]]},{"id":"s2","n":2,"bq":"What role do pleasure and self-discipline play in a good life?","bqId":"aos1-bq1","aos":"aos1","title":"Saxon, The White Lotus","intro":"Read the following exchange from the television series White Lotus (Season 3). Saxon is a wealthy young man on holiday in Thailand.","stim":[],"img":{"src":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wgARCAHQA8ADASIAAhEBAxEB/8QAGwAAAwEBAQEBAAAAAAAAAAAAAQIDAAQFBgf/xAAZAQEBAQEBAQAAAAAAAAAAAAAAAQIDBAX/2gAMAwEAAhADEAAAAfiOfs5pJZtS5jCliZmaVNTSzFRU8xFFBE8+JigpTsKrrYobImYUMcDNhWzymmpmqXMo9vg+h83pp09NvJ14l7Us5D1E5t1E5d181nN8l1fP+zgoI9XnGOQYkGbA2BjsvT2+S+b602ty3yi61JmeOZq6gz0jl1dUhcIi9Cy86dCazzMwsrTj6Zq6vbGuROxLOUdC2QagFzsSFSR1gTWxOaXZLU5U6E1mOoLJim  in life, that’s happiness bro","caption":"Saxon: It is good to want things, as long as you can get them, getting what you want in life, that’s happiness bro"},"aQ":"Does the good life require more than the satisfaction of one’s desires? Using Saxon as your central example, provide your own justified response to this question.","a":[["I think the good life requires more than satisfying our desires, because what matters is also what we want and what we become by pursuing it.","P"],["Saxon says it is good to want things “as long as you can get them”, and that getting what you want is happiness.","E"],["As a wealthy young man, he can buy almost anything, so by his definition he is already happy.","E"],["However, his rule means only wanting what we are sure to get.","R"],["That leaves out goals we might fail at, such as mastering a skill or building a lasting relationship.","R"],["Someone might argue that Saxon feels satisfied, so nobody can tell him he is unhappy.","D"],["He may feel content, but feeling satisfied is different from living well.","D"],["A life with no risk of failure has no achievement either.","D"],["So satisfying desires is part of a good life, but not the whole of it.","D"]],"bQ":"Compare how two thinkers studied in Unit 3 might respond to Saxon’s claim that happiness consists in wanting things and being able to get them. Justify your response.","pair":["Nietzsche","Singer"],"pairLabel":"Nietzsche and Singer","b":[["Nietzsche would reject Saxon’s claim because it avoids the hardship a person needs to grow.","1"],["Saxon only wants things he can get.","1"],["Nietzsche says “wellbeing as you understand it” is “no goal” and makes a person “ludicrous and contemptible”, and that “the discipline of suffering” has “created every elevation of mankind”.","1"],["A noble person “enjoys practising severity and harshness upon himself”, so he would tell Saxon to want what is difficult.","1"],["Singer would object on moral grounds, whatever happiness turns out to be.","2"],["He says that when we buy clothes to look “well-dressed” we meet no “important need”, and that people with the means “ought to give as much as possible”.","2"],["So both would criticise a life spent on easy satisfaction, for different reasons.","X"],["They also disagree about suffering.","X"],["Singer assumes suffering from hunger is “bad” and should be prevented, while Nietzsche thinks a life without hardship cannot become great.","X"]],"cQ":"Which of the two responses you discussed in part (b) do you find more compelling? Justify your answer.","c":[["I find Nietzsche’s response more compelling, because it explains what is wrong with Saxon’s idea of happiness itself.","P"],["Singer makes an important point, since Saxon’s ability to get whatever he wants could be used to help people in need.","R"],["However, that criticises how Saxon spends his money.","R"],["A poorer person who only wanted what they were sure to get would be making the same mistake.","R"],["Nietzsche’s view shows that the problem is in the phrase “as long as you can get them”.","R"],["If Saxon never wants anything he might fail at, he never finds out what he is capable of.","R"],["Someone might object that Nietzsche glorifies suffering, when much suffering only harms people.","D"],["I agree that hardship is not good in itself.","D"],["However, the things most worth having usually involve difficulty and the risk of failure, and Saxon’s rule leaves them out.","D"],["So Nietzsche gives the better answer.","D"]]},{"id":"s3","n":3,"bq":"What role do love and friendship play in the good life?","bqId":"aos1-bq3","aos":"aos1","title":"Cancelled plans","intro":"Read the following extract.","stim":["A growing genre of social media content celebrates the relief of cancelled plans. Posts describing the joy of a friend’s last-minute cancellation routinely attract millions of likes, with comments like “It’s not that I hate going out — I just love not going out more” and “Social interaction is great, but have you ever tried staying home and doing absolutely nothing?” For many young people, the “social battery” has become a familiar concept: social connection is treated as an energy cost to be managed, and solitude as the reward for getting through it."],"img":null,"aQ":"Does the good life require love and friendship, or can a life of chosen solitude be a good life? Using the attitude described in the extract as your central example, provide your own justified response to this question.","a":[["I think the good life requires love and friendship, although it also needs time alone.","P"],["The attitude in the extract treats social connection as an energy cost and solitude as the reward.","E"],["I understand the relief of a cancelled plan, and the comment “I just love not going out more” is at least honest.","E"],["However, if every plan feels like a drain on a “social battery”, people stop making the effort friendship needs, and friendships fade without it.","R"],["It is telling that these posts get millions of likes.","E"],["People are sharing their love of being alone with other people, which suggests they still want to be understood.","E"],["Someone might argue that chosen solitude can be a good life.","D"],["I think it can be part of one, but the people in the extract still have friends making plans with them.","D"],["With nobody making plans, solitude would stop being a reward.","D"]],"bQ":"Compare how two thinkers studied in Unit 3 might respond to the claim that social connection is an energy cost to be managed rather than a necessary part of a good life. Justify your response.","pair":["Cicero","Nietzsche"],"pairLabel":"Cicero and Nietzsche","b":[["Cicero would reject the claim.","1"],["He says “we need friendship all the time, just as much as we need” fire and water, and that it “can never be in the way”.","1"],["He would object to treating friends as a cost, because real friendship “cannot under any circumstances be derived from any calculation of potential profit”.","1"],["Nietzsche would partly accept the claim.","2"],["He calls solitude “a virtue” and says “all community makes somehow, somewhere, sometime” a person “common”.","2"],["However, he would not approve of staying home for comfort, since “wellbeing as you understand it” is “no goal”.","2"],["Both are selective.","X"],["Cicero says true friendship is “so choice and selective” that it is limited to few, and noble morality includes “a refined conception of friendship”.","X"],["So neither defends constant socialising, but Cicero thinks a good life is impossible without close friends, while Nietzsche thinks the best people need distance from most company.","X"]],"cQ":"Which of the two responses you discussed in part (b) do you find more compelling? Justify your answer.","c":[["I find Cicero’s response more compelling.","P"],["Nietzsche is right that time alone has value, and that being around people constantly can push us to go along with the crowd.","R"],["However, he describes solitude as something for exceptional people, which does not fit the tired young people in the extract.","R"],["Cicero explains what they risk losing.","R"],["He imagines a person given everything they could need but no human company, and says nobody could bear it.","R"],["That seems true to me, because even good experiences feel smaller when there is nobody to tell.","R"],["Someone might object that Cicero’s ideal friendship is rare and demanding, and has little to do with ordinary social plans.","D"],["This supports him.","D"],["He is not saying we must go to everything.","D"],["He is saying that a few real friendships are necessary, and I think those only last if we keep turning up.","D"],["So Cicero gives the better response.","D"]]},{"id":"s4","n":4,"bq":"To what extent is the good life dependent on freedom and authenticity?","bqId":"aos1-bq4","aos":"aos1","title":"The trad wife movement","intro":"Read the following extract.","stim":["The “trad wife” movement has gained millions of followers on social media, with young women posting content celebrating homemaking, mothering, and traditional gender roles as a deliberate lifestyle choice. Many frame their decision as an act of freedom: a rejection of corporate work culture and its pressures in favour of a life they find more meaningful. “Submission to a boss or submission to a husband — at least this way I chose it,” one popular creator explained. Critics argue that freely choosing to give up your independence is not freedom at all, and that a choice shaped by the very structures it submits to cannot be truly authentic."],"img":null,"aQ":"To what extent is the good life dependent on freedom and authenticity? Using the trad wife movement as your central example, provide your own justified response to this question.","a":[["I think the good life depends on freedom and authenticity, but freedom means being able to keep choosing, not choosing once.","P"],["The creators present homemaking as a deliberate choice and a rejection of corporate work.","E"],["One says that whether it is submission to a boss or to a husband, “at least this way I chose it”.","E"],["She has a point, because a job also means doing what someone else wants, and caring for a family can be meaningful.","R"],["However, “submission” worries me.","R"],["A woman who gives up her own income may be unable to leave if things change, so one free choice could cost her freedom later.","R"],["Critics say a choice shaped by tradition cannot be authentic, but every choice is shaped by something.","D"],["What matters is whether she knows her options and can change her mind.","D"],["So this life can be good, but only while it remains her choice.","D"]],"bQ":"Compare how two thinkers studied in Unit 3 might respond to the claim that freely choosing to have less freedom can be an authentic way to live well. Justify your response.","pair":["Mill","de Beauvoir"],"pairLabel":"Mill and de Beauvoir","b":[["Mill would accept the claim, since real freedom is “pursuing our own good in our own way”.","1"],["He defends “framing the plan of our life to suit our own character” even if others “think our conduct foolish, perverse, or wrong”.","1"],["Critics may argue but not pressure these women, since Mill counts “the moral coercion of public opinion” as control.","1"],["He assumes an adult who is “not forced or deceived”.","1"],["De Beauvoir would be more doubtful.","2"],["She is more forgiving of women who “inherit a long tradition of submission” with no alternative, but says a person who has “the necessary instruments to escape” ready-made values and will not use them “consumes his freedom in denying them”.","2"],["So both think a life must be chosen and not imposed, but for Mill free choice rules out interference, while de Beauvoir asks whether the choice is a way of avoiding freedom.","X"]],"cQ":"Which of the two responses you discussed in part (b) do you find more compelling? Justify your answer.","c":[["I find de Beauvoir’s response more compelling, although Mill is right about one thing.","P"],["He is right that nobody should pressure these women out of a life they have chosen, and that others thinking a choice “foolish” gives them no right to stop it.","R"],["However, the claim is also about authenticity, and Mill assumes a free choice suits “our own character”.","R"],["For him, once an adult has chosen freely, nobody else may interfere.","R"],["De Beauvoir asks the harder question of why the choice was made.","R"],["A person can choose a role because they value it, or because it saves them from deciding anything else.","R"],["Someone might object that this is patronising, since nobody can judge another’s reasons.","D"],["I think the question is one each person has to ask themselves, and the creator raises it herself by calling her chosen life “submission”.","D"],["So de Beauvoir explains better what living authentically requires.","D"]]},{"id":"s5","n":5,"bq":"What obligations, if any, do we have to others?","bqId":"aos2-bq1","aos":"aos2","title":"Nobody owes you anything","intro":"Read the following extract.","stim":["A recent post on the social media platform X read: “nobody owes you ANYTHING. not a text back. not a smile. not an explanation. not even loyalty or fair treatment.” The post received over 300,000 views. Similar content on TikTok, framing the rejection of obligation to others as self-care, has attracted hundreds of thousands of likes."],"img":null,"aQ":"What obligations, if any, do we have to others? Using the view expressed in the post as your central example, provide your own justified response to this question.","a":[["I think we do have obligations to others, although the post is partly right.","P"],["It lists “a text back” and “a smile”, and I agree nobody is entitled to my time whenever they want it.","E"],["However, it goes wrong when it says we are not owed “even loyalty or fair treatment”.","E"],["A text back is a favour, but fair treatment is the minimum that lets people trust each other at all.","R"],["If nobody owes it, then the person who wrote the post is not owed it either, and I doubt they would accept being cheated.","R"],["Someone might argue that owing nothing to others protects us from being drained, which is why similar content is framed as self-care.","D"],["However, looking after myself does not require treating others unfairly.","D"],["So we owe everyone fair treatment, and loyalty to those close to us, even if our time is ours to give.","D"]],"bQ":"Compare how two thinkers studied in Unit 3 might respond to the claim that we do not owe others “even loyalty or fair treatment.” Justify your response.","pair":["Weil","Nietzsche"],"pairLabel":"Weil and Nietzsche","b":[["Weil would reject the claim.","1"],["She says “there exists an obligation towards every human being for the sole reason that he or she is a human being”, and that no one can escape such obligations “without being guilty of crime”.","1"],["The post changes nothing, becaus
