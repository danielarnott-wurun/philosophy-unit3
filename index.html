<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Philosophy Unit 3 Study Guide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<style>
/* Layout: a sticky masthead with three tabs over one reading column; each Big Question is a section of collapsible question cards. */
:root{
  --bg:#F5F6F8;
  --surface:#FFFFFF;
  --surface-2:#EDF0F4;
  --fg:#1B2130;
  --muted:#5D6779;
  --line:#D7DCE5;
  --line-strong:#B9C2D0;
  --ink:#1F3556;
  --ink-fg:#FFFFFF;
  --ink-soft:#E4EBF5;
  --focus:#2563EB;
  --s1:#1D4ED8; --s2:#047857; --s3:#B45309; --s4:#6D28D9;
  --s1t:rgba(37,99,235,.13); --s2t:rgba(5,150,105,.15); --s3t:rgba(217,119,6,.17); --s4t:rgba(124,58,237,.13);
  --quote-bg:#F8F6F1;
  --quote-line:#E2DCCF;
  --note-bg:#FFF6DF;
  --note-line:#F1D792;
  --shadow:0 1px 2px rgba(20,30,50,.06);
  --font-ui:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --font-serif:"Newsreader",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151E; --surface:#181D29; --surface-2:#202737; --fg:#E7EAF1; --muted:#9FA9BB;
    --line:#2C3447; --line-strong:#3E4A62; --ink:#9DBBE6; --ink-fg:#0F1726; --ink-soft:#243752; --focus:#7DA7F5;
    --s1:#7FB0FF; --s2:#4ADE9C; --s3:#F8BE5A; --s4:#C4A6FF;
    --s1t:rgba(96,165,250,.20); --s2t:rgba(52,211,153,.20); --s3t:rgba(251,191,36,.20); --s4t:rgba(167,139,250,.22);
    --quote-bg:#1D2230; --quote-line:#343C50; --note-bg:#2A2719; --note-line:#5A4D22; --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151E; --surface:#181D29; --surface-2:#202737; --fg:#E7EAF1; --muted:#9FA9BB;
  --line:#2C3447; --line-strong:#3E4A62; --ink:#9DBBE6; --ink-fg:#0F1726; --ink-soft:#243752; --focus:#7DA7F5;
  --s1:#7FB0FF; --s2:#4ADE9C; --s3:#F8BE5A; --s4:#C4A6FF;
  --s1t:rgba(96,165,250,.20); --s2t:rgba(52,211,153,.20); --s3t:rgba(251,191,36,.20); --s4t:rgba(167,139,250,.22);
  --quote-bg:#1D2230; --quote-line:#343C50; --note-bg:#2A2719; --note-line:#5A4D22; --shadow:none;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:16px;line-height:1.55}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Masthead */
.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.mast-in{max-width:900px;margin:0 auto;padding-inline:16px}
.mast-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-block:12px 4px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.mast h1{font-family:var(--font-serif);font-weight:500;font-size:22px;line-height:1.1;margin:0;color:var(--ink);text-wrap:balance}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px 9px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;font-size:14px;border-radius:6px 6px 0 0}
.tab:hover{background:var(--surface-2);color:var(--fg)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab .long{display:inline}.tab .shortl{display:none}
@media (max-width:560px){.tab .long{display:none}.tab .shortl{display:inline}}

/* Page column */
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:20px 72px}
.panel[hidden]{display:none}
.panel-head{margin:4px 0 18px}
.panel-head h2{font-family:var(--font-serif);font-weight:500;font-size:30px;line-height:1.1;margin:0 0 6px;color:var(--ink);text-wrap:balance}
.panel-head p{margin:0;color:var(--muted);max-width:62ch}

/* Toolbar */
.toolbar{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:22px}
.tb-row{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.tb-label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-right:2px}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;line-height:1.3;color:var(--fg)}
.chip:hover{background:var(--surface-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.chip .ct{opacity:.7;font-size:12px;margin-left:3px}
.bqrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.bqchip{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:8px 12px;font-size:14px;line-height:1.35;cursor:pointer;color:var(--fg);min-width:0}
.bqchip:hover{background:var(--surface-2)}
.bqchip .n{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto}
.bqchip[aria-pressed="true"]{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.bqchip[aria-pressed="true"] .n{color:var(--ink-fg);opacity:.75}
@media (max-width:640px){.bqrow{grid-template-columns:1fr}}
.switch{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);border-radius:999px;padding:4px 11px 4px 6px;background:var(--surface);cursor:pointer;font-size:13px}
.switch:hover{background:var(--surface-2)}
.knob{width:30px;height:18px;border-radius:999px;background:var(--line-strong);position:relative;transition:background .15s}
.knob::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch[aria-checked="true"] .knob{background:var(--ink)}
.switch[aria-checked="true"] .knob::after{transform:translateX(12px)}
.tb-sep{flex:1 1 auto}
.linkbtn{background:none;border:0;padding:4px 2px;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13px}
.filter-note{font-size:14px;color:var(--muted);margin:-8px 0 16px}
.filter-note[hidden]{display:none}

/* Big Question sections */
.bq{margin-bottom:40px;scroll-margin-top:120px}
.bq-head{display:flex;flex-direction:column;gap:4px;margin-bottom:14px;padding-bottom:12px;border-bottom:2px solid var(--ink)}
.bq-head .eyebrow{color:var(--ink)}
.bq-head h3{font-family:var(--font-serif);font-weight:500;font-size:24px;line-height:1.2;margin:0;text-wrap:balance}
.bq-head .count{font-size:13px;color:var(--muted)}
.bq.empty{display:none}

/* Question cards */
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
.q[hidden]{display:none}
.q-head{width:100%;text-align:left;background:none;border:0;padding:14px 16px;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center}
.q-head:hover{background:var(--surface-2)}
.q-num{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;white-space:nowrap;padding-top:2px;align-self:start}
.q-title{min-width:0;line-height:1.35}
.q-title b{color:var(--ink)}
.q-title .t{color:var(--fg)}
.chev{width:18px;height:18px;flex:0 0 auto;color:var(--muted);transition:transform .2s}
.q.open .chev{transform:rotate(180deg)}
.q-sum{grid-column:2;font-size:14px;line-height:1.45;color:var(--muted);text-wrap:pretty}
.q-meta{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--muted)}
.q-meta:empty{display:none}
.tag{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;background:var(--surface-2)}
.tag .arr{color:var(--muted)}
.tag em{font-style:normal;color:var(--fg)}
.q-body{display:none;padding:4px 16px 18px;border-top:1px solid var(--line)}
.q.open .q-body{display:block}
.stim{font-family:var(--font-serif);font-size:17.5px;line-height:1.6;background:var(--quote-bg);border:1px solid var(--quote-line);border-radius:8px;padding:16px 20px;margin:14px 0 6px}
.stim p{margin:0 0 .7em}.stim p:last-child{margin-bottom:0}
.src{font-size:12.5px;color:var(--muted);margin:0 0 18px;text-align:right}
.part{margin:0 0 22px}
.part-q{display:grid;grid-template-columns:auto 1fr;gap:10px;margin-bottom:10px;font-weight:700;line-height:1.4}
.part-q .pl{font-family:var(--font-serif);font-size:19px;font-weight:600;color:var(--ink);line-height:1.2}
.alts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center}
.alt{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:4px 10px;font-size:13px;cursor:pointer}
.alt:hover{background:var(--surface-2)}
.alt[aria-pressed="true"]{background:var(--ink);color:var(--ink-fg);border-color:var(--ink);font-weight:700}
.alts .hint{font-size:12px;color:var(--muted);flex-basis:100%}
.resp{position:relative;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:12px 16px 14px}
.resp-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 12px;margin-bottom:8px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.wc{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.txt{font-size:16px;line-height:1.75;margin:0}
.seg{border-radius:3px;padding:1px 0;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.seglab{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-right:5px;vertical-align:.12em;white-space:nowrap}
.seg-1{background:var(--s1t)}.seg-2{background:var(--s2t)}.seg-3{background:var(--s3t)}.seg-4{background:var(--s4t)}
.seg-1 .seglab{color:var(--s1)}.seg-2 .seglab{color:var(--s2)}.seg-3 .seglab{color:var(--s3)}.seg-4 .seglab{color:var(--s4)}
.l1 i{background:var(--s1)}.l2 i{background:var(--s2)}.l3 i{background:var(--s3)}.l4 i{background:var(--s4)}
.l1{color:var(--s1)}.l2{color:var(--s2)}.l3{color:var(--s3)}.l4{color:var(--s4)}
body.plain .seg{background:none;padding:0}
body.plain .seglab{display:none}
body.plain .legend{display:none}
/* Practice mode */
.reveal{display:none}
body.practice .resp:not(.shown) .resp-top,body.practice .resp:not(.shown) .txt{display:none}
body.practice .resp:not(.shown) .reveal{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ink);color:var(--ink);background:var(--surface);border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:14px}
body.practice .resp:not(.shown) .reveal:hover{background:var(--ink-soft)}
.practice-tip{display:none;font-size:14px;color:var(--muted);margin:-8px 0 16px}
body.practice .practice-tip{display:block}

/* Writing guide */
.guide{display:grid;gap:18px}
.callout{background:var(--note-bg);border:1px solid var(--note-line);border-radius:10px;padding:14px 18px;font-size:15px}
.callout b{color:var(--fg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.card h3{margin:0 0 2px;font-family:var(--font-serif);font-weight:500;font-size:22px;color:var(--ink)}
.card .sub{margin:0 0 14px;color:var(--muted);font-size:14px}
.steps{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.step{display:grid;grid-template-columns:156px 1fr;gap:12px;align-items:start}
.step .sl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 9px;border-radius:6px;text-align:center;white-space:nowrap}
.step .sd{font-size:15px;line-height:1.55}
.step .sd b{display:block;margin-bottom:2px}
.sl-1{background:var(--s1t);color:var(--s1)}.sl-2{background:var(--s2t);color:var(--s2)}.sl-3{background:var(--s3t);color:var(--s3)}.sl-4{background:var(--s4t);color:var(--s4)}
@media (max-width:480px){.step{grid-template-columns:1fr;gap:6px}.step .sl{justify-self:start}}
.rules{margin:0;padding-left:20px;font-size:15px;display:grid;gap:6px}
.map{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.map h4{margin:0 0 8px;font-family:var(--font-serif);font-weight:500;font-size:19px;color:var(--ink)}
.map ol{margin:0;padding-left:22px;display:grid;gap:6px;font-size:15px}
.map a{text-decoration:none;border-bottom:1px solid var(--line-strong)}
.map a:hover{border-bottom-color:var(--ink)}
.map .ct{color:var(--muted);font-size:13px;white-space:nowrap}
.use{display:grid;gap:8px;margin:0;padding-left:20px;font-size:15px}
.stim-intro{font-size:14px;color:var(--muted);margin:14px 0 6px;font-weight:700}
.stim-intro+.stim{margin-top:0}
.stim-fig{margin:0 0 6px;border:1px solid var(--quote-line);border-radius:8px;overflow:hidden;background:var(--quote-bg)}
.stim-fig img{display:block;width:100%;height:auto;max-width:100%}
.stim-fig figcaption{font-family:var(--font-serif);font-size:16px;line-height:1.5;padding:10px 16px;color:var(--fg)}
.q-eyebrow{grid-column:2;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.pairlab{display:inline-block;border:1px solid var(--ink);background:var(--ink);color:var(--ink-fg);border-radius:6px;padding:4px 10px;font-size:13px;font-weight:700;margin-bottom:8px}
.group-head{margin:30px 0 12px;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.group-head:first-of-type{margin-top:0}
.group-head .eyebrow{color:var(--ink)}
.group-head h3{font-family:var(--font-serif);font-weight:500;font-size:24px;line-height:1.2;margin:2px 0 0;text-wrap:balance}
.tgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.tcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.tcard:hover{background:var(--surface-2)}
.tcard .tn{font-family:var(--font-serif);font-size:21px;font-weight:500;color:var(--ink);line-height:1.15}
.tcard .tt{font-size:13px;color:var(--muted);font-style:italic}
.tcard .tl{font-size:14px;line-height:1.45;color:var(--fg)}
.thead{display:flex;flex-direction:column;gap:6px;margin:8px 0 18px}
.thead .tn{font-family:var(--font-serif);font-size:30px;font-weight:500;color:var(--ink);line-height:1.1;text-wrap:balance}
.thead .tt{font-size:15px;color:var(--muted);font-style:italic}
.thead .cite{font-size:12.5px;color:var(--muted)}
.tline{font-family:var(--font-serif);font-size:19px;line-height:1.45;margin:0 0 14px;text-wrap:pretty;background:var(--quote-bg);border:1px solid var(--quote-line);border-radius:8px;padding:14px 18px}
.terms{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 24px}
.terms span{font-size:13px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 9px}
.tentry{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px 14px;margin-bottom:12px}
.tentry .eyebrow{display:block;margin-bottom:2px}
.tentry h4{font-family:var(--font-serif);font-weight:500;font-size:19px;line-height:1.25;margin:0 0 8px;text-wrap:balance}
.tentry p{margin:0;font-size:15.5px;line-height:1.65}
.tlinks{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;font-size:12.5px;color:var(--muted)}
.tlink{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:2px 10px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.tlink:hover{background:var(--ink-soft)}
.tlink .r{color:var(--muted)}
.tnote{font-size:14px;color:var(--muted);margin:0 0 16px}
.foot{margin-top:36px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.tag.role{background:var(--ink-soft);border-color:transparent;color:var(--ink);font-weight:700}
@media (max-width:560px){
  .mast h1{font-size:19px}
  .mast-top .eyebrow{display:none}
  .mast-top{padding-block:10px 2px}
  .panel-head h2{font-size:26px}
  .q-head{grid-template-columns:auto 1fr auto;padding:12px 14px}
  .q-body{padding:4px 14px 16px}
  .stim{font-size:16.5px;padding:14px 16px}
  .resp{padding:10px 12px 12px}
  .txt{font-size:15.5px}
  .bq{scroll-margin-top:110px}
}
</style>

</head>
<body>
<header class="mast">
  <div class="mast-in">
    <div class="mast-top">
      <h1>Unit 3 Study Guide</h1>
      <span class="eyebrow">VCE Philosophy · The Good Life · Section A</span>
    </div>
    <div class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" id="tab-guide" aria-controls="guide" aria-selected="false" data-tab="guide"><span class="long">Writing Guide</span><span class="shortl">Guide</span></button>
      <button class="tab" role="tab" id="tab-aos1" aria-controls="aos1" aria-selected="false" data-tab="aos1"><span class="long">AOS1 · Individual</span><span class="shortl">AOS1</span></button>
      <button class="tab" role="tab" id="tab-aos2" aria-controls="aos2" aria-selected="false" data-tab="aos2"><span class="long">AOS2 · Others</span><span class="shortl">AOS2</span></button>
      <button class="tab" role="tab" id="tab-stim" aria-controls="stim" aria-selected="false" data-tab="stim"><span class="long">Stimulus Questions</span><span class="shortl">Stimulus</span></button>
      <button class="tab" role="tab" id="tab-thinkers" aria-controls="thinkers" aria-selected="false" data-tab="thinkers"><span class="long">Thinkers</span><span class="shortl">Thinkers</span></button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="panel" id="guide" role="tabpanel" aria-labelledby="tab-guide" hidden></section>
  <section class="panel" id="aos1" role="tabpanel" aria-labelledby="tab-aos1" hidden></section>
  <section class="panel" id="aos2" role="tabpanel" aria-labelledby="tab-aos2" hidden></section>
  <section class="panel" id="stim" role="tabpanel" aria-labelledby="tab-stim" hidden></section>
  <section class="panel" id="thinkers" role="tabpanel" aria-labelledby="tab-thinkers" hidden></section>
  <p class="foot">All model responses draw only on the prescribed set text extracts. Model responses are one way of answering well, not the only way. Where part (b) offers more than one thinker, each tab is a complete alternative answer.</p>
</main>

<script id="data" type="application/json">{"aos":[{"id":"aos1","label":"AOS1","title":"The Good Life and the Individual","bqs":[{"id":"aos1-bq1","n":1,"text":"What role do pleasure and self-discipline play in a good life?","qs":[{"id":"q1","n":1,"thinker":"Nietzsche","title":"the discipline of suffering","aC":"self-discipline","cC":"suffering","sum":"Wellbeing as most people understand it is no goal; it is the discipline of great suffering that has produced every elevation of mankind.","stim":["… You want if possible – and there is no madder ‘if possible’ – to abolish suffering; and we? – it really does seem that we would rather increase it and make it worse than it has ever been! Wellbeing as you understand it – that is no goal, that seems to us an end! A state which soon renders man ludicrous and contemptible – which makes it desirable that he should perish! The discipline of suffering, of great suffering – do you not know that it is this discipline alone which has created every elevation of mankind hitherto? That tension of the soul in misfortune which cultivates its strength, its terror at the sight of great destruction, its inventiveness and bravery in undergoing, enduring, interpreting, exploiting misfortune, and whatever of depth, mystery, mask, spirit, cunning and greatness has been bestowed upon it – has it not been bestowed through suffering, through the discipline of great suffering?"],"src":"F Nietzsche, Beyond Good and Evil, Penguin Group, London, 2003, p. 155","aQ":"With reference to the passage above, explain how Nietzsche might respond to the view that self-discipline is a key ingredient in the good life.","a":[["Nietzsche argues that trying to abolish suffering and make wellbeing the goal of life is a mistake, because comfort makes people ridiculous and contemptible.","I"],["He thinks the discipline of great suffering, the strain of living through misfortune and using it, is what has made humanity great, building strength, bravery and depth.","I"],["Enduring hardship in this way takes self-discipline.","I"],["Nietzsche would therefore agree that self-discipline is key to the good life, but only where it means facing hardship rather than avoiding it.","L"],["However, this is not the modest self-restraint that conventional morality praises.","N"],["Elsewhere he mocks the herd for honouring average desires, while his noble type enjoys being severe and harsh with himself.","N"],["Self-discipline matters to Nietzsche as a path to greatness, not as moderation.","N"]],"bQ":"How might one other thinker studied in Unit 3 respond to Nietzsche’s view on the role of self-discipline in the good life?","b":[{"label":"Aristotle","thinker":"Aristotle","s":[["Aristotle would agree with Nietzsche that self-discipline is needed for the good life, because it is how virtue is built.","I"],["He says we become temperate “by abstaining from pleasures”, and brave “by being habituated to despise things that are fearful”.","I"],["Like Nietzsche, he thinks character is built by facing what is hard.","R"],["However, the virtues this produces are very different.","N"],["Nietzsche’s discipline produces “cunning and greatness” through “great suffering”.","N"],["Aristotle’s virtues of temperance and courage are “preserved by the mean”, so the man who “goes to meet every danger becomes rash”.","N"],["He also says no one would call a life of “the greatest sufferings and misfortunes” happy.","N"],["So Aristotle’s self-discipline aims at a balanced and happy life, while Nietzsche’s aims at greatness.","N"]]},{"label":"Plato","thinker":"Plato","s":[["Plato, through Socrates, would agree that self-discipline is essential, but not Nietzsche’s kind.","I"],["For Socrates, self-discipline is “mastering the pleasures and desires which arise within oneself”, and its reward is “an orderly life, in which one is perfectly content with whatever is to hand”.","I"],["Where Nietzsche wants to increase suffering, Socrates sees it as the fate of the undisciplined person, who must work “day and night” to fill his leaking jars “or else suffer terribly”, while the disciplined one “can rest easy”.","R"],["Suffering, for Socrates, is a symptom of disordered desire, not a source of greatness.","R"],["Yet both prize mastery of oneself.","N"],["They differ on its purpose, since Socrates values it because it brings contentment, while Nietzsche thinks a contented life makes people contemptible.","N"]]}],"cQ":"What is the role of suffering in the good life? Provide your own justified response to this question. Support your reasoning with an example.","c":[["I think suffering can play a role in the good life, but only as something we respond to, not something we should seek.","P"],["Suffering has no value in itself, and what matters is what a person makes of it.","R"],["For example, after her eleven-year-old son Luke was killed by his father in 2014, Rosie Batty became one of Australia’s leading campaigners against family violence and was named Australian of the Year in 2015.","E"],["Her advocacy gave her loss a public meaning and helped change how the country talks about family violence.","E"],["Someone might argue this proves Nietzsche right, because suffering produced greatness.","D"],["However, it would be absurd to say her life was better for the loss, or that anyone should wish such pain on themselves.","D"],["The good came from her response, not the suffering.","D"],["So suffering can be an opportunity for strength, but it does not make a life good.","D"]]},{"id":"q2","n":2,"thinker":"Plato","title":"the leaky jars","aC":"self-discipline","cC":"pleasure","sum":"Two men gather rare liquids into jars. One man’s jars are sound, so once full he can rest; the other’s are cracked, so he must refill them day and night or suffer.","stim":["Imagine that both of them have a number of jars. The jars belonging to one of them are intact and are filled variously with wine, honey, milk, and so on and so forth. And suppose that each of these liquids is rare and hard to come by, and that it takes a great deal of strenuous work to get them. Now, once our first man has filled up his jars, he stops channelling the liquids into his jars and gives them no further thought; as far as they’re concerned, he can rest easy. The other character, however, is just as capable of getting the liquids – albeit with the same degree of difficulty – but his vessels are cracked and flawed, and he’s forced to work day and night at keeping them full, or else suffer terribly. If this is what the two lives are like, then, would you say that a life of self-indulgence is happier than one of self-restraint?"],"src":"Plato, Gorgias, trans. Robin Waterfield, Oxford World’s Classics, Oxford University Press, 2008","aQ":"With reference to the passage above, explain how Socrates might respond to the view that self-discipline is essential to the good life.","a":[["Socrates uses the metaphor of a leaky jar to show that a life without self-discipline can never be satisfied.","I"],["He imagines two men who work hard to gather rare liquids.","I"],["The disciplined man’s jars are sound, so once they are full he can stop and rest.","I"],["The self-indulgent man’s jars are cracked, so he must keep refilling them day and night or suffer.","I"],["The cracks represent desire with no limit.","I"],["Socrates would therefore agree that self-discipline is essential to the good life, because it is the only path to contentment.","L"],["However, he does not reject pleasure altogether.","N"],["The disciplined man’s jars hold wine, honey and milk, and elsewhere Socrates criticises Callicles for failing to tell good pleasures from bad.","N"],["Self-discipline means ruling desire, not removing it altogether.","N"]],"bQ":"How might one other thinker studied in Unit 3 respond to Socrates’ view on the role of self-discipline in the good life?","b":[{"label":"Nietzsche","thinker":"Nietzsche","s":[["Nietzsche would agree that self-discipline matters, but not for Socrates’ reason.","I"],["Socrates values discipline because it spares the disciplined man suffering and lets him rest.","R"],["For Nietzsche, that goal is the problem.","R"],["“Wellbeing as you understand it” is “no goal”, but a state that “renders man ludicrous and contemptible”.","R"],["The discipline he values is “the discipline of suffering, of great suffering”, which “alone... has created every elevation of mankind”.","R"],["So where Socrates’ discipline avoids suffering, Nietzsche’s embraces it.","R"],["Yet both reject a life ruled by pleasure.","N"],["Nietzsche dismisses any philosophy that judges life by “pleasure and pain” as naive, and Socrates rejects the life of endless pouring.","N"]]},{"label":"Aristotle","thinker":"Aristotle","s":[["Aristotle would agree with Socrates that self-discipline is essential to the good life.","I"],["He sees it as a habit that builds character, since “by abstaining from pleasures we become temperate”, and once we are temperate we find it easier to abstain.","I"],["The person who “indulges in every pleasure and abstains from none becomes self-indulgent”, like the owner of Socrates’ leaky jars.","R"],["However, Aristotle adds a warning Socrates does not give.","N"],["Self-discipline can go too far, because whoever “shuns every pleasure, as boors do, becomes in a way insensible”.","N"],["So both think self-discipline leads to a good life, but Socrates aims at being “content with whatever is to hand”, while Aristotle aims at enjoying pleasure in the right amount, which is learned through practice.","N"]]}],"cQ":"Can a person who constantly pursues pleasure ever be truly satisfied? Provide your own justified response to this question. Support your reasoning with an example.","c":[["I do not think a person who constantly pursues pleasure can be truly satisfied, because the pursuit changes what counts as enough.","P"],["Each pleasure we reach becomes the new normal, so the next one has to be bigger.","R"],["For example, a well-known 1978 study of American lottery winners found they were no happier than people who had not won, and that they took less pleasure in ordinary things like talking with a friend or hearing a joke.","E"],["Winning had raised the bar, so someone who keeps chasing pleasure is like the man refilling Socrates’ leaky jars.","E"],["Callicles might reply that satisfaction was never the point, since a satisfied person feels nothing, like a stone.","D"],["However, the winners were not enjoying life more either, because the big win made ordinary pleasures weaker.","D"],["So I think satisfaction depends on being able to say “enough”, and that takes the self-discipline Callicles rejects.","D"]]},{"id":"q3","n":3,"thinker":"Plato","title":"itching and scratching","aC":"pleasure","cC":"desire","sum":"Callicles says happiness is feeling desire and satisfying it. Socrates asks whether a lifetime of itching and scratching would then be a happy life, and whether any pleasure is not good.","stim":["Socrates: Tell me, though: is being hungry, and eating when one’s hungry, an example of the kind of thing you’re thinking of?","Callicles: Yes.","Socrates: And being thirsty and drinking when one’s thirsty?","Callicles: Yes, and experiencing desire in all its other forms too, and being able to feel pleasure as a result of satisfying it and so to live happily.","Socrates: Thank you very much. This is an excellent beginning, and I hope you can carry on in the same vein without embarrassment. Actually, I’d better suppress my sense of propriety too, it seems. The main question I want to ask is whether a lifetime spent scratching, itching and scratching, no end of scratching, is also a life of happiness… Could you tell me once and for all whether in your opinion the pleasant and the good are the same, or whether there’s even one pleasure which isn’t good?"],"src":"Plato, Gorgias, trans. Robin Waterfield, Oxford World’s Classics, Oxford University Press, 2008","aQ":"With reference to the passage above, explain how Socrates might respond to the view that pleasure plays an important role in the good life.","a":[["Callicles claims happiness comes from feeling desire and enjoying the pleasure of satisfying it, like eating when hungry.","I"],["Socrates tests this with the image of someone who spends his whole life itching and scratching.","I"],["If pleasure alone made a life happy, that life would be happy too, which is absurd.","I"],["Socrates would therefore challenge the view that pleasure plays an important role in the good life, because pleasure alone cannot make a life good.","L"],["He asks whether the pleasant and the good are the same thing, suspecting that some pleasures are not good.","L"],["However, he does not rule pleasure out.","N"],["Elsewhere he describes self-discipline as mastering our pleasures and desires, not removing them.","N"],["Pleasure belongs in the good life, but only when we master it.","N"]],"bQ":"How might one other thinker studied in Unit 3 respond to Socrates’ view on the role of pleasure in the good life?","b":[{"label":"Nietzsche","thinker":"Nietzsche","s":[["Nietzsche would agree with Socrates that pleasure cannot measure a good life, but he would go further.","I"],["Any view judging value “according to pleasure and pain” is, for him, a “foreground” way of thinking, because pleasure and pain are only “attendant and secondary phenomena”.","I"],["Anyone with “creative powers and an artist’s conscience” looks down on it.","I"],["So Nietzsche would reject the scratcher’s life, but not because the pleasure is a bad one.","R"],["The problem is that such a life creates nothing.","R"],["This is where he parts ways with Socrates.","R"],["By asking which pleasures are good, Socrates still treats pleasure as central to the question.","R"],["For Nietzsche, “there are higher problems than the problems of pleasure and pain”, and the whole debate misses them.","R"]]},{"label":"Wolf","thinker":"Wolf","s":[["Wolf would worry less than Socrates about too much pleasure, and more about too little.","I"],["When a saint gives up “his fishing trip or his stereo or his hot fudge sundae” without a second thought, we wonder “not at how much he loves morality, but at how little he loves these other things”.","I"],["For Wolf, being able to “enjoy the enjoyable in life” is part of living well, and such a saint seems “blind to some of what the world has to offer”.","I"],["So where Socrates warns against indulgence, Wolf warns against denial.","R"],["Still, neither thinks a pleasure is good just because it is pleasant.","N"],["Socrates asks which pleasures are good, and Wolf values the interests that contribute to “a healthy, well-rounded, richly developed character”.","N"]]}],"cQ":"Is happiness the satisfaction of desire? Provide your own justified response to this question. Support your reasoning with an example.","c":[["I do not think happiness is simply the satisfaction of desire, because getting what we want does not guarantee we are happy with it.","P"],["For example, Michael Phelps wanted to achieve something great, and he did, winning 23 Olympic gold medals, more than anyone in history.","E"],["Yet he has spoken openly, including in the 2020 documentary The Weight of Gold, about the depression that followed each Games.","E"],["If satisfying desire were happiness, he should have been among the happiest people alive.","E"],["Callicles might reply that Phelps simply needed a new desire to chase.","D"],["However, I think another personal goal would leave him where he started, because desires pursued only for ourselves can feel hollow once they are met.","D"],["Phelps has said that helping other people with depression is “light years better” than winning a gold medal.","D"],["So happiness depends less on satisfying desire than on sharing our lives with others.","D"]]},{"id":"q4","n":4,"thinker":"Aristotle","title":"excess, defect and the mean","aC":"pleasure","cC":"moderation","sum":"Like strength and health, the virtues are destroyed by excess and deficiency and preserved by the mean: indulging every pleasure makes a person self-indulgent, shunning every pleasure makes him insensible.","stim":["First, then, let us consider this, that it is the nature of such things to be destroyed by defect and excess, as we see in the case of strength and of health (for to gain light on things imperceptible we must use the evidence of sensible things); exercise either excessive or defective destroys the strength, and similarly drink or food which is above or below a certain amount destroys the health, while that which is proportionate both produces and increases and preserves it. So too is it, then, in the case of temperance and courage and the other virtues. For the man who flies from and fears everything and does not stand his ground against anything becomes a coward, and the man who fears nothing at all but goes to meet every danger becomes rash; and similarly the man who indulges in every pleasure and abstains from none becomes self-indulgent, while the man who shuns every pleasure, as boors do, becomes in a way insensible; temperance and courage, then, are destroyed by excess and defect, and preserved by the mean."],"src":"Aristotle, The Nicomachean Ethics, trans. David Ross, ed. Lesley Brown, Oxford World’s Classics, Oxford University Press","aQ":"With reference to the passage above, explain how Aristotle might respond to the view that pleasure plays an important role in the good life.","a":[["Aristotle argues that virtues work like strength and health.","I"],["Too much or too little exercise, food or drink damages the body, while the right amount builds and preserves it.","I"],["Likewise, someone who never refuses a pleasure becomes self-indulgent, while someone who refuses them all can no longer enjoy anything.","I"],["Aristotle would therefore agree that pleasure plays an important role in the good life, provided it is enjoyed in the right amount.","L"],["The problem is never pleasure itself, but excess or deficiency.","L"],["However, pleasure is not the goal of life for Aristotle.","N"],["Elsewhere he criticises those who equate happiness with pleasure for living like beasts, and argues that the human good is virtuous activity over a complete life.","N"],["Pleasure should serve that life, not rule it.","N"]],"bQ":"How might one other thinker studied in Unit 3 respond to Aristotle’s view on the role of pleasure in the good life?","b":[{"label":"Nietzsche","thinker":"Nietzsche","s":[["Nietzsche would reject Aristotle’s view that pleasure should be enjoyed in moderation.","I"],["He lists “moderation” among the qualities that make a person “tame, peaceable and useful to the herd”, and says the herd honours “the mean and average in desires”.","I"],["It does this out of fear, since “fear is the mother of morality”.","I"],["He would also question whether pleasure deserves so much attention, because “there are higher problems than the problems of pleasure and pain”.","R"],["However, they agree that pleasure is not the goal of a good life.","N"],["Aristotle calls those who live for pleasure “slavish in their tastes”, and Nietzsche looks down on hedonism “with derision”.","N"],["But Aristotle’s answer is moderation, which Nietzsche sees as a product of fear.","N"]]},{"label":"Wolf","thinker":"Wolf","s":[["Wolf would largely agree with Aristotle that pleasure has a place in a good life.","I"],["Her Loving Saint gives up his “hot fudge sundae” so easily that he seems unable to feel “a kind of joy”, much like Aristotle’s “insensible” person who “shuns every pleasure”.","I"],["Yet they use the word “virtue” differently.","R"],["Wolf treats morality as a commitment to “improving the welfare of others”, and separates moral virtues from nonmoral ones, like the skill of a great chef.","R"],["Aristotle draws no such line.","R"],["Temperance is simply an excellence of a well-lived life, and it includes enjoying pleasure in the right amount.","R"],["So for Aristotle enjoying pleasure is part of virtue, while for Wolf it is a nonmoral good that moral virtue can crowd out.","N"]]}],"cQ":"Is moderation essential to the good life? Provide your own justified response to this question. Support your reasoning with an example.","c":[["I believe moderation is essential to the good life, though not in the timid sense Nietzsche attacks.","P"],["Moderation means knowing when enough is enough, and that can take courage.","R"],["For example, in March 2022 Ash Barty retired from tennis at 25 while ranked world number one, less than two months after winning the Australian Open.","E"],["She said she was “spent” and wanted to “chase other dreams”.","E"],["This was not the first time she chose balance.","E"],["In 2014 she stepped away from tennis because of burnout, played cricket for the Brisbane Heat, then returned to win three Grand Slam singles titles.","E"],["Nietzsche might reply that greatness demands excess, and that Barty left achievements unclaimed.","D"],["However, that assumes a good life is measured by trophies alone.","D"],["Barty chose a whole life over a longer list of titles, and I think that kind of moderation is essential to living well.","D"]]},{"id":"q5","n":5,"thinker":"Wolf","title":"the hot fudge sundae","aC":"self-discipline","cC":"pleasure","sum":"The Loving Saint gives up his pleasures so easily that he seems never to have loved them; the Rational Saint wants them but denies himself, which suggests fear or self-hatred.","stim":["Thus, when one reflects, for example, on the Loving Saint easily and gladly giving up his fishing trip or his stereo or his hot fudge sundae at the drop of the moral hat, one is apt to wonder not at how much he loves morality, but at how little he loves these other things. One thinks that, if he can give these up so easily, he does not know what it is to truly love them. There seems, in other words, to be a kind of joy which the Loving Saint, either by nature or by practice, is incapable of experiencing. The Rational Saint, on the other hand, might retain strong nonmoral and concrete desires – he simply denies himself the opportunity to act on them. But this is no less troubling. The Loving Saint one might suspect of missing a piece of perceptual machinery, of being blind to some of what the world has to offer. The Rational Saint, who sees it but foregoes it, one suspects of having a different problem – a pathological fear of damnation, perhaps, or an extreme form of self-hatred that interferes with his ability to enjoy the enjoyable in life."],"src":"S Wolf, “Moral Saints”, The Journal of Philosophy, vol. 79, no. 8, August 1982, pp. 423–424","aQ":"With reference to the passage above, explain how Wolf might respond to the view that self-discipline is a key ingredient in the good life.","a":[["Wolf describes two kinds of moral saint.","I"],["The Loving Saint gives up pleasures, like a fishing trip or a sundae, so easily that he seems never to have loved them, as if he cannot feel a certain kind of joy.","I"],["The Rational Saint still wants these things but disciplines himself to go without, which she finds just as troubling, since it suggests fear or self-hatred.","I"],["Wolf would therefore be wary of the view that self-discipline is key to the good life, when it means giving up ordinary pleasures for morality.","L"],["However, she does not reject discipline.","N"],["Elsewhere she praises those who strive for personal excellence, like a great chef or athlete.","N"],["Her concern is discipline that serves moral perfection at the cost of everything else.","N"]],"bQ":"How might one other thinker studied in Unit 3 respond to Wolf’s view on the role of self-discipline in the good life?","b":[{"label":"Singer","thinker":"Singer","s":[["Singer would defend the kind of self-discipline Wolf finds troubling, which is giving up our own pleasures for others.","I"],["A hot fudge sundae or a stereo, like clothes bought to look “well-dressed”, meets no “important need”.","I"],["If the money could help prevent starvation, giving them up would not be “sacrificing anything significant”.","I"],["This is duty rather than generosity, since “it is wrong not to do so”.","I"],["So where Wolf suspects fear or self-hatred behind the Rational Saint’s self-denial, Singer sees someone doing what morality requires.","R"],["Even so, Wolf herself notes that for the saint, sacrifice has “the character, not of a choice, but of an imperative”.","N"],["Singer would agree with that description, but he would not see it as a problem.","N"]]},{"label":"Nietzsche","thinker":"Nietzsche","s":[["Nietzsche would share Wolf’s suspicion of self-discipline that serves morality, but for his own reasons.","I"],["Noble morality shows “a fundamental hostility and irony for ‘selflessness’”, so the Loving Saint’s easy self-sacrifice would earn his contempt.","I"],["He might also see fear behind the Rational Saint’s self-denial, since for Nietzsche “fear is the mother of morality”.","I"],["Yet Nietzsche does not distrust self-discipline itself, because his noble type “enjoys practising severity and harshness upon himself”.","N"],["So they object to the saint for different reasons.","R"],["Wolf objects to the cost, which is the saint’s lost capacity for joy.","R"],["Nietzsche objects to the aim, because the saint disciplines himself to serve others and not to become stronger.","R"]]}],"cQ":"Can a person who is blind to the pleasures the world has to offer live a good life? Provide your own justified response to this question. Support your reasoning with an example.","c":[["I do not think a person who is blind to the world’s pleasures can live a fully good life, even if they live a morally good one.","P"],["Pleasure is not the whole of a good life, but noticing what is good around us is part of it.","R"],["Bronnie Ware, an Australian palliative carer, wrote about the most common regrets of her dying patients.","E"],["Two were “I wish I hadn’t worked so hard” and “I wish that I had let myself be happier”.","E"],["These people saw, too late, the enjoyment they had passed over.","E"],["Singer might argue that a life spent giving up pleasures to help others is still good, because that is our duty.","D"],["But a life can be admirable without being good for the person living it.","D"],["What Ware’s patients regretted was a lack of joy, so I think a good life needs enjoyment as well as goodness.","D"]]}]},{"id":"aos1-bq2","n":2,"text":"What is the nature of happiness and what is its role in the good life?","qs":[{"id":"q6","n":1,"thinker":"Aristotle","title":"the function of man","aC":"happiness","cC":"virtue","sum":"A good lyre-player plays well, and the human function is activity of the soul guided by reason, so the human good is virtuous activity of the soul over a complete life.","stim":["Now if the function of man is an activity of soul which follows or implies reason, and if we say ‘a so-and-so’ and ‘a good so-and-so’ have a function which is the same in kind, e.g. a lyre-player and a good lyre-player, and so without qualification in all cases, eminence in respect of goodness being added to the name of the function (for the function of a lyre-player is to play the lyre, and that of a good lyre-player is to do so well): if this is the case, human good turns out to be activity of soul exhibiting virtue, and if there are more than one virtue, in accordance with the best and most complete. But we must add ‘in a complete life’. For one swallow does not make a summer, nor does one day; and so too one day, or a short time, does not make a man blessed and happy."],"src":"Aristotle, The Nicomachean Ethics, trans. David Ross, ed. Lesley Brown, Oxford World’s Classics, Oxford University Press, 2009","aQ":"With reference to the passage above, explain how Aristotle might respond to the view that happiness is the key to the good life.","a":[["Aristotle argues that anything with a function, like a lyre-player, is good when it performs that function well.","I"],["The human function is activity of the soul guided by reason, so the human good is to carry out that activity with virtue over a whole life, not a single day.","I"],["Aristotle would therefore agree that happiness is the key to the good life, since for him happiness is the human good.","L"],["He means a whole life lived well, not a passing feeling.","L"],["However, virtue alone does not guarantee it.","N"],["Elsewhere he notes that no one would call a virtuous person happy if they were asleep, idle or suffering terrible misfortune.","N"],["Virtue must be put to use, and luck plays a part.","N"]],"bQ":"How might one other thinker studied in Unit 3 respond to Aristotle’s view on the nature of happiness?","b":[{"label":"Nietzsche","thinker":"Nietzsche","s":[["Nietzsche would reject Aristotle’s claim that happiness is the chief good.","I"],["He dismisses views that judge value by “pleasure and pain” as “naiveties”, and insists that “wellbeing as you understand it” is “no goal”.","I"],["Where Aristotle says no one would call a life happy if it held “the greatest sufferings and misfortunes”, Nietzsche claims that only “the discipline of great suffering” has “created every elevation of mankind”.","R"],["Even so, Aristotle’s happiness is not pleasure.","N"],["He scorns those who choose a life “suitable to beasts”, and his model is the lyre-player who plays well.","N"],["Nietzsche, too, prizes the “artist’s conscience”.","N"],["Both judge a life by its excellence, not its comfort, but they differ on whether great suffering ruins a good life or helps a person grow.","N"]]},{"label":"Cicero","thinker":"Cicero","s":[["Cicero would agree that happiness is “the summit of our best ambitions” and that it depends on virtue.","I"],["But he would say Aristotle’s definition leaves something out.","R"],["Aristotle describes happiness as the activity of one person’s soul, yet Cicero insists “the highest standards of behaviour are impossible to realize on one’s own”.","R"],["Aristotle would not entirely disagree.","N"],["Elsewhere he argues that “the happy man needs friends”, since no one “would choose the whole world on condition of being alone”.","N"],["The difference is the role friends play.","N"],["For Aristotle, friends are “the greatest of external goods”, people a good person can do well by.","N"],["For Cicero, friendship is what makes the highest goodness, and so happiness, possible.","N"]]}],"cQ":"Does being virtuous lead to happiness? Provide your own justified response to this question. Support your reasoning with an example.","c":[["I believe being virtuous usually leads to happiness, although it cannot guarantee it.","P"],["Kindness and honesty connect us to others and let us respect ourselves, and happiness depends on both.","R"],["For example, Eddie Jaku survived Buchenwald and Auschwitz, moved to Australia in 1950, and spent decades at the Sydney Jewish Museum teaching students not to hate.","E"],["At 100 he published The Happiest Man on Earth, writing that “kindness is the greatest wealth of all”.","E"],["His happiness came from how he chose to live, not from what had happened to him.","E"],["Someone might object that Jaku was lucky to survive when many good people did not.","D"],["That is true, and Aristotle himself admits that misfortune can wreck even a good person’s life, so virtue alone is not enough.","D"],["However, luck only gave Jaku his chance, and it was his kindness that made his life a happy one.","D"]]},{"id":"q7","n":2,"thinker":"Nietzsche","title":"wellbeing is no goal","aC":"happiness","cC":"wellbeing","sum":"Hedonism, utilitarianism and the like judge value by pleasure and pain, which are only secondary; anyone with creative power looks down on them, and wellbeing is no goal but an end.","stim":["Whether it be hedonism or pessimism or utilitarianism or eudaemonism: all these modes of thought which assess the value of things according to pleasure and pain, that is to say according to attendant and secondary phenomena, are foreground modes of thought and naiveties which anyone conscious of creative powers and an artist’s conscience will look down on with derision, though not without pity. Pity for you! … Wellbeing as you understand it – that is no goal, that seems to us an end! A state which soon renders man ludicrous and contemptible – which makes it desirable that he should perish!"],"src":"F Nietzsche, Beyond Good and Evil, trans. R. J. Hollingdale, Penguin Classics, London, 2003","aQ":"With reference to the passage above, explain how Nietzsche might respond to the view that happiness plays an important role in the good life.","a":[["Nietzsche argues that views which measure value by pleasure and pain, such as hedonism and utilitarianism, are shallow, since pleasure and pain only accompany what really matters.","I"],["Anyone with creative power looks down on such views.","I"],["The comfortable wellbeing most people chase is not a goal but an ending, making people ridiculous and contemptible.","I"],["Nietzsche would therefore reject the view that happiness plays an important role in the good life, if happiness means comfort and freedom from pain.","L"],["A good life is judged by what it creates, not how it feels.","L"],["However, he does not reject every kind of happiness.","N"],["Elsewhere he describes the joy the noble person takes in tension and overflowing power.","N"],["Happiness has a place, but only as a sign of strength.","N"]],"bQ":"How might one other thinker studied in Unit 3 respond to Nietzsche’s view on the role of happiness in the good life?","b":[{"label":"Cicero","thinker":"Cicero","s":[["Cicero would reject Nietzsche’s contempt for wellbeing.","I"],["For him, happiness is “the summit of our best ambitions”, and it includes “peace of mind”, the kind of wellbeing Nietzsche scorns.","I"],["Where Nietzsche would “increase” suffering, Cicero values friendship because it “relieves adversity by dividing and sharing the burden”.","R"],["He also rejects Nietzsche’s praise of solitude, since “nature abhors solitude” and “if you are lonely, every pleasure loses its savour”.","R"],["Even so, Cicero refuses to measure a good life by pleasure, which “any animal can experience”.","N"],["Like Nietzsche, he thinks a good life needs more than feeling good.","N"],["For Cicero that means moral goodness and friendship, while for Nietzsche it means growth through hardship.","N"]]},{"label":"Plato (Callicles)","thinker":"Plato","s":[["Callicles, in Plato’s Gorgias, would share Nietzsche’s contempt for a contented life.","I"],["If needing nothing made people happy, he says, there would be “nothing happier than a stone or a corpse”.","I"],["Like Nietzsche, he sees conventional morality as a trick used by “the weaklings who constitute the majority” to hold back the strong.","R"],["But they differ on what the strong should aim for.","N"],["Callicles believes there is no “happier state of existence” than “a life of sensual, self-indulgent freedom”, in which desires expand “until they can grow no larger”.","N"],["This is the kind of hedonism Nietzsche mocks.","N"],["Both scorn the herd, but Callicles wants the strong to enjoy more, while Nietzsche wants them to grow stronger through hardship.","N"]]},{"label":"Aristotle","thinker":"Aristotle","s":[["Aristotle would reject Nietzsche’s claim that wellbeing is “no goal”.","I"],["For him, happiness is “the chief good”, chosen “always for itself”.","I"],["Yet he would agree that comfort is not the point.","N"],["Nietzsche despises wellbeing as a “state” that makes people “ludicrous and contemptible”, and Aristotle also denies that happiness is a state.","N"],["Virtue alone is “compatible with being asleep, or with lifelong inactivity”, so happiness must be “activity of soul exhibiting virtue”.","N"],["The real gap is over suffering.","R"],["Aristotle would not “increase” it, since no one would call a person happy who lives with “the greatest sufferings and misfortunes”.","R"],["Both want an active life, but Nietzsche sees misfortune as a chance to grow towards excellence, while Aristotle thinks it can rob a life of happiness.","N"]]}],"cQ":"What is the role of happiness or ‘wellbeing’ in the good life? Provide your own justified response to this question. Support your reasoning with an example.","c":[["I believe wellbeing has a real place in the good life, but it works best as a by-product rather than a goal.","P"],["When we make happiness the target, we start checking whether we have reached it, and even a good day can feel like a letdown.","R"],["In a 2011 study, psychologist Iris Mauss and her colleagues found that people encouraged to value happiness highly felt less happy after watching a happy film than those who were not, because they were disappointed not to feel happier.","E"],["Nietzsche might go further and say comfortable wellbeing has no role at all, since only great suffering elevates a life.","D"],["But people who choose hard paths usually find a deeper satisfaction in them, and that is a kind of wellbeing too.","D"],["So wellbeing comes from throwing ourselves into things that matter, like work and friendships, rather than chasing it directly.","D"]]},{"id":"q8","n":3,"thinker":"Cicero","title":"friendship and the highest good","aC":"happiness","cC":"friendship","sum":"The highest standards of behaviour cannot be reached alone; friendship with a good person is the highest good nature offers, bringing the goodness, fame and peace of mind that make life happy.","stim":["For the highest standards of behaviour are impossible to realize on one’s own; union with someone else, companionship, are the only things that can ensure them. Such an association, whether you are speaking of today, or of the past, or of any epoch in the future, ranks as the finest and most glorious of all possible connexions, embodying the highest good that nature has to offer. For friendships of such a kind embrace everything worth pursuing by mankind – goodness, and fame, and peace of mind, and satisfaction: the things which make life happy when we have them, whereas without them there can be no question of happiness at all. This happiness is the summit of our best ambitions. But if we are to get it, we shall have to concentrate on raising our behaviour to the very highest standard that morality can achieve."],"src":"Cicero, On the Good Life, trans. Michael Grant, Penguin Classics, London","aQ":"With reference to the passage above, explain how Cicero might respond to the view that happiness is the highest goal of the good life.","a":[["Cicero argues that no one can live by the highest moral standards on their own.","I"],["Only a close friendship with a good person makes this possible, and such friendship is the greatest good nature offers, since it brings goodness, a good name and peace of mind.","I"],["Without these, happiness is impossible.","I"],["Cicero would therefore agree that happiness is the highest goal of the good life, calling it the peak of our ambitions.","L"],["But it cannot be reached by chasing it directly.","L"],["We reach it by becoming as morally good as possible, alongside friends who help us.","L"],["However, elsewhere Cicero calls moral goodness the supreme blessing, and says friendship cannot exist without it.","N"],["So happiness is the highest goal, but it rests on moral goodness.","N"]],"bQ":"How might one other thinker studied in Unit 3 respond to Cicero’s view on the nature of happiness?","b":[{"label":"Nietzsche","thinker":"Nietzsche","s":[["Nietzsche would reject Cicero’s claim that happiness depends on reaching “the very highest standard that morality can achieve”.","I"],["For Nietzsche, conventional morality honours whatever makes people “tame, peaceable and useful to the herd”.","I"],["Cicero’s “peace of mind” is the “wellbeing” Nietzsche calls “no goal”, and the happiness he values is “the happiness of high tension”.","R"],["He would also reject Cicero’s need for companionship, since for Nietzsche “solitude is with us a virtue”.","R"],["Yet Nietzsche is not against friendship.","N"],["Noble morality includes “a refined conception of friendship”, much as Cicero wants a friend “not different from oneself, but the same”.","N"],["The difference is what friendship is for.","N"],["For Cicero, it makes us good and therefore happy, while for Nietzsche it only marks us as noble.","N"]]},{"label":"Allen","thinker":"Allen","s":[["Allen would agree with Cicero that happiness, or living well, depends on friendship.","I"],["She describes friends as “second selves”, so that in caring for each other, “friends care for their own good”.","I"],["But Cicero keeps true friendship for the “extremely few”, and says friendly feeling between strangers “lacks a solid basis”.","R"],["Allen extends the model of friendship outward, arguing that we should build “second-self relations even with strangers”.","R"],["She calls this equitable self-interest, which “treats the good of others as part of one’s own interests”, and it fosters the kind of community where we can have a good life.","R"],["Being good to others is therefore necessary to create the conditions where we ourselves can thrive.","R"]]}],"cQ":"Can happiness be achieved without friendship? Provide your own justified response to this question. Support your reasoning with an example.","c":[["I do not think most people can be happy for long without friendship.","P"],["Good news means more when a friend is glad with us, and hardship is easier when someone helps carry it.","R"],["For example, the Harvard Study of Adult Development has followed 724 men since 1938, and its director, Robert Waldinger, concluded that “good relationships keep us happier and healthier”.","E"],["These relationships include friendships, and men who were isolated were less happy and died sooner.","E"],["Someone might point to Christopher Knight, who lived alone in the Maine woods for 27 years and, according to the journalist who interviewed him, was content and even joyful there.","D"],["However, I think Knight is a rare exception.","D"],["The Harvard study suggests that most people who are cut off from others become unhappy, so for almost everyone happiness needs friendship.","D"]]},{"id":"q9","n":4,"thinker":"Wolf","title":"the Loving Saint and the Rational Saint","aC":"happiness","cC":"selflessness","sum":"Two kinds of moral saint: the Loving Saint, whose happiness lies in the happiness of others, and the Rational Saint, who sacrifices his own interests for morality and feels the loss.","stim":["A necessary condition of moral sainthood would be that one’s life be dominated by a commitment to improving the welfare of others or of society as a whole. As to what role this commitment must play in the individual’s motivational system, two contrasting accounts suggest themselves to me which might equally be thought to qualify a person for moral sainthood. First, a moral saint might be someone whose concern for others plays the role that is played in most of our lives by more selfish, or, at any rate, less morally worthy concerns. For the moral saint, the promotion of the welfare of others might play the role that is played for most of us by the enjoyment of material comforts, the opportunity to engage in the intellectual and physical activities of our choice, and the love, respect, and companionship of people whom we love, respect, and enjoy. The happiness of the moral saint, then, would truly lie in the happiness of others, and so he would devote himself to others gladly, and with a whole and open heart. On the other hand, a moral saint might be someone for whom the basic ingredients of happiness are not unlike those of most of the rest of us. What makes him a moral saint is rather that he pays little or no attention to his own happiness in light of the overriding importance he gives to the wider concerns of morality. In other words, this person sacrifices his own interests to the interests of others, and feels the sacrifice as such."],"src":"S Wolf, “Moral Saints”, The Journal of Philosophy, vol. 79, no. 8, August 1982, pp. 421–422","aQ":"With reference to the passage above, explain how Wolf might respond to the view that a good life can be lived without regard for one’s own happiness.","a":[["Wolf describes two kinds of moral saint, both devoted to others.","I"],["The Loving Saint finds his happiness in other people’s happiness, so he gives himself to them gladly.","I"],["The Rational Saint wants what most of us want, like comfort and the company of people he loves, but ignores his own happiness for morality’s sake and feels the loss.","I"],["Wolf would therefore reject the view that a good life can be lived without regard for one’s own happiness.","L"],["The Rational Saint lives a morally good life, but not a good life for himself.","L"],["However, happiness is not her only test.","N"],["Elsewhere she suggests even the happy Loving Saint’s life is lacking, since a life given wholly to morality crowds out interests like music or sport.","N"]],"bQ":"How might one other thinker studied in Unit 3 respond to Wolf’s view on the role of happiness in the good life?","b":[{"label":"Singer","thinker":"Singer","s":[["Singer would see the Rational Saint’s sacrifice as simply what morality asks.","I"],["We “ought to give as much as possible”, and keeping money for things that meet no “important need” is “wrong” while others starve.","I"],["Wolf thinks ordinary happiness belongs in a good life, and says that “it is not part of common-sense morality that one ought to be a moral saint”.","R"],["Singer thinks our common-sense view of charity “cannot be justified”.","R"],["However, Singer does not ignore the giver completely.","N"],["He asks us to give at least up to the point where more would “cause serious suffering for oneself and one’s dependents”.","N"],["So both give the giver’s wellbeing some weight, but Singer counts only serious suffering, while Wolf counts ordinary happiness as well.","N"]]},{"label":"Allen","thinker":"Allen","s":[["Allen would see something right in the Loving Saint, whose happiness lies “in the happiness of others”.","I"],["Her equitable self-interest likewise “treats the good of others as part of one’s own interests”, so giving need not feel like a loss.","I"],["But Allen admits “there should be limits to what one is willing to give up”, and warns that those who “give often and generously” can be distrusted if they never ask for favours in return.","R"],["A saint who only gives would make a poor friend.","R"],["So Allen would agree with Wolf that a life of pure giving is not a good one, but for a different reason.","R"],["Wolf thinks the saint misses out on ordinary happiness, while Allen thinks he damages the trust between people.","N"]]},{"label":"Nietzsche","thinker":"Nietzsche","s":[["Nietzsche would agree with Wolf that the saint’s selfless life is not a good one, but he would reject the kind of happiness she defends.","I"],["The saint Wolf describes, “patient, considerate, even-tempered”, resembles Nietzsche’s herd-man, who glorifies “benevolence, consideration... forbearance, pity”, the qualities that make him “tame, peaceable and useful to the herd”.","I"],["However, Wolf values the happiness most of us share, built from comforts, chosen activities and the company of people we love.","R"],["Nietzsche would scorn that as “wellbeing as you understand it”.","R"],["The happiness he values is “the happiness of high tension”, the feeling of “power which seeks to overflow”.","R"],["So Wolf wants a well-rounded life with room for enjoyment, while Nietzsche values only the happiness that comes with power.","R"]]}],"cQ":"Can a person be happy if they are completely selfless? Provide your own justified response to this question. Support your reasoning with an example.","c":[["I do not think a completely selfless person can be happy.","P"],["Humans, or at least humans in our culture, have needs beyond survival, and these deserve moral weight if we are to live a rich, textured life.","R"],["Imagine a nurse who works full-time and donates everything except what she needs for rent, food and transport.","E"],["By Singer’s reasoning she is doing what morality asks, since a concert ticket or dinner with friends meets no “important need”.","E"],["Yet her life would shrink to working, sleeping and giving.","E"],["Singer might reply that a night out is trivial next to a child’s life.","D"],["But a whole life without hobbies, holidays or nights out would be miserable, and that misery matters morally too.","D"],["Someone might say she could be happy like Wolf’s Loving Saint, through the happiness of others, but I think very few people are really like that.","D"]]}]},{"id":"aos1-bq3","n":3,"text":"What role do love and friendship play in the good life?","qs":[{"id":"q10","n":1,"thinker":"Nietzsche","title":"solitude as a virtue","aC":"friendship","cC":"solitude","sum":"Keep your foregrounds and your dark glasses; solitude is a virtue, because all contact in society is unclean and all community makes people common.","stim":["To keep one’s three hundred foregrounds; also one’s dark glasses: for there are instances where no one may look into our eyes, still less into our ‘grounds’. And to choose for company that cheerful and roguish vice, politeness. And to remain master of one’s four virtues, courage, insight, sympathy, solitude. For solitude is with us a virtue: it is a sublime urge and inclination for cleanliness which divines that all contact between man and man – ‘in society’ – must inevitably be unclean. All community makes somehow, somewhere, sometime – ‘common’."],"src":"F Nietzsche, Beyond Good and Evil, Penguin Group, London, 2003","aQ":"With reference to the passage above, explain how Nietzsche might respond to the view that friendship and social life are essential to the good life.","a":[["Nietzsche describes someone who keeps other people at a distance.","I"],["He hides behind many surfaces and dark glasses so no one can see into him, and keeps politeness, not intimacy, for company.","I"],["Solitude is one of his four virtues, because it keeps him clean, while contact with society makes a person ordinary.","I"],["Nietzsche would therefore reject the view that friendship and social life are essential to the good life.","L"],["Mixing with the crowd drags the individual down, so a good life needs distance.","L"],["However, he does not reject every bond.","N"],["Sympathy sits beside solitude among the four virtues, and elsewhere he says the noble type has a refined idea of friendship.","N"],["So he rejects society in general, but still allows friendship between equals.","N"]],"bQ":"How might one other thinker studied in Unit 3 respond to Nietzsche’s view on the role of friendship and social life in the good life?","b":[{"label":"Cicero","thinker":"Cicero","s":[["Cicero would reject Nietzsche’s praise of solitude.","I"],["For Cicero, “nature abhors solitude”, and “if you are lonely, every pleasure loses its savour”.","I"],["Where Nietzsche wears “dark glasses” so that “no one may look into our eyes”, Cicero thinks nothing is more satisfying than “someone you can speak to as freely as your own self”.","R"],["He would also deny that contact makes us “unclean”.","R"],["Friendship exists “to help us behave decently”, since the highest standards “are impossible to realize on one’s own”.","R"],["Yet Cicero is selective too.","N"],["He is “not speaking of ordinary commonplace friendships”, and limits true friendship to the “extremely few”.","N"],["So neither welcomes just anyone, but Cicero’s answer is to choose friends carefully, while Nietzsche’s is to withdraw.","N"]]},{"label":"de Beauvoir","thinker":"de Beauvoir","s":[["De Beauvoir would understand Nietzsche’s wariness of social life.","I"],["She also criticises people who hide in the group’s “ready-made values”, like the serious man who “is no longer a man, but a father, a boss”.","I"],["But she would see his retreat into solitude as a mistake.","R"],["She says it is the young man who sees others as a threat, since to him “others appear as enemies”, and she calls this hatred “naive”.","R"],["Without others, “the world would be empty”.","R"],["In her view “every man needs the freedom of other men”, because only this “keeps each one of us from hardening”.","R"],["Both value independence, but Nietzsche protects it by withdrawing, while de Beauvoir thinks a good life can only be lived among others.","N"]]},{"label":"Allen","thinker":"Allen","s":[["Allen would reject Nietzsche’s view that community makes us “common”.","I"],["For her, we live together “because we desire to share our lives with strangers”, and where Nietzsche hides behind “dark glasses”, she insists that “friendship entails self-exposure”.","I"],["Pulling away from others does not protect the self, because it weakens the community the self depends on.","R"],["Her equitable self-interest “treats the good of others as part of one’s own interests”, and so fosters the kind of community where we ourselves can thrive.","R"],["Yet Allen does not demand closeness with everyone.","N"],["Political friendship is “like friendship but without the emotional charge”.","N"],["She would let Nietzsche keep some reserve, but not withdraw from others altogether.","N"]]}],"cQ":"What is the role of solitude in the good life? Provide your own justified response to this question. Support your reasoning with an example.","c":[["I think solitude is important in the good life, but most people need a balance between time alone and time with others.","P"],["For example, someone who never spends time by themselves, and who is always with friends or messaging them, ends up making every decision in reference to other people.","E"],["They might not know what music they like or what they believe, because they have never had to work it out on their own.","E"],["Time alone would give them the chance to do that.","E"],["However, I do not agree with Nietzsche that we should avoid society as much as possible.","D"],["Most people seem to need community to live a good life, and they become lonely without it.","D"],["There are some people whose brains do not seem to need this, and who live fulfilling lives in isolation, but this seems to be rare.","D"]]},{"id":"q11","n":2,"thinker":"Cicero","title":"someone to speak to as freely as yourself","aC":"friendship","cC":"shared suffering","sum":"Nothing is more satisfying than someone you can talk to as freely as yourself; prosperity cannot be fully enjoyed, nor misfortune easily borne, without such a person.","stim":["It is the most satisfying experience in the world to have someone you can speak to as freely as your own self about any and every subject upon earth. If things are going well, you cannot possibly enjoy your prosperity to the full unless you have another person whose pleasure equals your own. Should things go wrong, your misfortunes will indeed be hard to bear without someone who suffers as badly as yourself, or even worse."],"src":"Cicero, On the Good Life, trans. Michael Grant, Penguin Classics, London","aQ":"With reference to the passage above, explain how Cicero might respond to the view that happiness depends on friendship.","a":[["Cicero argues that nothing is more satisfying than having someone we can talk to as openly as we talk to ourselves.","I"],["Good fortune cannot be fully enjoyed unless another person is just as pleased by it, and misfortune is hard to bear without someone who feels it as deeply as we do.","I"],["Cicero would therefore agree that happiness depends on friendship, because a friend both adds to our joy and lightens our suffering.","L"],["However, not every friendship will do this.","N"],["Elsewhere he insists that real friendship is only possible between good people, and that a friend must sometimes criticise us rather than flatter us.","N"],["So the friend who makes us happy is not simply one who agrees with us, but one who is honest with us.","N"]],"bQ":"How might one other thinker studied in Unit 3 respond to Cicero’s view on the relationship between friendship and happiness?","b":[{"label":"Nietzsche","thinker":"Nietzsche","s":[["Nietzsche would reject Cicero’s view that happiness depends on a friend to share our fortunes.","I"],["For Nietzsche, the noble person’s happiness is “the happiness of high tension”, which comes from his own strength, not from a friend.","I"],["Cicero wants “someone you can speak to as freely as your own self”, but Nietzsche keeps his “dark glasses” on and counts solitude as “a virtue”.","R"],["He would also deny that misfortune should be made easier to bear, since “the discipline of great suffering” builds “strength”.","R"],["However, they agree on one thing.","N"],["Cicero warns against “fawning sycophancy”, and Nietzsche’s noble type despises “the fawning flatterer”.","N"],["So both reject flattery, but Cicero thinks an honest friend makes us happier, while Nietzsche thinks happiness comes from our own strength.","N"]]},{"label":"Allen","thinker":"Allen","s":[["Allen would agree with Cicero that our happiness is tied to our friends, since a friend’s fortunes become our own.","I"],["Cicero wants a friend “whose pleasure equals your own”, and Allen describes friends as “second selves”, where “the friend and the friendship have become part of one’s self”.","I"],["For Allen, when we give something up for a friend, we are “acting in the interests of this new extended self”.","R"],["However, Cicero is describing a private bond between a few close friends.","N"],["Allen takes the same model and extends it outward to strangers.","N"],["Her equitable self-interest “treats the good of others as part of one’s own interests”, and fosters the kind of community where we ourselves can be happy.","N"]]}],"cQ":"Is suffering easier to bear when it is shared? Provide your own justified response to this question. Support your reasoning with an example.","c":[["I think suffering is usually easier to bear when it is shared, although it depends on who it is shared with.","P"],["For example, when a student’s grandparent dies, the grief does not get smaller because their friends know about it.","E"],["But if a friend comes over and sits with them, or just listens, they no longer have to carry it alone or pretend to be fine at school.","E"],["That makes it more bearable, even though nothing has been fixed.","E"],["Nietzsche might say that leaning on others like this makes a person weaker.","D"],["However, I think hiding pain takes a lot of energy, and it can stop people from recovering.","D"],["Sharing with the wrong person, such as someone who gossips or makes it about themselves, can make things worse, and some people prefer to deal with things privately.","D"],["But with a friend who listens, suffering is easier to bear.","D"]]},{"id":"q12","n":3,"thinker":"Aristotle","title":"the happy man needs friends","aC":"friendship","cC":"the company we keep","sum":"A good man needs people to do well by, and no one would choose the whole world on condition of being alone, so the happy man needs friends.","stim":["And if it is more characteristic of a friend to do well by another than to be well done by, and to confer benefits is characteristic of the good man and of virtue, and it is nobler to do well by friends than by strangers, the good man will need people to do well by… Surely it is strange, too, to make the supremely happy man a solitary; for no one would choose the whole world on condition of being alone, since man is a political creature and one whose nature is to live with others. Therefore even the happy man lives with others; for he has the things that are by nature good. And plainly it is better to spend his days with friends and good men than with strangers or any chance persons. Therefore the happy man needs friends."],"src":"Aristotle, The Nicomachean Ethics, trans. David Ross, ed. Lesley Brown, Oxford World’s Classics, Oxford U
