niversity Press, 2009","aQ":"With reference to the passage above, explain how Aristotle might respond to the view that friendship is essential to the good life.","a":[["Aristotle gives two reasons why the happy person needs friends.","I"],["First, a good person does good to others, and it is finer to do this for friends than for strangers, so he needs friends to benefit.","I"],["Second, humans are social by nature.","I"],["Nobody would choose to have every good thing if it meant being alone, so the happy person will live among friends and good people.","I"],["Aristotle would therefore agree that friendship is essential to the good life.","L"],["It gives virtue somewhere to be used.","L"],["However, friends are not the whole of happiness for him.","N"],["Elsewhere he defines happiness as virtuous activity over a complete life, and treats friends as the greatest of the external goods that such a life needs.","N"]],"bQ":"How might one other thinker studied in Unit 3 respond to Aristotle’s view on the role of friendship in the good life?","b":[{"label":"Singer","thinker":"Singer","s":[["Singer would challenge Aristotle’s claim that it is “nobler to do well by friends than by strangers”.","I"],["For Singer, “it makes no moral difference whether the person I can help is a neighbour’s child ten yards from me or a Bengali whose name I shall never know”.","I"],["So where Aristotle’s good man looks for friends to benefit, Singer would point him towards strangers in greater need.","R"],["However, they agree that a good person gives.","N"],["Aristotle says “to confer benefits is characteristic of the good man”, and Singer says “we ought to give the money away”.","N"],["Singer’s argument is about duty, not happiness, so he need not deny that friends make us happy.","N"],["He would deny that friendship should decide who we help.","N"]]},{"label":"Nietzsche","thinker":"Nietzsche","s":[["Nietzsche would reject Aristotle’s claim that it is “strange” to make the happy man “a solitary”.","I"],["For Nietzsche, “solitude is with us a virtue”, and what Aristotle calls our “nature” to live with others looks more like the instinct of the herd.","I"],["The herd distrusts “the will to stand alone” and calls it evil.","R"],["However, they also share some ground.","N"],["Aristotle does not praise company in general, since he prefers “friends and good men” to “strangers or any chance persons”.","N"],["And like Aristotle’s good man, who needs “people to do well by”, Nietzsche’s noble person has “a wealth which would like to give away and bestow”.","N"],["They disagree about how much company a good life needs, but both are selective about it.","N"]]}],"cQ":"Does the good life depend on the company we keep? Provide your own justified response to this question. Support your reasoning with an example.","c":[["I think the good life depends a lot on the company we keep, because the people around us shape what seems normal.","P"],["This is clear in education.","R"],["A 2014 study by the National Centre for Vocational Education Research used a national survey of Australian teenagers.","E"],["It found that students whose friends planned to attend university were nearly four times more likely to plan to go themselves.","E"],["This suggests that students aim higher when they spend time with others who value school, and I think the same applies to other parts of life.","E"],["Someone might argue that the good life is still our own responsibility, since we choose our friends.","D"],["I agree that we choose our friends, but once we are in a group it is hard to act differently from it.","D"],["We also do not choose all our company, such as family, so choosing good friends matters even more.","D"]]},{"id":"q13","n":4,"thinker":"Nietzsche","title":"love of one’s neighbour","aC":"love","cC":"the motive for love","sum":"While morality served only the herd’s preservation, kindness and pity were not yet counted as virtues; love of one’s neighbour is secondary and partly illusory compared with fear of one’s neighbour.","stim":["So long as the utility which dominates moral value-judgements is solely that which is useful to the herd, so long as the object is solely the preservation of the community and the immoral is sought precisely and exclusively in that which seems to imperil the existence of the community: so long as that is the case there can be no ‘morality of love of one’s neighbour’. Supposing that even there a constant little exercise of consideration, pity, fairness, mildness, mutual aid was practised, supposing that even at that stage of society all those drives are active which are later honourably designated ‘virtues’ and are finally practically equated with the concept ‘morality’: in that era they do not yet by any means belong to the domain of moral valuations – they are still extra-moral. An act of pity, for example, was during the finest age of Rome considered neither good nor bad, neither moral nor immoral; and even if it was commended, this commendation was entirely compatible with a kind of involuntary disdain… Ultimately ‘love of one’s neighbour’ is always something secondary, in part conventional and arbitrarily illusory, when compared with fear of one’s neighbour."],"src":"F Nietzsche, Beyond Good and Evil, trans. R. J. Hollingdale, Penguin Classics, London, 2003","aQ":"With reference to the passage above, explain how Nietzsche might respond to the view that love plays an important role in the good life.","a":[["Nietzsche argues that early morality was only about what kept the community safe.","I"],["Kindness, pity and mutual help existed, but they were not yet counted as moral, and in ancient Rome an act of pity was even looked down on.","I"],["He concludes that love of our neighbour is secondary and partly an illusion, compared with fear of our neighbour.","I"],["Nietzsche would therefore reject the view that love plays an important role in the good life, if love means general kindness towards others, because he thinks morality is built on fear, not love.","L"],["However, he does not reject every kind of love.","N"],["Elsewhere he describes passionate love as an invention of noble culture, and says the noble person helps others out of an overflow of strength.","N"]],"bQ":"How might one other thinker studied in Unit 3 respond to Nietzsche’s view on the role of love in the good life?","b":[{"label":"Cicero","thinker":"Cicero","s":[["Cicero would reject Nietzsche’s claim that love is “secondary” to fear.","I"],["For Cicero, “goodwill is established by love, quite independently of any calculation of profit”.","I"],["Where Nietzsche calls love of one’s neighbour partly “conventional and arbitrarily illusory”, Cicero insists that real friendship “cannot help being genuine and sincere”.","R"],["He also thinks communities rest on love, not fear, since without “the bond of kindly feeling” no “house or city can stand”.","R"],["However, Cicero accepts part of Nietzsche’s suspicion.","N"],["He admits that people often pretend to be friends to gain “some immediate benefit”, and that friendly feeling between strangers “lacks a solid basis”.","N"],["So both accept that some kindness is not what it seems, but Cicero believes the real thing exists as well.","N"]]},{"label":"Allen","thinker":"Allen","s":[["Allen would disagree that our bonds with others come down to fear.","I"],["She criticises Hobbes for the same move, since he “reduced citizenship to fear”, and argues that fear alone cannot hold a society together.","I"],["However, Allen would agree with Nietzsche that love is not purely selfless.","N"],["In friendship, “one wishes a friend well for one’s own sake”, because the friend has “become part of one’s self”.","N"],["But “self-interest comes in a variety of types”, and in this passage Nietzsche sees only the fearful kind.","R"],["Allen adds an equitable kind, which “treats the good of others as part of one’s own interests”.","R"],["This fosters the kind of community where we can have a good life, so caring for others also helps us thrive.","R"]]}],"cQ":"Is love for others motivated by genuine care, or by fear or self-interest? Provide your own justified response to this question. Support your reasoning with an example.","c":[["I think love for others is mostly motivated by genuine care, although self-interest is often mixed in.","P"],["For example, when emergency services were overwhelmed in the 2022 Lismore floods, local people took their own boats, kayaks and jet skis into the floodwater and rescued others, risking their own lives.","E"],["They became known as the “tinnie army”, and the NSW flood inquiry later recognised their role.","E"],["Fear cannot explain this, because the safest thing to do was to stay out of the water.","E"],["Nietzsche might argue that people only help because they want to protect their community or be praised.","D"],["However, no praise would be worth the risk of drowning, and wanting to protect your community is already a form of care.","D"],["Helping others often makes us feel good, but I do not think this makes the care fake.","D"],["Feeling good about helping someone is part of what caring is.","D"]]},{"id":"q14","n":5,"thinker":"Allen","title":"second selves","aC":"friendship","cC":"friends and the self","sum":"Friends are second selves, so caring for a friend is caring for one’s own good; sacrifice is friendship’s fundamental act, and equitable self-interest treats the good of others as part of one’s own.","stim":["Aristotle explains the idea by arguing that friends are “second selves” to each other. Friendship is the extension of one’s interests to include someone else’s in ways that annihilate loss: “In being a friend to their friend, friends care for their own good. For the good man in becoming dear to another becomes that other’s good. Each party therefore both loves his own good and also makes an equivalent return by wishing the other’s good.” One wishes a friend well for one’s own sake, because the friend and the friendship have become part of one’s self, and when we give things up for the sake of preserving the friendship, we discover that disappointment and consent are existentially compatible phenomena. “If friendship extends the self, then one is not so much sacrificing oneself, as acting in the interests of this new extended self.” In most circumstances, there should be limits to what one is willing to give up, but this does not obscure the basic point. Sacrifice is friendship’s fundamental act, and a crucial political one in that it is the only action that reconciles agency and autonomy with not getting what one wants. Whereas rivalrous self-interest is a commitment to one’s own interests without regard to how they affect others, equitable self-interest treats the good of others as part of one’s own interests."],"src":"DS Allen, Talking to Strangers: Anxieties of Citizenship since Brown v. Board of Education, The University of Chicago Press, Chicago, 2004, pp. 133–134","aQ":"With reference to the passage above, explain how Allen might respond to the view that a good life requires putting our friends before ourselves.","a":[["Allen argues that friends are like second selves.","I"],["Friendship stretches our interests to include another person’s, so that caring for a friend is also caring for our own good.","I"],["When we give something up for a friendship, we may be disappointed but can still agree to it, because the friendship is part of us.","I"],["Allen would therefore partly agree that a good life requires putting friends first, since she calls sacrifice the basic act of friendship.","L"],["But we are not really putting friends before ourselves, because their good is part of ours.","L"],["However, she also says there should usually be limits to what we give up.","N"],["Elsewhere she adds that friendship goes both ways, since friends are “people to whom we are willing to be in debt”.","N"]],"bQ":"How might one other thinker studied in Unit 3 respond to Allen’s view on the role of friendship in the good life?","b":[{"label":"Nietzsche","thinker":"Nietzsche","s":[["Nietzsche would reject Allen’s claim that “sacrifice is friendship’s fundamental act”.","I"],["His noble morality has “a fundamental hostility and irony for ‘selflessness’”, and is far from any morality that finds goodness in “acting for others”.","I"],["He would also distrust her aim of equality among all citizens, since he mocks the herd’s wish for “equal rights and equal pretensions”.","R"],["However, Allen does not think sacrifice is selfless either.","N"],["For her, we are “acting in the interests of this new extended self”.","N"],["Nietzsche’s noble person also gives, out of “a wealth which would like to give away and bestow”.","N"],["The difference is that Allen’s friend gives to build a bond with others, while Nietzsche’s noble person gives because he has strength to spare.","N"]]},{"label":"Aristotle","thinker":"Aristotle","s":[["Aristotle would largely agree with Allen, since she builds her view on his.","I"],["He also calls a friend “another self”, and says it is “more characteristic of a friend to do well by another than to be well done by”, which fits her claim that friendship involves giving.","I"],["However, while Allen draws heavily on Aristotle, she does not address his claim that it is “nobler to do well by friends than by strangers”.","R"],["Allen wants us to build “second-self relations even with strangers”.","R"],["Aristotle might accept part of this, because he sees man as “a political creature” who is “born for citizenship”.","N"],["But he would still rank friends above strangers, because for him “the happy man needs friends”, not only fellow citizens.","N"]]}],"cQ":"Do our friends become part of who we are? Provide your own justified response to this question. Support your reasoning with an example.","c":[["I think our friends become part of who we are, but only up to a point.","P"],["When a close friend gets the ATAR they needed, ideally we are really happy for them.","E"],["But it cannot be the same as if it had happened to us.","E"],["They did the work, so some of that joy is theirs alone, and they need to own that achievement and be proud of themselves.","E"],["I can be proud of my friend, but I cannot be proud of myself just for being their friend.","E"],["So friends stay separate people, even when they are very close.","D"],["It also means we need to be careful not to lose ourselves in our friendships.","D"],["Someone who gives up their own interests to keep a friend happy is no longer in a balanced friendship.","D"],["A good friendship is reciprocal, where both people give and both keep their own identity.","D"]]}]},{"id":"aos1-bq4","n":4,"text":"To what extent is the good life dependent on freedom and authenticity?","qs":[{"id":"q15","n":1,"thinker":"de Beauvoir","title":"the serious man","aC":"authenticity","cC":"unchosen values","sum":"The serious man denies his freedom by pretending his values are given rather than chosen, and so makes himself the slave of his goal; human freedom is the one true end.","stim":["The serious man’s dishonesty issues from his being obliged ceaselessly to renew the denial of this freedom. He chooses to live in an infantile world, but to the child the values are really given. The serious man must mask the movement by which he gives them to himself, like the mythomaniac who while reading a love-letter pretends to forget that she has sent it to herself… If one denies the subjective tension of freedom one is evidently forbidding himself universally to will freedom in an indefinite movement. By virtue of the fact that he refuses to recognize that he is freely establishing the value of the end he sets up, the serious man makes himself the slave of that end. He forgets that every goal is at the same time a point of departure and that human freedom is the ultimate, the unique end to which man should destine himself."],"src":"S de Beauvoir, The Ethics of Ambiguity, trans. Bernard Frechtman, Open Road Integrated Media, New York, 2015","aQ":"With reference to the passage above, explain how de Beauvoir might respond to the view that authenticity requires firm commitment to one’s values.","a":[["De Beauvoir thinks most people struggle with the weight of freedom, and describes three problematic responses to it.","I"],["The serious man is one of these, and the passage criticises him.","I"],["A child believes the values of adults are simply facts, and the serious man tries to keep believing this as an adult.","I"],["He hides from himself that he chose his values, and so becomes a slave to his goal.","I"],["De Beauvoir would therefore say that firm commitment is not enough to make us authentic.","L"],["The serious man is firmly committed, but dishonestly.","L"],["Authenticity means admitting our values are our own choice, with freedom as the final goal.","L"],["However, she does not reject commitment, since elsewhere she criticises the sub-man, who avoids every project.","N"]],"bQ":"How might one other thinker studied in Unit 3 respond to de Beauvoir’s view on the role of authenticity in the good life?","b":[{"label":"Nietzsche","thinker":"Nietzsche","s":[["Nietzsche would agree with de Beauvoir that an authentic life means accepting that values are made, not given.","I"],["His noble type “feels himself to be the determiner of values” and “creates values”.","I"],["The herd does the opposite, accepting whatever is shouted at it by “parent, teacher, law, class prejudice, public opinion”.","I"],["Even its leaders “pose as executors of more ancient or higher commands”, which he calls “the moral hypocrisy of the commanders”.","I"],["This resembles her serious man, who “must mask” that he chose his own values.","R"],["However, they differ on who authenticity is for.","N"],["De Beauvoir says “human freedom is the ultimate, the unique end” for everyone.","N"],["Nietzsche keeps value-creation for the noble few, and calls their morality “self-glorification”.","N"]]},{"label":"Aristotle","thinker":"Aristotle","s":[["Aristotle would disagree that a good life depends on authenticity, because he does not think we set up our own values.","I"],["For him the human good is fixed by our function, as “activity of soul exhibiting virtue”.","I"],["He would defend upbringing, since to study ethics a person “must have been brought up in good habits”.","R"],["Keeping the values we were raised with is therefore not dishonest, because that is how good character begins.","R"],["However, he does not want blind obedience, since conduct has “no fixity”, and “the agents themselves must in each case consider what is appropriate to the occasion”.","N"],["So both expect people to think for themselves, but Aristotle thinks there is a right answer to find, while de Beauvoir thinks we create it.","N"]]}],"cQ":"Can a person live a good life while following values they have not chosen for themselves? Provide your own justified response to this question. Support your reasoning with an example.","c":[["I do not think a person can live a good life following values they have not chosen, because a good life requires you to embrace your own freedom.","P"],["I also think choosing them is not always enough.","R"],["An example is the trad wife movement, where women promote 1950s gender roles online, such as submitting to their husbands.","E"],["These roles are inherited, but one trad wife, Estee Williams, has said “the difference is that we have the choice”.","E"],["Someone might argue that this settles it, because a life a woman wants and has chosen must be good for her.","D"],["However, I think it matters what is being chosen.","D"],["Submitting to a husband means handing over decisions about your own life, so it uses freedom to give freedom up.","D"],["Therefore, a good life needs values we have chosen for ourselves, and it cannot be one where we choose subjugation.","D"]]},{"id":"q16","n":2,"thinker":"Nietzsche","title":"the noble type creates values","aC":"authenticity","cC":"creating values","sum":"The noble type determines values, needs no approval and honours whatever is his own; he aids the unfortunate not from pity but from an overflow of power.","stim":["The noble type of man feels himself to be the determiner of values, he does not need to be approved of, he judges ‘what harms me is harmful in itself’, he knows himself to be that which in general first accords honour to things, he creates values. Everything he knows to be part of himself, he honours: such a morality is self-glorification. In the foreground stands the feeling of plenitude, of power which seeks to overflow, the happiness of high tension, the consciousness of a wealth which would like to give away and bestow – the noble human being too aids the unfortunate but not, or almost not, from pity, but more from an urge begotten by superfluity of power."],"src":"F Nietzsche, Beyond Good and Evil, trans. R. J. Hollingdale, Penguin Classics, London, 2003","aQ":"With reference to the passage above, explain how Nietzsche might respond to the view that an authentic life depends on discovering who you really are.","a":[["Nietzsche describes the noble type as someone who decides for himself what is valuable.","I"],["He does not need anyone’s approval, he judges things by how they affect him, and he is the one who gives things their worth.","I"],["He honours whatever he recognises as part of himself.","I"],["Nietzsche would therefore reject the view that an authentic life depends on discovering who you really are.","L"],["The noble person does not search for a true self or for existing values, but creates values and affirms himself.","L"],["However, Nietzsche does not think the self is simple.","N"],["Elsewhere he says most people have inherited a need to obey, and that master and slave morality can exist within the same soul.","N"],["So there may be no single self to discover.","N"]],"bQ":"How might one other thinker studied in Unit 3 respond to Nietzsche’s view on the role of authenticity in the good life?","b":[{"label":"de Beauvoir","thinker":"de Beauvoir","s":[["De Beauvoir would agree with Nietzsche that living authentically means creating our own values.","I"],["She says a person “is freely establishing the value of the end he sets up”, and criticises the “spirit of seriousness” for treating values as “ready-made things”.","I"],["Nietzsche’s noble type, who “creates values”, avoids that mistake.","R"],["However, she would be troubled that he “does not need to be approved of” and that his morality is “self-glorification”.","N"],["He is like her adventurer, who enjoys his own freedom but forgets that he “always meets others along the way”.","N"],["For de Beauvoir, “every man needs the freedom of other men”.","N"],["Nietzsche’s noble person helps the unfortunate from “superfluity of power”, but she would want that help to aim at making others free as well.","N"]]},{"label":"Aristotle","thinker":"Aristotle","s":[["Aristotle would reject Nietzsche’s view that an authentic person “creates values”.","I"],["For Aristotle, what is good is whatever leads to happiness, which he identifies with “living well”, and this is not just a matter of opinion.","I"],["We can work it out by reason, since the good is performing our rational function well.","I"],["It can even be measured, in the way health can.","R"],["Food “above or below a certain amount destroys the health”, and the virtues are also “destroyed by excess and defect, and preserved by the mean”.","R"],["So a good life usually lies between two extremes, whatever the noble person honours.","R"],["However, both distrust the crowd, which Aristotle calls “slavish in their tastes”.","N"],["Aristotle’s standard is reason, while Nietzsche’s is the noble person himself.","N"]]},{"label":"Allen","thinker":"Allen","s":[["Allen would reject Nietzsche’s view that an authentic person “does not need to be approved of”.","I"],["For her, autonomy means “getting one’s way in concert with others, and as modified by them”.","I"],["His rule that “what harms me is harmful in itself” resembles what she calls rivalrous self-interest, “a commitment to one’s own interests without regard to how they affect others”.","R"],["The noble person gives from “superfluity of power”, but she warns such givers often help others “without giving them real power”.","R"],["Yet neither treats helping others as selfless.","N"],["For Nietzsche it expresses the giver’s strength, and Allen’s alternative is equitable self-interest, which “treats the good of others as part of one’s own interests”.","N"],["This fosters the kind of community where we ourselves can thrive.","N"]]}],"cQ":"Does the good life require us to create our own values? Provide your own justified response to this question. Support your reasoning with an example.","c":[["I do not think the good life requires us to create our own values from nothing, but it does require us to examine the values we have and make them our own.","P"],["Most of our values come from family, school and culture, and many of them are good.","R"],["For example, a student whose parents taught them to be honest and work hard does not need to invent new values to live well.","E"],["What they need to do is ask why these values matter, and keep the ones that hold up.","E"],["Nietzsche might say this is still following the herd.","D"],["However, I think questioning a value and deciding to keep it is not the same as obeying.","D"],["Values we make up entirely by ourselves can also be wrong, such as deciding that only our own success matters.","D"],["So the good life requires us to own our values, not to invent them.","D"]]},{"id":"q17","n":3,"thinker":"de Beauvoir","title":"the joy of existing","aC":"freedom","cC":"happiness","sum":"By casting himself into the world a person gives it meaning and can feel the joy of existing; vitality and intelligence are not fixed traits but free ways of engaging with the world.","stim":["Every man casts himself into the world by making himself a lack of being; he thereby contributes to reinvesting it with human signification. He discloses it. And in this movement even the most outcast sometimes feel the joy of existing. They then manifest existence as a happiness and the world as a source of joy. But it is up to each one to make himself a lack of more or less various, profound, and rich aspects of being. What is called vitality, sensitivity, and intelligence are not ready-made qualities, but a way of casting oneself into the world and of disclosing being… There is vitality only by means of free generosity… The reward for these spontaneous qualities issues from the fact that they make significances and goals appear in the world. They discover reasons for existing. They confirm us in the pride and joy of our destiny as man."],"src":"S de Beauvoir, The Ethics of Ambiguity, trans. Bernard Frechtman, Open Road Integrated Media, New York, 2015","aQ":"With reference to the passage above, explain how de Beauvoir might respond to the view that freedom is essential to the good life.","a":[["De Beauvoir argues that a human being is never a finished thing, so we are always reaching out towards the world.","I"],["This reaching is what gives the world human meaning and makes existence a source of joy.","I"],["Qualities like vitality and intelligence are not traits we are given, but ways of freely and generously engaging with the world, which make goals and reasons for living appear.","I"],["De Beauvoir would therefore agree that freedom is essential to the good life, because meaning and joy only come from this free movement.","L"],["However, she acknowledges how hard freedom can be, since elsewhere she says people stay nostalgic for childhood, when values were given to them.","N"],["But she argues that we must grapple with this difficulty if we are to flourish.","N"]],"bQ":"How might one other thinker studied in Unit 3 respond to de Beauvoir’s view on the role of freedom in the good life?","b":[{"label":"Mill","thinker":"Mill","s":[["Mill would agree with de Beauvoir that freedom is essential to the good life.","I"],["For him, “the only freedom which deserves the name, is that of pursuing our own good in our own way”.","I"],["Like de Beauvoir, he thinks a good life cannot be handed to someone, since a person’s “own good” is “not a sufficient warrant” for forcing them.","R"],["However, they mean different things by freedom.","N"],["Mill is mostly concerned with what society must not do to the individual, who is “sovereign” over “his own body and mind”.","N"],["De Beauvoir is concerned with what the individual does.","N"],["A person could be left completely alone, as Mill wants, and still hold back from the world like her sub-man.","N"]]},{"label":"Weil","thinker":"Weil","s":[["Weil would disagree that the good life starts with our own freedom.","I"],["For her, “the notion of obligations comes before that of rights”, and a person “considered in isolation, only has duties”.","I"],["De Beauvoir says goals “appear in the world” because we freely cast ourselves into it.","R"],["Weil thinks our obligations are already there, whether we choose them or not, since an obligation “which goes unrecognized by anybody loses none of the full force of its existence”.","R"],["However, they share some ground.","N"],["De Beauvoir says the freedom of others “must be respected”, and for Weil our one obligation to every person is “respect”.","N"],["The difference is that Weil’s duties are given to us, while de Beauvoir’s meanings are made by us.","N"]]},{"label":"Nietzsche","thinker":"Nietzsche","s":[["Nietzsche would agree with de Beauvoir that a good life means freeing ourselves from values we have been given.","I"],["He values “lofty spiritual independence, the will to stand alone”, and wants people to break out of the herd’s “thou shalt” like the noble type, who “creates values”.","I"],["Like de Beauvoir, he sees this as hard, since it is “the discipline of great suffering” that builds “strength”.","R"],["However, he would reject her view that we must help others become free.","N"],["De Beauvoir says the freedom of others “must be respected and they must be helped to free themselves”.","N"],["For Nietzsche, freedom is each individual’s own task, won by pushing through suffering and adversity.","N"],["His noble type is “proud that he is not made for pity”.","N"]]}],"cQ":"To what extent is happiness dependent on freedom? Provide your own justified response to this question. Support your reasoning with an example.","c":[["I think happiness depends on freedom to a large extent, especially the freedom to be yourself.","P"],["A person who has to hide who they are cannot fully enjoy their life, because part of their energy goes into pretending.","R"],["For example, a La Trobe University survey of more than 6,000 LGBTQA+ young Australians, published in 2021, found that about 60 per cent of those at secondary school had felt unsafe or uncomfortable in the past year because of their sexuality or gender identity.","E"],["The same survey reported high levels of mental ill-health.","E"],["This suggests that when people are not free to be themselves, their happiness suffers.","E"],["Someone might argue that freedom is not enough, since a person can be free and still unhappy.","D"],["I agree, because we also need friends, family and health.","D"],["But without the freedom to be ourselves, I do not think those other things can make us happy.","D"]]},{"id":"q18","n":4,"thinker":"de Beauvoir","title":"others give me the world","aC":"freedom","cC":"the freedom of others","sum":"If I were everything the world would be empty; others give me the world, and only the freedom of others can carry my ends beyond my life, so every man needs the freedom of other men.","stim":["If I were really everything there would be nothing beside me; the world would be empty. There would be nothing to possess, and I myself would be nothing. If he is reasonable, the young man immediately understands that by taking the world away from me, others also give it to me, since a thing is given to me only by the movement which snatches it from me. To will that there be being is also to will that there be men by and for whom the world is endowed with human significations. One can reveal the world only on a basis revealed by other men. No project can be defined except by its interference with other projects. To make being “be” is to communicate with others by means of being… freedom can not will itself without aiming at an open future. The ends which it gives itself must be unable to be transcended by any reflection, but only the freedom of other men can extend them beyond our life. I have tried to show… that every man needs the freedom of other men and, in a sense, always wants it, even though he may be a tyrant; the only thing he fails to do is to assume honestly the consequences of such a wish. Only the freedom of others keeps each one of us from hardening in the absurdity of facticity."],"src":"S de Beauvoir, The Ethics of Ambiguity, trans. Bernard Frechtman, Open Road Integrated Media, New York, 2015","aQ":"With reference to the passage above, explain how de Beauvoir might respond to the view that the good life depends only on our own freedom.","a":[["De Beauvoir argues that our own freedom depends on the freedom of other people.","I"],["Others can seem like rivals, but a world without them would be empty.","I"],["We can only find meaning in a world that others have already given meaning to.","I"],["Freedom also needs an open future, and only other free people can carry our goals on beyond our own lives.","I"],["De Beauvoir would therefore reject the view that the good life depends only on our own freedom.","L"],["Without free people around us, our lives would harden into something fixed and meaningless.","L"],["Even a tyrant needs others to be free, although he will not admit what this requires.","L"],["However, elsewhere she asks for more, arguing that we must help others to free themselves.","N"]],"bQ":"How might one other thinker studied in Unit 3 respond to de Beauvoir’s view on the role of the freedom of others in the good life?","b":[{"label":"Nietzsche","thinker":"Nietzsche","s":[["Nietzsche would agree with de Beauvoir that we must free ourselves from values we have simply been given.","I"],["However, he would reject her claim that “every man needs the freedom of other men”.","R"],["For Nietzsche, freedom is each individual’s own task.","R"],["His noble type “does not need to be approved of” and treats solitude as “a virtue”.","R"],["He also has duties “only towards one’s equals”, so he has no reason to help everyone else become free.","R"],["Yet his noble type still needs other people, since he has “a refined conception of friendship” and even “a certain need to have enemies”.","N"],["De Beauvoir would say he depends on the freedom of others, like her tyrant, and simply fails “to assume honestly the consequences”.","N"]]},{"label":"Allen","thinker":"Allen","s":[["Allen would agree with de Beauvoir that our freedom is tied to the freedom of others.","I"],["For Allen, autonomy means “getting one’s way in concert with others, and as modified by them”.","I"],["This is close to de Beauvoir’s claim that “no project can be defined except by its interference with other projects”.","R"],["Allen also thinks this serves the self.","R"],["Her equitable self-interest “treats the good of others as part of one’s own interests”, and fosters the kind of community where we ourselves can thrive.","R"],["However, their reasons differ.","N"],["De Beauvoir needs other free people so that the world has meaning.","N"],["Allen needs them so that citizens can trust each other, which requires “real habits of power sharing” and a willingness to make sacrifices.","N"]]}],"cQ":"Can a person be free while denying the freedom of others? Provide your own justified response to this question. Support your reasoning with an example.","c":[["I do not think a person can be fully free while denying the freedom of others.","P"],["Under apartheid, white South Africans could vote, travel and live where they liked, while the black majority could not.","E"],["In the ordinary sense they were free.","E"],["However, Nelson Mandela wrote that “a man who takes away another man’s freedom is a prisoner of hatred”, and I think he was right.","E"],["A society like that has to spend its energy on control, through pass laws and police, and its rulers live in fear of the people they hold down.","E"],["Someone might argue that freedom just means nobody stops you doing what you want, so the powerful are free.","D"],["But I think that confuses freedom with power, because white South Africans lived under censorship and could not marry across the colour line.","D"],["So a person who denies others their freedom ends up less free as well.","D"]]},{"id":"q19","n":5,"thinker":"Mill","title":"the three liberties","aC":"freedom","cC":"harm as the limit","sum":"Human liberty has three parts: liberty of conscience and opinion, liberty to plan our own lives as we like so long as we harm no one, and liberty to combine with others.","stim":["This, then, is the appropriate region of human liberty. It comprises, first, the inward domain of consciousness; demanding liberty of conscience, in the most comprehensive sense; liberty of thought and feeling; absolute freedom of opinion and sentiment on all subjects, practical or speculative, scientific, moral, or theological. The liberty of expressing and publishing opinions may seem to fall under a different principle, since it belongs to that part of the conduct of an individual which concerns other people; but, being almost of as much importance as the liberty of thought itself, and resting in great part on the same reasons, is practically inseparable from it. Secondly, the principle requires liberty of tastes and pursuits; of framing the plan of our life to suit our own character; of doing as we like, subject to such consequences as may follow: without impediment from our fellow-creatures, so long as what we do does not harm them, even though they should think our conduct foolish, perverse, or wrong. Thirdly, from this liberty of each individual, follows the liberty, within the same limits, of combination among individuals; freedom to unite, for any purpose not involving harm to others: the persons combining being supposed to be of full age, and not forced or deceived."],"src":"JS Mill, On Liberty (1859), Penguin Classics, London, 1982, pp. 81–82","aQ":"With reference to the passage above, explain how Mill might respond to the view that the good life requires the freedom to live in our own way.","a":[["Mill sets out three freedoms that make up human liberty.","I"],["The first is freedom of thought and opinion, including expressing it.","I"],["The second is the freedom to shape our lives to suit our own character and live as we choose, even if others think we are foolish or wrong.","I"],["The third is the freedom to join with others.","I"],["Mill would therefore strongly agree that the good life requires the freedom to live in our own way, because elsewhere he says each person is the proper guardian of their own wellbeing.","L"],["However, this freedom has limits.","N"],["It ends where our actions harm others, it applies only to adults, and he also says we can be required to help others, for example by saving a life.","N"]],"bQ":"How might one other thinker studied in Unit 3 respond to Mill’s view on the role of freedom in the good life?","b":[{"label":"Singer","thinker":"Singer","s":[["Singer would question how much room Mill leaves for “doing as we like”.","I"],["Mill protects our “tastes and pursuits” as long as they do not harm others.","I"],["Singer argues that when we spend on things like new clothes to look “well-dressed” while others starve, “we ought to give the money away, and it is wrong not to do so”.","R"],["However, Mill partly agrees.","N"],["He accepts that a person “may cause evil to others not only by his actions but by his inaction”.","N"],["The difference is that Mill calls this “the exception”, while Singer makes it the rule.","N"],["Singer also speaks of what we ought to do, not what society may force us to do, so he need not reject Mill’s liberty.","N"]]},{"label":"Allen","thinker":"Allen","s":[["Allen would agree with Mill that each person’s autonomy matters, since “every citizen deserves an autonomy equal to that of other citizens”.","I"],["However, she would think his main limit, which is not harming others, asks too little.","R"],["Mill claims that “mankind are greater gainers by suffering each other to live as seems good to themselves”.","R"],["Allen warns that if “every citizen simply pursues her own self-interest without reservation”, the common good will not follow, and those who think it will “make a sad mistake”.","R"],["For her, a free society needs more than people leaving each other alone.","R"],["It needs equitable self-interest, which “treats the good of others as part of one’s own interests”.","R"],["This fosters the kind of community where we ourselves can thrive.","R"]]},{"label":"de Beauvoir","thinker":"de Beauvoir","s":[["De Beauvoir would agree with Mill that people must be free to shape their own lives.","I"],["He defends “framing the plan of our life to suit our own character”, and she says “human freedom is the ultimate, the unique end”.","I"],["However, she would find two gaps in his view.","R"],["First, Mill mainly asks that we not interfere with each other, while de Beauvoir says others “must be helped to free themselves”.","R"],["Second, Mill excludes some people from liberty, allowing “despotism” over “barbarians” if it improves them.","R"],["De Beauvoir criticises a similar attitude in the colonial administrator, who will build his highway “at the price of a great number of lives of the natives”.","R"]]}],"cQ":"Should our freedom be limited only by harm to others? Provide your own justified response to this question. Support your reasoning with an example.","c":[["I do not think freedom should be limited only by harm to others, although it should be the main limit.","P"],["In 1970 Victoria became the first place in the world to make seatbelts compulsory.","E"],["That year 3,798 people died on Australian roads, and by 2022 the number had fallen to 1,194, partly because of laws like this.","E"],["Mill would object, because not wearing a seatbelt mostly risks your own life, and he says a person’s own good is not enough reason to force them.","D"],["However, I think the law was right, because the cost to freedom is tiny and the benefit is large.","D"],["A defender of Mill might say a road death also harms family, other drivers and hospital staff.","D"],["But then almost any choice harms someone, and his limit would protect very little.","D"],["So a small limit on freedom can be justified to prevent serious harm, even to ourselves.","D"]]}]}]},{"id":"aos2","label":"AOS2","title":"The Good Life and Others","bqs":[{"id":"aos2-bq1","n":1,"text":"What obligations, if any, do we have to others?","qs":[{"id":"q20","n":1,"thinker":"Singer","title":"duty and charity","aC":"obligations","cC":"duty","sum":"Giving to famine relief is treated as charity, so nobody is blamed for buying new clothes instead; in fact we ought to give the money away, and it is wrong not to.","stim":["The outcome of this argument is that our traditional moral categories are upset. The traditional distinction between duty and charity cannot be drawn, or at least, not in the place we normally draw it. Giving money to the Bengal Relief Fund is regarded as an act of charity in our society. The bodies which collect money are known as “charities.” These organisations see themselves in this way – if you send them a check, you will be thanked for your “generosity.” Because giving money is regarded as an act of charity, it is not thought that there is anything wrong with not giving. The charitable man may be praised, but the man who is not charitable is not condemned. People do not feel in any way ashamed or guilty about spending money on new clothes or a new car instead of giving it to famine relief. (Indeed, the alternative does not occur to them.) This way of looking at the matter cannot be justified. When we buy new clothes not to keep ourselves warm but to look “well-dressed” we are not providing for any important need. We would not be sacrificing anything significant if we were to continue to wear our old clothes, and give the money to famine relief. By doing so, we would be preventing another person from starving. It follows from what I have said earlier that we ought to give money away, rather than spend it on clothes which we do not need to keep us warm. To do so is not charitable, or generous. Nor is it the kind of act which philosophers and theologians have called “supererogatory” – an act which it would be good to do, but not wrong not to do. On the contrary, we ought to give the money away, and it is wrong not to do so."],"src":"P Singer, “Famine, Affluence, and Morality”, Philosophy & Public Affairs, vol. 1, no. 3, Spring 1972, p. 235","aQ":"With reference to the passage above, explain how Singer might respond to the view that the good life requires us to fulfil obligations to others.","a":[["Singer argues that we draw the line between duty and charity in the wrong place.","I"],["Society treats giving to famine relief as charity, so the giver is praised but nobody is blamed for buying new clothes instead.","I"],["Singer thinks this is indefensible.","I"],["Clothes bought to look good are not needed, while the same money could stop someone starving, so giving it is a duty and keeping it is wrong.","I"],["Singer would therefore strongly agree that the good life requires us to fulfil obligations to others, because living comfortably while others starve is a wrong way to live.","L"],["However, the obligation has limits.","N"],["Elsewhere he says it only asks us to prevent what is bad, and only when we give up nothing morally significant.","N"]],"bQ":"How might one other thinker studied in Unit 3 respond to Singer’s view on our obligations to others?","b":[{"label":"Wolf","thinker":"Wolf","s":[["Wolf would reject Singer’s view of how far our obligations to others extend.","I"],["Singer denies that giving to famine relief is “supererogatory”.","I"],["Wolf argues that “any plausible moral theory must make use of some conception of supererogation”, so some good acts must go beyond duty.","R"],["Her reason is that someone who spends all his time “raising money for Oxfam” has no room for interests like “playing the oboe”, and his life seems “strangely barren”.","R"],["However, Wolf does not say we owe others nothing.","N"],["She accepts that moral value may be “the most important” kind of value.","N"],["So both think we have obligations to others, but Singer sets the limit very high, while Wolf thinks they must leave room for a life of our own.","N"]]},{"label":"Weil","thinker":"Weil","s":[["Weil would agree with Singer that helping people in need is an obligation and not charity.","I"],["She says it is “an eternal obligation towards the human being not to let him suffer from hunger”, and that no one is “innocent” who “brushes past” a starving person.","I"],["This matches Singer’s claim that “it is wrong not to do so”.","R"],["However, they ground the obligation differently.","N"],["Singer starts from the assumption that suffering is “bad” and that we “ought” to prevent it.","N"],["For Weil, the obligation exists “for the sole reason that he or she is a human being”.","N"],["So both deny that giving is optional, but Singer bases the duty on preventing suffering, while Weil says it is owed to every person simply for being human.","N"]]},{"label":"Nietzsche","thinker":"Nietzsche","s":[["Nietzsche would reject Singer’s view that we have obligations to everyone in need.","I"],["In noble morality “one has duties only towards one’s equals”, and towards everyone else a person “may act as one wishes or ‘as the heart dictates’”.","I"],["He would see Singer’s principle as slave morality, which honours “pity, the kind and helping hand, the warm heart” because these qualities “make easier the existence of the suffering”.","R"],["However, Nietzsche’s noble person does help others.","N"],["He “aids the unfortunate”, though “from an urge begotten by superfluity of power” and hardly at all from pity.","N"],["So Nietzsche defends a version of the view Singer attacks, in which helping those of lower rank is a free choice and not an obligation.","N"]]}],"cQ":"Is giving to those in need a duty, or an optional extra? Provide your own justified response to this question. Support your reasoning with an example.","c":[["I think giving to those in need is a duty, but a limited one.","P"],["If I can prevent something very bad at a small cost to myself, it would be wrong not to.","R"],["For example, imagine a student who has saved $150 for new sneakers when the old pair is still fine.","E"],["The same money could pay for meals or medicine for people who have none.","E"],["I think they ought to give most of it, because going without new shoes costs them almost nothing.","E"],["Singer might say the duty does not stop there, since the next purchase could also save a life.","D"],["However, if every dollar we do not strictly need is owed to others, we would have no room for hobbies, friends or anything of our own.","D"],["So I think giving what we can easily spare is a duty, and giving beyond that is generosity.","D"]]},{"id":"q21","n":2,"thinker":"Weil","title":"the obligation of respect","aC":"obligations","cC":"the needs of others","sum":"Our one obligation to every human being is respect, shown through meeting their earthly needs; nobody thinks a person innocent who brushes past someone starving, so feeding the hungry is an eternal obligation.","stim":["The fact that a human being possesses an eternal destiny imposes only one obligation: respect. The obligation is only performed if the respect is effectively expressed in a real, not a fictitious, way; and this can only be done through the medium of Man’s earthly needs. On this point, the human conscience has never varied. Thousands of years ago, the Egyptians believed that no soul could justify itself after death unless it could say: ‘I have never let any one suffer from hunger.’ All Christians know they are liable to hear Christ himself say to them one day: ‘I was an hungered, and ye gave me meat.’ Every one looks on progress as being, in the first place, a transition to a state of human society in which people will not suffer from hunger. To no matter whom the question may be put in general terms, nobody is of the opinion that any man is innocent if, possessing food himself in abundance and finding some one on his doorstep three parts dead from hunger, he brushes past without giving him anything. So it is an eternal obligation towards the human being not to let him suffer from hunger when one has the chance of coming to his assistance. This obligation being the most obvious of all, it can serve as a model on which to draw up the list of eternal duties towards each human being."],"src":"S Weil, The Need for Roots, 2nd edn, trans. A Wills, Routledge Classics, Routledge, London, 2002, pp. 5–6","aQ":"With reference to the passage above, explain how Weil might respond to the view that our only obligation to others is to leave them alone.","a":[["Weil argues that we owe every human being respect, and that respect is only real when it is shown by meeting people’s needs in this life.","I"],["Her clearest case is hunger.","I"],["People in every age have agreed that someone with plenty who walks past a starving person is not innocent.","I"],["So feeding the hungry when we can is an eternal obligation.","I"],["Weil would therefore reject the view that our only obligation to others is to leave them alone, because walking past a starving person is a failure of respect, and a life lived that way cannot be good.","L"],["However, the obligation is not to give people whatever they want.","N"],["Elsewhere she limits the list of obligations to needs that are as vital as hunger.","N"]],"bQ":"How might one other thinker studied in Unit 3 respond to Weil’s view on our obligations to others?","b":[{"label":"Nietzsche","thinker":"Nietzsche","s":[["Nietzsche would reject Weil’s view that we have an obligation to every human being in need.","I"],["In noble morality “one has duties only towards one’s equals”, and the noble person is “proud that he is not made for pity”.","I"],["He would treat Weil’s concern for the hungry as pity, and say it keeps them weak and mediocre.","R"],["He calls this kind of pity “the worst of all pampering and weakening”, since it is “the discipline of suffering” that builds strength.","R"],["However, his noble person also “aids the unfortunate”, though “from an urge begotten by superfluity of power”.","N"],["So his noble person might still feed the hungry man, but as a free act of strength, whereas for Weil it is a duty owed to everyone.","N"]]},{"label":"Mill","thinker":"Mill","s":[["Mill would partly agree with Weil that our obligations go beyond leaving others alone.","I"],["He accepts that a person “may cause evil to others not only by his actions but by his inaction”, and that we can be required to perform acts like “saving a fellow-creature’s life”.","I"],["Walking past Weil’s starving man would surely count.","R"],["However, for Mill, making someone answerable for “not preventing evil” is “the exception”.","N"],["His main concern is that power is used over a person only “to prevent harm to others”.","N"],["Weil’s obligation, by contrast, is “eternal” and “unconditional”.","N"],["So both think we must sometimes help, but for Weil this is the most obvious duty of all, while for Mill being held to account for not helping is the exception.","N"]]}],"cQ":"Can we ignore the basic needs of others and still live a good life? Provide your own justified response to this question. Support your reasoning with an example.","c":[["I do not think we can ignore the basic needs of others and still live a good life, because a good life is lived among other people and depends partly on how we treat them.","P"],["For example, Foodbank’s 2025 Hunger Report found that about one in three Australian households faced food insecurity, and one in five skipped meals or went whole days without eating.","E"],["So hunger is not far away, and some of these people are in our own schools and streets.","E"],["Someone might argue that a person can ignore all this and still be happy and successful, as long as they harm no one.","D"],["However, I think that life is comfortable rather than good, because it depends on choosing not to see people we could help.","D"],["So a good life requires us to respond to the basic needs of others when we are able to.","D"]]},{"id":"q22","n":3,"thinker":"Mill","title":"the harm principle","aC":"obligations","cC":"responsibility","sum":"Power may be used over a person against their will only to prevent harm to others; their own good is never sufficient reason, and over themselves the individual is sovereign.","stim":["The object of this Essay is to assert one very simple principle, as entitled to govern absolutely the dealings of society with the individual in the way of compulsion and control, whether the means used be physical force in the form of legal penalties, or the moral coercion of public opinion. That principle is, that the sole end for which mankind are warranted, individually or collectively, in interfering with the liberty of action of any of their number, is self-protection. That the only purpose for which power can be rightfully exercised over any member of a civilised community, against his will, is to prevent harm to others. His own good, either physical or moral, is not a sufficient warrant. He cannot rightfully be compelled to do or forbear because it will be better for him to do so, because it will make him happier, because, in the opinions of others, to do so would be wise, or even right. These are good reasons for remonstrating with him, or reasoning with him, or persuading him, or entreating him, but not for compelling him, or visiting him with any evil in case he do otherwise. To justify that, the conduct from which it is desired to deter him must be calculated to produce evil to some one else. The only part of the conduct of any one, for which he is amenable to society, is that which concerns others. In the part which merely concerns himself, his independence is, of right, absolute. Over himself, over his own body and mind, the individual is sovereign."],"src":"JS Mill, On Liberty (1859), Penguin Classics, London, 1982, p. 79","aQ":"With reference to the passage above, explain how Mill might respond to the view that the good life requires us to fulfil obligations to others.","a":[["Mill argues that society may only use force or public pressure against a person to stop them harming others.","I"],["A person’s own good is never enough reason to compel them.","I"],["The passage is about liberty, but it also tells us what we owe each other.","I"],["Mill would agree that the good life requires us to fulfil obligations to others, but he strictly limits what society can force on us.","L"],["We must not harm others, and we must leave them free in what only concerns themselves, because a good life has to be chosen by the person living it.","L"],["However, Mill’s obligations are not only negative.","N"],["Elsewhere he says we can rightly be required to help, for example by saving a life.","N"]],"bQ":"How might one other thinker studied in Unit 3 respond to Mill’s view on our obligations to others?","b":[{"label":"Singer","thinker":"Singer","s":[["Singer would say that Mill’s view of our obligations to others is too narrow.","I"],["Mill holds that making a person answerable “for not preventing evil” is “the exception”.","I"],["For Singer it is the rule.","R"],["He argues that “if it is in our power to prevent something bad from happening”, without a comparable sacrifice, “we ought, morally, to do it”, even for someone “ten thousand miles away”.","R"],["So buying things we do not need while others starve is wrong, where Mill would likely count this among our own “tastes and pursuits”.","R"],["However, Mill accepts that we can be required to save “a fellow-creature’s life”, like Singer’s “child drowning”.","N"],["So both think inaction can be wrong, but Singer extends this to all suffering we could prevent.","N"]]},{"label":"Weil","thinker":"Weil","s":[["Weil would say Mill’s view on our obligations to others starts from the wrong place.","I"],["Mill begins with the individual, who is “sovereign” over “his own body and mind”, so our main obligation is to leave others free.","I"],["Weil argues that “the notion of obligations comes before that of rights”.","R"],["Her most obvious duty, “not to let him suffer from hunger”, goes beyond not interfering.","R"],["However, both think an obligation can bind us when nobody enforces it.","N"],["Mill says that where society should not enforce a duty, “the conscience of the agent himself should step into the vacant judgment seat”.","N"],["Weil says an unrecognised obligation “loses none of the full force of its existence”.","N"],["So both take obligations seriously, but only Weil puts them first.","N"]]},{"label":"Allen","thinker":"Allen","s":[["Allen would say that Mill’s view of our obligations to others asks too little.","I"],["For Mill we must not harm others and must do our fair share of joint work, but otherwise we are free to pursue “our own good in our own way”.","I"],["Allen would reply that a community needs more.","R"],["Citizens need “equitable self-interest”, which “treats the good of others as part of one’s own interests”.","R"],["She draws on Aristotle’s point that it is “a duty” to “take the initiative in doing a service oneself”.","R"],["However, Allen shares Mill’s concern for freedom, and wants citizens to pursue “liberty and equality simultaneously”.","N"],["So both want people to be free, but Allen thinks freedom depends on citizens doing more for each other than avoiding harm.","N"]]}],"cQ":"To what extent are we responsible for the good of others? Provide your own justified response to this question. Support your reasoning with an example.","c":[["I think we are partly responsible for the good of others.","P"],["We should help and speak up because we care how their lives go, but their choices are theirs.","R"],["For example, imagine my eighteen-year-old friend starts smoking weed every day and says it is none of my business.","E"],["I am responsible for telling her that I am worried, and for helping if she decides to quit.","E"],["It is not my place to throw out her weed or tell her parents, because it is her body and her decision.","E"],["Someone might argue that her choice only affects her, so I should stay out of it.","D"],["However, staying silent would show I did not care how her life turns out, and I think we owe that care to people close to us.","D"],["So we are responsible for caring about the good of others and acting on it, but not for controlling them.","D"]]},{"id":"q23","n":4,"thinker":"Nietzsche","title":"duties only to equals","aC":"obligations","cC":"selflessness","sum":"The noble person is hard on himself, proud not to be made for pity and hostile to selflessness; in noble morality one has duties only towards one’s equals.","stim":["The noble human being honours in himself the man of power, also the man who has power over himself, who understands how to speak and how to keep silent, who enjoys practising severity and harshness upon himself and feels reverence for all that is severe and harsh… A man of this type is actually proud that he is not made for pity: which is why the hero of the saga adds as a warning: ‘he whose heart is not hard in youth will never have a hard heart’. Brave and noble men who think that are at the farthest remove from that morality which sees the mark of the moral precisely in pity or in acting for others or in désintéressement; belief in oneself, pride in oneself, a fundamental hostility and irony for ‘selflessness’ belong just as definitely to noble morality as does a mild contempt for and caution against sympathy and the ‘warm heart’… A morality of the rulers is, however, most alien and painful to contemporary taste in the severity of its principle that one has duties only towards one’s equals; that towards beings of a lower rank, towards everything alien, one may act as one wishes or ‘as the heart dictates’ and in any case ‘beyond good and evil’: it is here that pity and the like can have a place. The capacity for and the duty of protracted gratitude and protracted revenge – both only among one’s equals – subtlety in requital, a refined conception of friendship, a certain need to have enemies: all these are typical marks of noble morality."],"src":"F Nietzsche, Beyond Good and Evil, trans. R. J. Hollingdale, Penguin Classics, London, 2003, pp. 92–93","aQ":"With reference to the passage above, explain how Nietzsche might respond to the view that we have the same obligations to everyone.","a":[["Nietzsche describes a noble morality in which a person is proud, hard on himself and suspicious of pity and selflessness.","I"],["In this morality duties are owed only to equals.","I"],["Gratitude and revenge are serious duties, but they hold between people of the same rank, and towards those of lower rank a person may act as he likes.","I"],["Nietzsche would therefore reject the view that we have the same obligations to everyone.","L"],["For him what we owe depends on rank, so the good life for a noble person is not one spent serving everyone equally.","L"],["However, the noble person does not ignore others.","N"],["Elsewhere Nietzsche says he helps the unfortunate, though from an overflow of power and hardly from pity, so it is not owed.","N"]],"bQ":"How might one other thinker studied in Unit 3 respond to Nietzsche’s view on our obligations to others?","b":[{"label":"Weil","thinker":"Weil","s":[["Weil would reject Nietzsche’s view that we have obligations only to our equals.","I"],["Nietzsche holds that “one has duties only towards one’s equals”.","I"],["Weil argues that “all human beings are bound by identical obligations”, and that these are owed to “every human being for the sole reason that he or she is a human being”.","R"],["She says the obligation is not based on “social structure” or the “relative state of forces”, which is what Nietzsche’s ranking of people relies on.","R"],["However, the disagreement is not about pity.","N"],["Nietzsche’s noble person is “proud that he is not made for pity”, and Weil appeals to “respect”.","N"],["So both speak of duty, but Weil owes respect to everyone, while Nietzsche keeps duties for people of the same rank.","N"]]},{"label":"Singer","thinker":"Singer","s":[["Singer would reject Nietzsche’s view that our obligations depend on a person’s rank.","I"],["For Nietzsche, towards “everything alien, one may act as one wishes”.","I"],["Singer argues that “it makes no moral difference” whether the person I can help is a neighbour or “a Bengali whose name I shall never know”.","R"],["If we accept “any principle of impartiality, universalizability, equality”, we cannot “discriminate” by distance, and rank would be no better a reason.","R"],["However, both challenge ordinary morality.","N"],["Nietzsche says noble morality is “most alien and painful to contemporary taste”, and Singer wants “our moral conceptual scheme” to be “altered”.","N"],["So both reject accepted morality, but Singer widens our obligations to everyone, while noble morality keeps them among equals.","N"]]},{"label":"Allen","thinker":"Allen","s":[["Allen would reject Nietzsche’s view that our obligations stop at our equals.","I"],["Both connect what we owe others with friendship.","N"],["Nietzsche counts “a refined conception of friendship” and the “duty of protracted gratitude” among the marks of noble morality, and Allen describes friends as people to whom we owe debts that we must “acknowledge and repay”.","N"],["However, Nietzsche’s duty of gratitude holds “only among one’s equals”.","R"],["Allen argues that it is to a citizen’s benefit “to cultivate second-self relations even with strangers”.","R"],["Because we live among strangers, our self-interest “should be equitable, not rivalrous”.","R"],["So where Nietzsche keeps gratitude and friendship for people of the same rank, Allen wants the habits of friendship extended to everyone we share a society with.","R"]]}],"cQ":"Is selflessness a virtue? Provide your own justified response to this question. Support your reasoning with an example.","c":[["I think selflessness is a virtue, but only when it does not take over a person’s whole life.","P"],["Putting someone else first is admirable because families and communities depend on people doing it.","R"],["For example, about three million Australians care for a family member or friend.","E"],["Most of us would call that selfless and good.","E"],["However, the 2025 Carer Wellbeing Survey found that 61 per cent of carers had low wellbeing, compared with 34 per cent of Australian adults.","E"],["Someone might argue that this shows selflessness is not a virtue at all, because it wears down the people who practise it.","D"],["I disagree, because we would think less of someone who walked away from a parent who needed them.","D"],["What the survey shows is that selflessness needs limits and support.","D"],["So I think selflessness is a virtue when it is balanced with some care for ourselves.","D"]]}]},{"id":"aos2-bq2","n":2,"text":"What is the role of rights and justice in the good life?","qs":[{"id":"q24","n":1,"thinker":"Weil","title":"obligations before rights","aC":"rights","cC":"the rights of others","sum":"Obligations come before rights; a right is only effective when others recognise an obligation towards its holder, and a man alone in the universe would have obligations but no rights.","stim":["The notion of obligations comes before that of rights, which is subordinate and relative to the former. A right is not effectual by itself, but only in relation to the obligation to which it corresponds, the effective exercise of a right springing not from the individual who possesses it, but from other men who consider themselves as being under a certain obligation towards him. Recognition of an obligation makes it effectual. An obligation which goes unrecognized by anybody loses none of the full force of its existence. A right which goes unrecognized by anybody is not worth very much. It makes nonsense to say that men have, on the one hand, rights, and on the other hand, obligations. Such words only express differences in point of view. The actual relationship between the two is as between object and subject. A man, considered in isolation, only has duties, amongst which are certain duties towards himself. Other men, seen from his point of view, only have rights. He, in his turn, has rights, when seen from the point of view of other men, who recognize that they have obligations towards him. A man left alone in the universe would have no rights whatever, but he would have obligations."],"src":"S Weil, The Need for Roots, 2nd edn, trans. A Wills, Routledge Classics, Routledge, London, 2002, pp. 1–3","aQ":"With reference to the passage above, explain how Weil might respond to the view that the good life depends on having our rights respected.","a":[["Weil argues that obligations come before rights.","I"],["A right does nothing by itself and only has effect when other people accept that they have an obligation towards its holder.","I"],["So what I owe another person is my obligation, and the same thing, seen as what he is owed, is his right.","I"],["Weil would therefore only partly agree that the good life depends on having our rights respected.","L"],["She would say the good life really depends on people recognising what they owe each other, because a right nobody recognises is worth very little.","L"],["However, she does not dismiss rights.","N"],["Elsewhere she says that what are called positive rights express the obligation owed to every human being, though in “a confused and imperfect form”.","N"]],"bQ":"How might one other thinker studied in Unit 3 respond to Weil’s view on the role of rights in the good life?","b":[{"label":"Mill","thinker":"Mill","s":[["Mill would give rights a bigger role in the good life than Weil does.","I"],["For Weil a right is “subordinate and relative” to obligation, so duties come first.","I"],["Mill starts with the individual, who is “sovereign” over “his own body and mind” and whose independence in what only concerns himself is “of right, absolute”.","R"],["For Mill the only freedom worth the name is “pursuing our own good in our own way”, and we can only live like that if others respect our choices.","R"],["However, Mill’s rights also depend on other people.","N"],["A society is not free unless these liberties are “on the whole, respected”.","N"],["So both think rights depend on other people, but Weil puts the duty first and Mill puts the individual’s liberty first.","N"]]},{"label":"Nietzsche","thinker":"Nietzsche","s":[["Nietzsche would reject Weil’s view on the role of rights in the good life.","I"],["Weil puts obligations before rights because a right only takes effect through someone else’s duty, and her obligation is owed to “every human being”.","I"],["Nietzsche fears that man could be reduced to “the pygmy animal of equal rights and equal pretensions”, and sees equal rights as part of the “diminution of man”.","R"],["He does speak of duties, as Weil does, but in the morality of the rulers he describes, “one has duties only towards one’s equals”.","N"],["So Weil thinks a good life needs everyone to be shown the respect they are owed, while Nietzsche thinks equal rights and equal obligations hold exceptional people down to the level of the herd.","N"]]}],"cQ":"Can we live a good life if the rights of others are not recognised? Provide your own justified response to this question. Support your reasoning with an example.","c":[["I do not think we can live a fully good life if the rights of others are not recognised, because rights that are ignored for some people are not secure for anyone.","P"],["For example, during the immigration raids in the United States in 2025, people were arrested in streets and workplaces.","E"],["ProPublica found that more than 170 American citizens were detained as well, and about two dozen were held for over a day unable to call a lawyer or family.","E"],["Someone might argue that a person who is not targeted can still live well.","D"],["However, these cases show that once a society stops recognising some people’s rights, everyone’s rights depend on luck.","D"],["I also think it is hard to call a life good if it carries on normally while neighbours are taken away.","D"],["So a fully good life is not possible unless the rights of others are recognised.","D"]]},{"id":"q25","n":2,"thinker":"Allen","title":"distributive justice","aC":"justice","cC":"inequality","sum":"Distributive justice allots public goods in proportion, as dinner portions match appetites; Aristotle would have people receive from the public store in proportion to what they give, with honour as the good the poor can give.","stim":["Distributive justice, the first type, organizes the allotment of public goods – honor, money, property. It depends on a “geometric” or proportional notion of equality. For instance, two people get an equal amount to eat for dinner when each is served a portion in proportion to his appetite. Although one diner may get a larger serving than another, each will have been treated equally provided that in each case the serving matches the appetite. Every type of regime has its own principle of desert for deciding how to make proportional distributions: aristocracies, for instance, assign greater benefits to nobly born citizens. Aristotle advocates instead an approach in which people receive benefits from the public store equivalent to what they have given to it, and he consistently argues, for instance, that the rich should contribute proportionally more wealth to the public store and receive proportionally more honor in return. Honor is the good that the poor have to give."],"src":"DS Allen, Talking to Strangers: Anxieties of Citizenship since Brown v. Board of Education, The University of Chicago Press, Chicago, 2004, pp. 121–122","aQ":"With reference to the passage above, explain how Allen might respond to the view that the good life requires a society in which everyone gets what they deserve.","a":[["Allen explains distributive justice, which shares out public goods such as money and honour.","I"],["It treats people equally by giving in proportion, so one person may get more than another.","I"],["In Aristotle’s approach people receive in proportion to what they give, and material goods can be exchanged for honour.","I"],["The rich contribute more wealth and receive more honour in return, since honour is what the poor have to give.","I"],["Allen would partly agree that the good life requires a society in which everyone gets what they deserve, because fair shares protect equality between citizens.","L"],["However, she does not think this is enough.","N"],["Elsewhere she argues that no society can make every decision a perfect bargain, so citizens must sometimes accept less than they are owed.","N"]],"bQ":"How might one other thinker studied in Unit 3 respond to Allen’s view on the role of justice in the good life?","b":[{"label":"Nietzsche","thinker":"Nietzsche","s":[["Nietzsche would reject Allen’s view that the role of justice in the good life is to keep citizens equal and free.","I"],["In the justice Allen sets out, “equality and freedom are the objectives”.","I"],["Nietzsche calls the democratic movement “a form assumed by man in decay”, and says the herd treats whatever is “dangerous to equality” as immoral.","R"],["However, he would accept that people should not all receive the same.","N"],["In noble morality there is an “order of rank”, closer to the aristocracies Allen mentions, which “assign greater benefits to nobly born citizens”.","N"],["So both accept that some may receive more, but Allen’s proportional shares are meant to treat citizens as equals, while Nietzsche’s order of rank denies that they are equals.","N"]]}],"cQ":"Can we live the good life in a deeply unequal society? Provide your own justified response to this question. Support your reasoning with an example.","c":[["I think a deeply unequal society makes the good life depend on luck, so most people cannot fully live it.","P"],["For example, imagine two equally capable Year 12 students in the same city.","E"],["One has small classes, a tutor and a quiet room to study.","E"],["The other works twenty hours a week at a supermarket to help with rent, shares a bedroom, and goes to a school that cannot find a specialist maths teacher.","E"],["She can still work hard, but her choices about university and work are narrower before she starts.","E"],["Someone might argue that the first student can still live a good life.","D"],["However, her life is less good than it looks, because her success depended partly on where she was born, and it is lived alongside people shut out of the same chances.","D"],["So most people cannot fully live the good life in a deeply unequal society.","D"]]},{"id":"q26","n":3,"thinker":"Mill","title":"the harm principle","aC":"rights","cC":"bad choices","sum":"Power may be used over a person against their will only to prevent harm to others; their own good is never sufficient reason, and over themselves the individual is sovereign.","stim":["The object of this Essay is to assert one very simple principle, as entitled to govern absolutely the dealings of society with the individual in the way of compulsion and control, whether the means used be physical force in the form of legal penalties, or the moral coercion of public opinion. That principle is, that the sole end for which mankind are warranted, individually or collectively, in interfering with the liberty of action of any of their number, is self-protection. That the only purpose for which power can be rightfully exercised over any member of a civilised community, against his will, is to prevent harm to others. His own good, either physical or moral, is not a sufficient warrant. He cannot rightfully be compelled to do or forbear because it will be better for him to do so, because it will make him happier, because, in the opinions of others, to do so would be wise, or even right. These are good reasons for remonstrating with him, or reasoning with him, or persuading him, or entreating him, but not for compelling him, or visiting him with any evil in case he do otherwise. To justify that, the conduct from which it is desired to deter him must be calculated to produce evil to some one else. The only part of the conduct of any one, for which he is amenable to society, is that which concerns others. In the part which merely concerns himself, his independence is, of right, absolute. Over himself, over his own body and mind, the individual is sovereign."],"src":"JS Mill, On Liberty (1859), Penguin Classics, London, 1982, p. 79","aQ":"With reference to the passage above, explain how Mill might respond to the view that society has the right to make people live well.","a":[["Mill argues that society may only use its power over a person to protect others from harm.","I"],["It may not force someone to act because it would make them happier or better, although people may try to persuade them.","I"],["Mill would therefore
