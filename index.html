          <li><b>Colour by step</b> highlights each sentence by the job it is doing, using the colours above. Switch it off to read a response as plain prose.</li>
          <li><b>Practice mode</b> hides the model responses so you can plan your own answer first, then reveal each one to compare.</li>
          <li><b>Big Question filter</b> shows one Big Question at a time. <b>Thinker filter</b> shows only the questions where a thinker is the stimulus or is used in part (b), and switches part (b) to that thinker where it can. The two filters combine.</li>
          <li><b>Thinkers</b> gathers what each set text says on each Big Question, with links back to the questions where that thinker is used.</li>
        </ul></div>
      <div class="card"><h3>The eight Big Questions</h3><p class="sub">${DATA.aos.reduce((n,a)=>n+a.bqs.reduce((m,b)=>m+b.qs.length,0),0)} set-text questions, plus ${DATA.stim.length} stimulus-style questions, one per Big Question.</p><div class="map">${DATA.aos.map(mapList).join('')}</div></div>
    </div>`;
  }

  // Render
  document.getElementById('guide').innerHTML=renderGuide();
  DATA.aos.forEach(a=>{document.getElementById(a.id).innerHTML=renderAOS(a);});
  document.getElementById('stim').innerHTML=renderStim();
  let selThinker=load('thinker','');
  if(selThinker&&!thinkerById(selThinker))selThinker='';
  function paintThinkers(){document.getElementById('thinkers').innerHTML=renderThinkers(selThinker);}
  paintThinkers();
  const TABS=['guide','aos1','aos2','stim','thinkers'];

  // State
  let colour=load('colour',true), practice=load('practice',false);
  function applyModes(){
    document.body.classList.toggle('plain',!colour);
    document.body.classList.toggle('practice',practice);
    document.querySelectorAll('[data-switch="colour"]').forEach(b=>b.setAttribute('aria-checked',String(colour)));
    document.querySelectorAll('[data-switch="practice"]').forEach(b=>b.setAttribute('aria-checked',String(practice)));
  }
  applyModes();

  function showTab(id,push){
    document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.tab===id)));
    document.querySelectorAll('.panel').forEach(p=>{p.hidden=p.id!==id;});
    store('tab',id);
    if(push){try{history.replaceState(null,'','#'+id);}catch(e){}}
  }
  const hash=(location.hash||'').replace('#','');
  const first=TABS.includes(hash)?hash:load('tab','guide');
  showTab(first,false);
  if(hash&&!TABS.includes(hash)){
    const sec=document.getElementById(hash);
    if(sec){const panel=sec.closest('.panel');if(panel){showTab(panel.id,false);setTimeout(()=>sec.scrollIntoView(),0);}}
  }

  function setOpen(card,open){
    card.classList.toggle('open',open);
    card.querySelector('.q-head').setAttribute('aria-expanded',String(open));
  }
  function altData(qid){
    for(const a of DATA.aos)for(const b of a.bqs)for(const q of b.qs)if(q.id===qid)return q;
    return null;
  }
  function selectAlt(qid,i){
    const q=altData(qid);if(!q)return;
    const slot=document.getElementById(qid+'-bslot');
    const wasShown=slot.querySelector('.resp.shown');
    slot.innerHTML=respBox(q.b[i].s,'b',qid+'-b');
    if(wasShown)slot.querySelector('.resp').classList.add('shown');
    document.querySelectorAll(`.alt[data-q="${qid}"]`).forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.alt)===i)));
  }
  const filters={};
  function applyFilter(panel,name,bq){
    const f=filters[panel.id]||(filters[panel.id]={th:'',bq:''});
    if(name!==undefined)f.th=name;
    if(bq!==undefined)f.bq=bq;
    name=f.th;
    panel.querySelectorAll('.chip[data-filter]').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.filter===name)));
    panel.querySelectorAll('[data-bqfilter]').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.bqfilter===f.bq)));
    let shown=0;
    panel.querySelectorAll('.q').forEach(card=>{
      const list=card.dataset.thinkers.split('|');
      const inBq=!f.bq||card.closest('.bq').id===f.bq;
      const match=inBq&&(!name||list.includes(name));
      card.hidden=!match;
      if(match)shown++;
      card.querySelectorAll('.tag.role').forEach(el=>el.remove());
      if(name&&match&&card.dataset.stim!==name){
        const q=altData(card.id);const idx=q.b.findIndex(a=>a.thinker===name);
        if(idx>=0)selectAlt(card.id,idx);
        card.querySelector('.q-meta').insertAdjacentHTML('beforeend',`<span class="tag role">${esc(name)} in part (b)</span>`);
      }
    });
    panel.querySelectorAll('.bq').forEach(sec=>{
      const total=sec.querySelectorAll('.q').length,vis=sec.querySelectorAll('.q:not([hidden])').length;
      sec.classList.toggle('empty',vis===0);
      const cnt=sec.querySelector('.count');if(cnt)cnt.textContent=name?`${vis} of ${total} questions`:`${total} questions`;
    });
    const note=panel.querySelector('.filter-note');if(!note)return;
    if(name){note.hidden=false;note.textContent=`Showing ${shown} question${shown===1?'':'s'} where ${name} is the stimulus thinker or a part (b) comparison${f.bq?' in this Big Question':''}. Part (b) has been switched to ${name} where that answer exists.`;}
    else{note.hidden=true;}
  }

  function openQuestion(id){
    const card=document.getElementById(id);if(!card)return;
    const panel=card.closest('.panel');
    showTab(panel.id,true);
    if(card.hidden){applyFilter(panel,'','');}
    setOpen(card,true);
    setTimeout(()=>card.scrollIntoView({block:'start'}),0);
  }
  document.addEventListener('click',e=>{
    const t=e.target.closest('button,a');if(!t)return;
    if(t.dataset.thinker!==undefined){selThinker=t.dataset.thinker;store('thinker',selThinker);paintThinkers();applyModes();window.scrollTo({top:0});return;}
    if(t.dataset.open){openQuestion(t.dataset.open);return;}
    if(t.classList.contains('tab')){showTab(t.dataset.tab,true);window.scrollTo({top:0});return;}
    if(t.dataset.toggle){const card=document.getElementById(t.dataset.toggle);setOpen(card,!card.classList.contains('open'));return;}
    if(t.dataset.alt!==undefined){selectAlt(t.dataset.q,Number(t.dataset.alt));return;}
    if(t.dataset.reveal){document.getElementById(t.dataset.reveal).classList.add('shown');return;}
    if(t.dataset.switch==='colour'){colour=!colour;store('colour',colour);applyModes();return;}
    if(t.dataset.switch==='practice'){practice=!practice;store('practice',practice);if(!practice)document.querySelectorAll('.resp.shown').forEach(r=>r.classList.remove('shown'));applyModes();return;}
    if(t.dataset.expand!==undefined){const panel=t.closest('.panel');panel.querySelectorAll('.q:not([hidden])').forEach(c=>setOpen(c,t.dataset.expand==='1'));return;}
    if(t.dataset.filter!==undefined){applyFilter(t.closest('.panel'),t.dataset.filter,undefined);return;}
    if(t.dataset.bqfilter!==undefined){const panel=t.closest('.panel');applyFilter(panel,undefined,t.dataset.bqfilter);if(t.dataset.bqfilter){const sec=document.getElementById(t.dataset.bqfilter);const top=panel.querySelector('.toolbar').getBoundingClientRect().top;if(top<0)sec.scrollIntoView({block:'start'});}return;}
    if(t.dataset.jump){
      e.preventDefault();
      const target=document.getElementById(t.dataset.jump);
      if(t.dataset.goto){showTab(t.dataset.goto,true);}
      if(target){target.scrollIntoView({behavior:'smooth',block:'start'});}
      return;
    }
  });
})();
</script>

</body>
</html>
