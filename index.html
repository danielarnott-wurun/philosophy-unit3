e an obligation “unrecognized by anybody loses none of the full force of its existence”.","1"],["Nietzsche would accept the claim about most people, not about equals.","2"],["In noble morality “one has duties only towards one’s equals”, and towards everyone else a person “may act as one wishes”.","2"],["Among equals, however, it includes “the duty of protracted gratitude” and “a refined conception of friendship”, so loyalty is owed there.","2"],["They disagree about where obligation comes from.","X"],["For Weil respect, which unfair treatment denies, is owed to every person and is not based on “social structure”, while for Nietzsche duties depend on rank and stop at one’s equals.","X"]],"cQ":"Which of the two responses you discussed in part (b) do you find more compelling? Justify your answer.","c":[["I find Weil’s response more compelling.","P"],["Nietzsche is right that loyalty is strongest between people who are equals, and even he would not accept the post’s claim that loyalty is owed to nobody.","R"],["However, his view leaves anyone ranked lower owed nothing at all, and the post goes one step further by saying this of everyone.","R"],["If fair treatment depends on rank, most people will never receive it.","R"],["Weil avoids this by making the obligation unconditional.","R"],["Someone might object that her view asks too much, and that the post is popular because people are tired of being asked to give.","D"],["I think this misreads her.","D"],["Her obligation is respect, shown by not ignoring needs as vital as hunger.","D"],["She does not say I owe everyone a text back or a smile.","D"],["So Weil explains why we owe everyone respect, including fair treatment, while leaving small things up to us.","D"]]},{"id":"s6","n":6,"bq":"What is the role of rights and justice in the good life?","bqId":"aos2-bq2","aos":"aos2","title":"Closing the Gap","intro":"Read the following extract.","stim":["Each year, the Australian Government publishes its Closing the Gap report. Each year, most targets are not met. Aboriginal and Torres Strait Islander men born today can expect to live almost nine years less than non-Indigenous Australians. First Nations adults are imprisoned at more than thirteen times the rate of the general population. These figures are reported, acknowledged as unacceptable, and then the news cycle moves on. Most Australians continue to live comfortably, aware in a general sense that these inequities exist but largely unaffected by them in their daily lives."],"img":null,"aQ":"What is the role of rights and justice in the good life? Using the persistence of the Closing the Gap as your central example, provide your own justified response to this question.","a":[["I think rights and justice are central to the good life, because they decide whether a person gets a fair chance to live one.","P"],["The extract says Aboriginal and Torres Strait Islander men can expect to live almost nine years less than other Australians, and that First Nations adults are imprisoned at more than thirteen times the general rate.","E"],["Health and liberty come before almost everything else we want, so these gaps limit whole lives.","R"],["The extract adds that the figures are called unacceptable each year and then the news moves on.","E"],["Someone might argue that most Australians did not cause the gap and can still live good lives.","D"],["I agree they can live comfortably.","D"],["However, the gap lasts partly because the people with the most power to demand change are the least touched by it.","D"],["So a good life includes working for justice, not only benefiting from it.","D"]],"bQ":"Compare how two thinkers studied in Unit 3 might respond to the claim that individuals can live a good life while systemic injustice persists in their society. Justify your response.","pair":["Allen","Nietzsche"],"pairLabel":"Allen and Nietzsche","b":[["Allen would reject the claim.","1"],["For her, “equitable self-interest treats the good of others as part of one’s own interests”, and “if we always act according to our own unrestrained interests, we will corrode the trust that supports political bonds”.","1"],["Citizens need “a habit of attention” to “the balances and imbalances in what citizens are giving up for each other”, and a society where some carry far heavier burdens fails that test.","1"],["Nietzsche would accept the claim.","2"],["In noble morality “one has duties only towards one’s equals”, and Nietzsche says his own pity is “not pity for social ‘distress’”.","2"],["He treats the demand for equality as the herd’s morality, which brands what is “dangerous to equality” as immoral.","2"],["So they disagree about whether my good is tied to my fellow citizens.","X"],["For Allen it is, while for Nietzsche a person can flourish apart from them.","X"]],"cQ":"Which of the two responses you discussed in part (b) do you find more compelling? Justify your answer.","c":[["I find Allen’s response more compelling.","P"],["Nietzsche has one useful point, that comfort is not a good life.","R"],["Most Australians “continue to live comfortably”, and he calls such wellbeing “no goal”.","R"],["However, the noble morality he describes owes nothing to those outside one’s own rank, which would leave the gap where it is.","R"],["Allen explains why that is a mistake even from a selfish point of view.","R"],["A society where one group’s men live almost nine years less and its adults are imprisoned at over thirteen times the rate cannot expect that group’s trust, and everyone depends on it.","R"],["Someone might object that political friendship is unrealistic in a country of millions of strangers.","D"],["However, Allen is writing about strangers.","D"],["She asks for attention to who carries the burdens and for shared decisions, and both are practical.","D"],["So Allen shows why a good life cannot ignore injustice.","D"]]},{"id":"s7","n":7,"bq":"What does a good life have to do with being morally good?","bqId":"aos2-bq3","aos":"aos2","title":"Giving What We Can","intro":"Read the following extract.","stim":["Members of the “Giving What We Can” movement pledge to donate at least ten per cent of their income to the most effective charities they can find. Some give far more. Research by the charity evaluator GiveWell estimates that a life can be saved for roughly $5,000 through interventions like distributing malaria nets or providing vitamin A supplements to children. By these calculations, donating ten per cent of a median salary over a working life could save twenty to thirty lives. One member described the logic simply: “Once you know the maths, not giving feels like letting someone drown because you didn’t want to ruin your shoes.”"],"img":null,"aQ":"What does a good life have to do with being morally good? Using the Giving What We Can movement as your central example, provide your own justified response to this question.","a":[["I think a good life has a lot to do with being morally good, but it does not have to take over the whole of it.","P"],["The Giving What We Can movement shows how the two can fit together.","E"],["Members pledge at least ten per cent of their income, and the extract estimates that this could save twenty to thirty lives over a working life, at roughly $5,000 each.","E"],["I find it hard to call a life good if a person knows this and gives nothing.","R"],["Yet ten per cent leaves ninety per cent for family, interests and plans of their own.","R"],["Someone might argue that the member’s comparison to letting someone drown shows the movement runs on guilt.","D"],["However, the pledge names a figure, ten per cent, which is the opposite of endless guilt.","D"],["So moral goodness is necessary for a good life, alongside other things.","D"]],"bQ":"Compare how two thinkers studied in Unit 3 might respond to the claim that once you know you can prevent serious suffering at relatively little cost, you are morally required to do so. Justify your response.","pair":["Singer","Wolf"],"pairLabel":"Singer and Wolf","b":[["Singer would accept the claim, which is close to his own principle.","1"],["He argues that “if it is in our power to prevent something very bad from happening, without thereby sacrificing anything morally significant, we ought, morally, to do it”.","1"],["The member’s ruined shoes echo his drowning child, where muddy clothes are “insignificant”.","1"],["He denies that such giving is “supererogatory”, meaning good but not required.","1"],["Wolf would not deny that we should help at little cost.","2"],["Her concern is where the reasoning stops.","2"],["If every dollar could prevent suffering, the requirement never ends, and a person becomes a moral saint whose life is “strangely barren”.","2"],["She says “any plausible moral theory must make use of some conception of supererogation”.","2"],["So both could support the pledge, but Singer treats it as a starting point, since we “ought to give as much as possible”, while Wolf thinks some giving must stay optional.","X"]],"cQ":"Which of the two responses you discussed in part (b) do you find more compelling? Justify your answer.","c":[["I find Singer’s response more compelling for this claim.","P"],["Wolf is right that morality should not swallow a whole life.","R"],["However, the claim in question is limited to preventing serious suffering “at relatively little cost”.","R"],["Wolf’s worry is about a requirement with no end, and this claim has one built in.","R"],["Singer’s reasoning also seems hard to escape.","R"],["If I would ruin my shoes to save a drowning child, I cannot explain why $5,000 for a life is different, except that the child is far away and others could also help.","R"],["Someone might object that once I accept this, there is always another $5,000 I could give.","D"],["Singer would accept that, since we “ought to give as much as possible”.","D"],["That is demanding, but it does not weaken this claim, because ten per cent sacrifices nothing morally significant for most Australians.","D"],["So Singer is right that this much is required.","D"]]},{"id":"s8","n":8,"bq":"What is the relationship between the good for the individual and the good for others?","bqId":"aos2-bq4","aos":"aos2","title":"Michael Jordan","intro":"Read the following extract.","stim":["In 1990, basketball star Michael Jordan refused to endorse Harvey Gantt, a Black Democrat running against a segregationist senator in Jordan’s home state of North Carolina. He reportedly told teammates: “Republicans buy sneakers too.” Reflecting on the decision years later, Jordan said: “I wasn’t a politician when I was playing my sport. I was focused on my craft. Was that selfish? Probably. But that was my energy.” Former President Barack Obama responded: “You would’ve wanted to see Michael push harder on that.” Jordan maintained his position: “The way I go about my life is I set examples. If it inspires you? Great, I will continue to do that. If it doesn’t? Then maybe I’m not the person you should be following.”"],"img":null,"aQ":"What is the relationship between the good for the individual and the good for others? Using Jordan as your central example, provide your own justified response to this question.","a":[["I think the good for the individual and the good for others usually support each other, but when they conflict, a person with great influence should give more weight to others.","P"],["Jordan’s focus on his craft made him a basketball star, and he says his example may inspire people, so his good can benefit others.","E"],["However, his reported comment “Republicans buy sneakers too” suggests his silence protected his income, not his basketball.","E"],["Endorsing Gantt against a segregationist senator in his home state would not have made him a worse player.","E"],["He admits it was “probably” selfish.","E"],["Someone might argue that nobody is obliged to be an activist, and I agree he could not be forced.","D"],["However, the more a person’s voice can change, the harder it is to justify staying silent for money.","D"],["So pursuing our own good is fine until it means withholding help to protect our income.","D"]],"bQ":"Compare how two thinkers studied in Unit 3 might respond to Jordan’s claim that he has no obligation to use his influence for political or moral causes. Justify your response.","pair":["Nietzsche","Allen"],"pairLabel":"Nietzsche and Allen","b":[["Nietzsche would support Jordan’s claim.","1"],["In noble morality “one has duties only towards one’s equals”, and the noble person has “a fundamental hostility and irony for ‘selflessness’”.","1"],["Jordan’s idea of setting an example fits the noble type, who helps “from an urge begotten by superfluity of power”, not from pity.","1"],["Allen would reject the claim.","2"],["She says citizenship depends on sacrifice, and, citing Elizabeth Eckford, that “someone like Elizabeth has to go first”.","2"],["She would see Jordan as a giver who keeps “the power to avoid making themselves vulnerable before strangers”, and his silence as “rivalrous self-interest”, a “commitment to one’s own interests without regard to how they affect others”.","2"],["However, neither would respect the reason about sneakers.","X"],["Noble morality despises “those who think only of narrow utility”.","X"],["So they disagree about what Jordan owes other citizens, but both would think less of silence kept for the sake of sales.","X"]],"cQ":"Which of the two responses you discussed in part (b) do you find more compelling? Justify your answer.","c":[["I find Allen’s response more compelling.","P"],["Nietzsche is right that excellence has value of its own, and Jordan’s example may have inspired people.","R"],["However, noble morality would have Jordan owe nothing outside his own rank, and that seems too easy when the people affected were in his own home state.","R"],["Allen explains what was missing.","R"],["Jordan had the power to speak at little risk to his playing career, and she argues that someone has to “go first” with “symbolically significant acts that regenerate trust”.","R"],["Someone might object that this would force every famous person to comment on every issue.","D"],["I do not think Allen asks for that, because she says there should be limits to what a person gives up.","D"],["She is asking for a significant act where trust has broken down, and this election was such a moment.","D"],["So Allen gives the better account of what Jordan owed.","D"]]}],"thinkers":[{"id":"plato","name":"Plato","text":"Gorgias","aos":"AOS1","cite":"Plato, Gorgias, trans. Robin Waterfield, Oxford World’s Classics, sections 481b to 484c and 491d to 495a","line":"Two voices. Callicles argues that nature favours the strong and that happiness is the unrestrained satisfaction of desire. Socrates replies that self-discipline brings contentment and that not every pleasure is good.","terms":["nature versus convention","self-discipline","the leaky jars","the pleasant and the good","the strong and the many","self-indulgence"],"entries":[{"bq":"aos1-bq1","text":"Callicles says “the only authentic way of life is to do nothing to hinder or restrain the expansion of one’s desires”, and that the many praise self-discipline only because “their own timidity makes them incapable of winning satisfaction for their pleasures”. Socrates defines self-discipline as “mastering the pleasures and desires which arise within oneself”. His leaky jars show the undisciplined life as insatiable, and he prefers “an orderly life, in which one is perfectly content with whatever is to hand”. He ends by asking whether “the pleasant and the good are the same, or whether there’s even one pleasure which isn’t good”.","links":[{"id":"q1","label":"AOS1 Q1","role":"part (b)"},{"id":"q2","label":"AOS1 Q2","role":"stimulus"},{"id":"q3","label":"AOS1 Q3","role":"stimulus"}]},{"bq":"aos1-bq2","text":"For Callicles, “if a person has the means to live a life of sensual, self-indulgent freedom, there’s no better or happier state of existence”. A person who needs nothing is no happier than “a stone or a corpse”, and an enjoyable life “consists in keeping as much pouring in as possible”. Socrates argues that “self-discipline makes for greater happiness than self-indulgence”, and tests Callicles with a life spent “scratching, itching and scratching”, which is pleasant but hardly happy.","links":[{"id":"q7","label":"AOS1 Q2","role":"part (b)"}]},{"bq":"aos1-bq4","text":"Callicles treats freedom as the strong man throwing off convention. Human happiness “is incompatible with enslavement to anyone”, the rules are made by “the weaklings who constitute the majority”, and a man in whom nature is strong enough “will shake off all these limitations” and “win his freedom”. Socrates turns the image around: the self-indulgent man with cracked jars is the one who is not free, since he is “forced to work day and night at keeping them full, or else suffer terribly”.","links":[]},{"bq":"aos2-bq2","text":"Callicles argues that justice by convention is the weak protecting themselves: they define injustice “as the attempt to have more than others” because “they’re second-rate”. By nature “it is right for better to have a greater share than worse”, and “the superior person shall dominate the inferior person and have more than him”. Socrates holds the opposite, and challenges Callicles to prove that wrongdoing, “particularly unpunished wrongdoing”, is not “absolutely the worst thing that can happen”.","links":[]},{"bq":"aos2-bq3","text":"Callicles dismisses conventional morality as “unnatural, man-made conventions” and “pointless trumpery”, a device for enslaving “those who are naturally better”. Socrates insists that the good and the pleasant differ, and that it is “reckless” to call people happy “no matter what the source of the pleasure”. For him being good matters more than being approved of: it is “preferable for almost everyone in the world to find my beliefs misguided and wrong” than for him “to contradict and clash with myself”.","links":[]},{"bq":"aos2-bq4","text":"In Callicles’ picture the strong individual and the community are at war. The many “look after themselves and their own interest” when they make the rules, and a strong man will “trample all our regulations, charms, spells, and unnatural laws into the dust”. Socrates sets his own standard apart from the crowd too, but for the opposite reason: he would rather be “a musician with an out-of-tune lyre” than contradict himself, and says it is “preferable for almost everyone in the world to find my beliefs misguided and wrong” than for him “to contradict and clash with myself”.","links":[]}]},{"id":"aristotle","name":"Aristotle","text":"The Nicomachean Ethics","aos":"AOS1","cite":"Aristotle, The Nicomachean Ethics, trans. David Ross, Oxford World’s Classics, Book I chapters 1 to 5 and 7, Book II chapter 2, Book IX chapter 9","line":"The human good is activity of the soul in accordance with virtue over a complete life. Virtue is a mean between excess and deficiency, built by habit, and even the happy person needs friends.","terms":["the chief good","the function of man","happiness as activity","the mean","habituation","external goods","friends as another self","a political creature"],"entries":[{"bq":"aos1-bq2","text":"Happiness is the chief good, chosen “always for itself and never for the sake of something else”. Most people identify it with “pleasure, wealth, or honour”, but honour is “too superficial” because it depends “on those who bestow honour rather than on him who receives it”. From the function of man, “human good turns out to be activity of soul exhibiting virtue”, and “in a complete life”, since “one swallow does not make a summer”. Virtue alone is “somewhat incomplete”: a virtuous person could be “asleep” or suffer “the greatest sufferings and misfortunes”, and “no one would call” that person happy.","links":[{"id":"q6","label":"AOS1 Q1","role":"stimulus"},{"id":"q7","label":"AOS1 Q2","role":"part (b)"},{"id":"s1","label":"Stimulus Q1","role":"part (b)"}]},{"bq":"aos1-bq1","text":"The virtues are like strength and health, “destroyed by defect and excess” and “preserved by the mean”. The man who “indulges in every pleasure and abstains from none becomes self-indulgent, while the man who shuns every pleasure, as boors do, becomes in a way insensible”. Self-discipline is a habit: “by abstaining from pleasures we become temperate”, and once temperate we find abstaining easiest. Those who make pleasure the good choose “a life suitable to beasts”.","links":[{"id":"q1","label":"AOS1 Q1","role":"part (b)"},{"id":"q2","label":"AOS1 Q2","role":"part (b)"},{"id":"q4","label":"AOS1 Q4","role":"stimulus"}]},{"bq":"aos1-bq3","text":"Friends are “the greatest of external goods”. Because “it is nobler to do well by friends than by strangers”, the good man “will need people to do well by”. It would be “strange” to make the happy man “a solitary”, since “no one would choose the whole world on condition of being alone”, man being “a political creature and one whose nature is to live with others”. It is “better to spend his days with friends and good men than with strangers or any chance persons”, so “the happy man needs friends”.","links":[{"id":"q12","label":"AOS1 Q3","role":"stimulus"},{"id":"q14","label":"AOS1 Q5","role":"part (b)"}]},{"bq":"aos1-bq4","text":"Aristotle does not make the good life a matter of choosing or creating values. The good is set by our function, and anyone who wants to understand it “must have been brought up in good habits”. Still, conduct “has no fixity”, so “the agents themselves must in each case consider what is appropriate to the occasion”. The person who lives “pursuing each successive object, as passion directs” gains nothing from knowledge, which is why the young are not yet ready to hear lectures on the subject.","links":[{"id":"q15","label":"AOS1 Q1","role":"part (b)"},{"id":"q16","label":"AOS1 Q2","role":"part (b)"}]},{"bq":"aos2-bq3","text":"A good life is built on being a good person, because the human good is “activity of soul exhibiting virtue”. We choose the virtues “for themselves” but also “for the sake of happiness, judging that through them we shall be happy”. Yet virtue on its own is “somewhat incomplete”, since it is “compatible with being asleep, or with lifelong inactivity”. Doing good to others is part of it: “to confer benefits is characteristic of the good man and of virtue”.","links":[{"id":"q27","label":"AOS2 Q1","role":"part (b)"},{"id":"q28","label":"AOS2 Q2","role":"part (b)"},{"id":"q29","label":"AOS2 Q3","role":"part (b)"},{"id":"q30","label":"AOS2 Q4","role":"stimulus"},{"id":"q31","label":"AOS2 Q5","role":"part (b)"}]},{"bq":"aos2-bq1","text":"The extract says little about duties to strangers, but it ranks them: “it is nobler to do well by friends than by strangers”, and the good man “will need people to do well by”. Self-sufficiency is not “for one who lives a solitary life, but also for parents, children, wife, and in general for his friends and fellow citizens, since man is born for citizenship”, though “some limit must be set to this”.","links":[]},{"bq":"aos2-bq4","text":"The good of the individual and the good of the community are one inquiry. The end is “the same for a single man and for a state”, but “that of the state seems at all events something greater and more complete”, and it is “finer and more godlike to attain it for a nation or for city-states”. Man is “a political creature” who lives with others by nature, and the happy man “lives with others”.","links":[{"id":"q36","label":"AOS2 Q5","role":"part (b)"}]}]},{"id":"nietzsche","name":"Nietzsche","text":"Beyond Good and Evil","aos":"AOS1","cite":"F Nietzsche, Beyond Good and Evil, trans. R. J. Hollingdale, Penguin Classics, sections 199, 201, 203, 225, 260 and 284","line":"Herd morality is born of fear and utility and tames the individual. The noble type creates values, embraces great suffering as the discipline that produces greatness, and owes duties only to equals.","terms":["herd instinct","fear is the mother of morality","master and slave morality","the noble type creates values","the discipline of suffering","pity","solitude as a virtue","duties only towards equals"],"entries":[{"bq":"aos1-bq1","text":"Every philosophy that judges by “pleasure and pain” is “a piece of naïvety”. Those who want to “abolish suffering” are mistaken: “wellbeing as you understand it” is “no goal”, and “the discipline of suffering, of great suffering” is what “has created every elevation of mankind hitherto”. The noble man “enjoys practising severity and harshness upon himself”. The herd, by contrast, honours “moderation” and “the mean and average in desires” as virtues, out of fear.","links":[{"id":"q1","label":"AOS1 Q1","role":"stimulus"},{"id":"q2","label":"AOS1 Q2","role":"part (b)"},{"id":"q3","label":"AOS1 Q3","role":"part (b)"},{"id":"q4","label":"AOS1 Q4","role":"part (b)"},{"id":"q5","label":"AOS1 Q5","role":"part (b)"},{"id":"s2","label":"Stimulus Q2","role":"part (b)"}]},{"bq":"aos1-bq2","text":"Comfortable wellbeing is “a state which soon renders man ludicrous and contemptible”. The happiness Nietzsche values belongs to the noble type: “the feeling of plenitude, of power which seeks to overflow, the happiness of high tension, the consciousness of a wealth which would like to give away and bestow”. There are “higher problems than the problems of pleasure and pain and pity”.","links":[{"id":"q6","label":"AOS1 Q1","role":"part (b)"},{"id":"q7","label":"AOS1 Q2","role":"stimulus"},{"id":"q8","label":"AOS1 Q3","role":"part (b)"},{"id":"q9","label":"AOS1 Q4","role":"part (b)"},{"id":"s1","label":"Stimulus Q1","role":"part (b)"}]},{"bq":"aos1-bq3","text":"Nietzsche is wary of company. “Solitude is with us a virtue”, since “all contact between man and man” in society “must inevitably be unclean”, and “all community makes somehow, somewhere, sometime” a person “common”. Love of one’s neighbour is “always something secondary” compared with “fear of one’s neighbour”. Yet “a refined conception of friendship” and even “a certain need to have enemies” are marks of noble morality, and “love as passion” is “of aristocratic origin”.","links":[{"id":"q10","label":"AOS1 Q1","role":"stimulus"},{"id":"q11","label":"AOS1 Q2","role":"part (b)"},{"id":"q12","label":"AOS1 Q3","role":"part (b)"},{"id":"q13","label":"AOS1 Q4","role":"stimulus"},{"id":"q14","label":"AOS1 Q5","role":"part (b)"},{"id":"s3","label":"Stimulus Q3","role":"part (b)"}]},{"bq":"aos1-bq4","text":"The noble type “feels himself to be the determiner of values, he does not need to be approved of”, and “creates values”. The herd instinct of obedience accepts “whatever any commander” shouts in its ears, whether “parent, teacher, law, class prejudice, public opinion”, and even leaders “pose as executors of more ancient or higher commands”, which he calls “the moral hypocrisy of the commanders”. One twist: “the longing for freedom” belongs to slave morality, while reverence and devotion mark the aristocratic mind.","links":[{"id":"q15","label":"AOS1 Q1","role":"part (b)"},{"id":"q16","label":"AOS1 Q2","role":"stimulus"},{"id":"q17","label":"AOS1 Q3","role":"part (b)"},{"id":"q18","label":"AOS1 Q4","role":"part (b)"}]},{"bq":"aos2-bq1","text":"In noble morality “one has duties only towards one’s equals”; towards “beings of a lower rank, towards everything alien, one may act as one wishes”. Gratitude and revenge are duties “only among one’s equals”. The noble person “aids the unfortunate but not, or almost not, from pity, but more from an urge begotten by superfluity of power”, and has “a fundamental hostility and irony for ‘selflessness’”. Pity against pity: he defends himself against the pity that wants to abolish suffering as “the worst of all pampering and weakening”.","links":[{"id":"q20","label":"AOS2 Q1","role":"part (b)"},{"id":"q21","label":"AOS2 Q2","role":"part (b)"},{"id":"q23","label":"AOS2 Q4","role":"stimulus"},{"id":"s5","label":"Stimulus Q5","role":"part (b)"}]},{"bq":"aos2-bq2","text":"Equality is a herd value. Whatever is “dangerous to equality” is branded immoral, and the democratic movement is “a form assumed by man in decay”, threatening to reduce humanity to “the pygmy animal of equal rights and equal pretensions”. Under peaceful conditions “every kind of severity, even severity in justice, begins to trouble the conscience”, until society “takes the side even of him who harms it, the criminal”.","links":[{"id":"q24","label":"AOS2 Q1","role":"part (b)"},{"id":"q25","label":"AOS2 Q2","role":"part (b)"},{"id":"s6","label":"Stimulus Q6","role":"part (b)"}]},{"bq":"aos2-bq3","text":"Slave morality comes from “the abused, oppressed, suffering, unfree”. It honours “pity, the kind and helping hand, the warm heart, patience, industriousness, humility, friendliness” because “these are the most useful qualities” for enduring existence: it is “essentially the morality of utility”. Its good man “has in any event to be a harmless man”, even “a bit stupid”. The herd-man likewise glorifies the qualities that make him “tame, peaceable and useful to the herd”, and “fear is the mother of morality”.","links":[{"id":"q28","label":"AOS2 Q2","role":"part (b)"},{"id":"q29","label":"AOS2 Q3","role":"part (b)"},{"id":"q30","label":"AOS2 Q4","role":"part (b)"},{"id":"q31","label":"AOS2 Q5","role":"stimulus"}]},{"bq":"aos2-bq4","text":"When “the highest and strongest drives” carry an individual “far above and beyond the average and lowlands of the herd conscience”, the community’s “self-confidence goes to pieces”. So “lofty spiritual independence, the will to stand alone, great intelligence even, are felt to be dangerous”, and “everything that raises the individual above the herd” is “called evil”. These same drives were once honoured for their “social utility” while the community needed them against its enemies. His hope lies in “new philosophers” who will “revalue and reverse ‘eternal values’”.","links":[{"id":"q32","label":"AOS2 Q1","role":"part (b)"},{"id":"q35","label":"AOS2 Q4","role":"part (b)"},{"id":"q36","label":"AOS2 Q5","role":"stimulus"},{"id":"s8","label":"Stimulus Q8","role":"part (b)"}]}]},{"id":"cicero","name":"Cicero","text":"On the Good Life (Laelius on friendship)","aos":"AOS1","cite":"Cicero, On the Good Life, trans. Michael Grant, Penguin Classics","line":"Friendship, possible only between good people, is the greatest of nature’s gifts after wisdom. It springs from love rather than profit, makes happiness possible, and demands honesty rather than flattery.","terms":["friendship only between good men","nature as the guide","love not profit","the friend as a mirror","nature abhors solitude","advice and rebuke","flattery","no wrongdoing for a friend"],"entries":[{"bq":"aos1-bq3","text":"Laelius urges us to “place friendship above every other human concern”. It is “only possible between good men”, and he defines it as “a complete identity of feeling about all things in heaven and earth”. It is “the most satisfying experience in the world to have someone you can speak to as freely as your own self”. “Goodwill is established by love, quite independently of any calculation of profit”, and “nature abhors solitude”. True friendship is “so choice and selective” that it is normally restricted to “two persons… or at most extremely few”.","links":[{"id":"q10","label":"AOS1 Q1","role":"part (b)"},{"id":"q11","label":"AOS1 Q2","role":"stimulus"},{"id":"q13","label":"AOS1 Q4","role":"part (b)"},{"id":"s3","label":"Stimulus Q3","role":"part (b)"}]},{"bq":"aos1-bq2","text":"Friendship “embrace[s] everything worth pursuing by mankind”, that is “goodness, and fame, and peace of mind, and satisfaction: the things which make life happy when we have them, whereas without them there can be no question of happiness at all”. This happiness “is the summit of our best ambitions”. Riches, power and pleasure are “at the mercy of fickle chance”, and “if you are lonely, every pleasure loses its savour”.","links":[{"id":"q6","label":"AOS1 Q1","role":"part (b)"},{"id":"q7","label":"AOS1 Q2","role":"part (b)"},{"id":"q8","label":"AOS1 Q3","role":"stimulus"}]},{"bq":"aos1-bq1","text":"Many people “rank sensuous pleasures highest of all”, but “feelings of that kind are something which any animal can experience”. The supreme blessing is “moral goodness”. Friendship helps with self-mastery: among friends united by sympathy, people “can learn to master the passions to which other men are slaves”.","links":[]},{"bq":"aos2-bq3","text":"Friendship cannot exist without goodness: moral goodness “is the quality to which friendship owes its entire origin and character”. Friendship was given “not… in order to pander to our vices, but to help us behave decently”, because “the highest standards of behaviour are impossible to realize on one’s own”. The rule between friends is “do not ask for anything that is wrong, and if you are asked for such a thing, turn the application down”. The Blossius story shows that claiming one did wrong “for the sake of a friend is no excuse”.","links":[]},{"bq":"aos2-bq1","text":"Nature made “the ties that exist between one person and another”, and they are stronger “between fellow-citizens than between foreigners”, and “among relatives than among strangers”; friendly feeling between strangers “lacks a solid basis”. To a friend we owe honesty: “you are under an obligation not only to advise your friend frequently but to rebuke him if necessary”, and to accept the same “in good part”. “Fawning sycophancy” is “wholly incompatible with friendship”.","links":[]},{"bq":"aos2-bq4","text":"Companionship is the condition of the individual’s own goodness and happiness, since the highest standards are “impossible to realize on one’s own”. More widely, “take away the bond of kindly feeling from the world, and no house or city can stand”. Even a person lifted into heaven to see “the beauty of the stars” would feel “no joy if he had to keep it to himself”.","links":[]},{"bq":"aos1-bq4","text":"Friendship asks for a consistent self: it “unites human hearts”, which cannot happen if one person “takes on a variety of shifting and changeable forms”, like Gnatho who agrees with everything. Flattery is “servile” and “unworthy not only of a friend but of any free man”, and “life with a friend is not like life with a tyrant”.","links":[]}]},{"id":"debeauvoir","name":"de Beauvoir","text":"The Ethics of Ambiguity","aos":"AOS2","cite":"S de Beauvoir, The Ethics of Ambiguity, trans. Bernard Frechtman, Open Road, Section II, pp. 37 to 39, 41 to 46, 50 to 53, 62 to 63, 73 to 77","line":"Human freedom is the ultimate end. The serious man denies his freedom by treating values as given, the sub-man flees existence, and the adventurer acts for its own sake but forgets others. My freedom depends on the freedom of others.","terms":["the spirit of seriousness","the child’s world","the sub-man","the serious man","the adventurer","freedom as the unique end","disclosing being","the freedom of others"],"entries":[{"bq":"aos1-bq4","text":"“Human freedom is the ultimate, the unique end to which man should destine himself.” The child lives in a “serious world” where values are “ready-made things”. The serious man keeps living there as an adult: he “must mask the movement by which he gives them to himself”, and by refusing to see that he is “freely establishing the value of the end he sets up” he “makes himself the slave of that end”. The sub-man flees existence altogether. Those “denied all instruments of escape”, such as women who “inherit a long tradition of submission”, can be serious honestly, but “the man who has the necessary instruments to escape this lie and who does not want to use them consumes his freedom in denying them”.","links":[{"id":"q15","label":"AOS1 Q1","role":"stimulus"},{"id":"q16","label":"AOS1 Q2","role":"part (b)"},{"id":"q17","label":"AOS1 Q3","role":"stimulus"},{"id":"q18","label":"AOS1 Q4","role":"stimulus"},{"id":"q19","label":"AOS1 Q5","role":"part (b)"},{"id":"s4","label":"Stimulus Q4","role":"part (b)"}]},{"bq":"aos1-bq2","text":"By casting himself into the world a person “contributes to reinvesting it with human signification”, and “even the most outcast sometimes feel the joy of existing”. Vitality, sensitivity and intelligence “are not ready-made qualities, but a way of casting oneself into the world”; “there is vitality only by means of free generosity”. These qualities “discover reasons for existing” and “confirm us in the pride and joy of our destiny as man”. The sub-man, “without love and without desire”, finds only “an insignificant and dull world”.","links":[]},{"bq":"aos2-bq4","text":"The young man first sees others as rivals who are “stealing the whole world away from me”, but this hatred is “naive”: “If I were really everything there would be nothing beside me; the world would be empty.” Others “give” the world to me, “one can reveal the world only on a basis revealed by other men”, and “no project can be defined except by its interference with other projects”. “Every man needs the freedom of other men”, even a tyrant, and “only the freedom of others keeps each one of us from hardening in the absurdity of facticity”.","links":[{"id":"q34","label":"AOS2 Q3","role":"part (b)"},{"id":"q35","label":"AOS2 Q4","role":"stimulus"}]},{"bq":"aos2-bq1","text":"Freedom “can will itself only by destining itself to an open future, by seeking to extend itself by means of the freedom of others. Therefore, in any case, the freedom of other men must be respected and they must be helped to free themselves.” This law “imposes limits upon action and at the same time immediately gives it a content”. The adventurer “always meets others along the way”, and “every undertaking unfolds in a human world and affects men”.","links":[]},{"bq":"aos2-bq3","text":"“Ethics is the triumph of freedom over facticity.” The adventurer, who “likes action for its own sake”, is “very close to a genuinely moral attitude”, but a “genuine seriousness” belongs to the one “whose end is the liberation of himself and others”. The serious man is the danger: “it is natural that he makes himself a tyrant”, sacrificing people to idols such as the army, the highway or the revolution, like the colonial administrator who builds his highway “at the price of a great number of lives of the natives”.","links":[]},{"bq":"aos2-bq2","text":"De Beauvoir distrusts those who hide behind rights and institutions. The serious man “dissimulates his subjectivity under the shield of rights which emanate from the ethical universe recognized by him; he is no longer a man, but a father, a boss, a member of the Christian Church or the Communist Party”. Seriousness “leads to a fanaticism” that “imposes the State, not for individuals, but against them”.","links":[]}]},{"id":"singer","name":"Singer","text":"Famine, Affluence, and Morality","aos":"AOS2","cite":"P Singer, “Famine, Affluence, and Morality”, Philosophy and Public Affairs, 1972, pp. 229 to 235","line":"If we can prevent something very bad without sacrificing anything morally significant, we ought to do it. Distance and numbers make no moral difference, so giving to famine relief is a duty, not charity.","terms":["the principle","the drowning child","distance makes no difference","numbers do not lessen obligation","duty versus charity","supererogation","give as much as possible","marginal utility"],"entries":[{"bq":"aos2-bq1","text":"Singer starts from the assumption that “suffering and death from lack of food, shelter, and medical care are bad”, then argues: “if it is in our power to prevent something bad from happening, without thereby sacrificing anything of comparable moral importance, we ought, morally, to do it”. If I see a child drowning in a shallow pond “I ought to wade in and pull the child out”. “It makes no moral difference whether the person I can help is a neighbour’s child ten yards from me or a Bengali whose name I shall never know, ten thousand miles away”, and the idea “that numbers lessen obligation” is absurd.","links":[{"id":"q20","label":"AOS2 Q1","role":"stimulus"},{"id":"q22","label":"AOS2 Q3","role":"part (b)"},{"id":"q23","label":"AOS2 Q4","role":"part (b)"}]},{"bq":"aos2-bq3","text":"Our “moral conceptual scheme” and “the way of life that has come to be taken for granted in our society” need to change. Because few others give, “I and everyone else in similar circumstances ought to give as much as possible”, at least until giving more “would begin to cause serious suffering for oneself and one’s dependents”, perhaps “to the point of marginal utility”. The principle “requires us only to prevent what is bad, and not to promote what is good”.","links":[{"id":"q27","label":"AOS2 Q1","role":"part (b)"},{"id":"q28","label":"AOS2 Q2","role":"part (b)"},{"id":"q29","label":"AOS2 Q3","role":"stimulus"},{"id":"q31","label":"AOS2 Q5","role":"part (b)"},{"id":"s7","label":"Stimulus Q7","role":"part (b)"}]},{"bq":"aos2-bq4","text":"The comfort of the affluent is weighed against the survival of strangers. Buying new clothes “to look ‘well-dressed’” provides for no “important need”, and keeping old clothes would not mean “sacrificing anything significant”. The fact that others could help does not change my duty, though what others actually give is “a relevant circumstance”: if everyone gave, “some of the sacrifice will have been unnecessary”.","links":[{"id":"q33","label":"AOS2 Q2","role":"part (b)"}]},{"bq":"aos2-bq2","text":"Singer’s argument rests on impartiality: “if we accept any principle of impartiality, universalizability, equality, or whatever, we cannot discriminate against someone merely because he is far away from us”. The world has become a “global village” in which aid reaches a refugee in Bengal “almost as effectively” as a neighbour. He also indicts governments: Britain’s Concorde spending implies it “values a supersonic transport more than thirty times as highly as it values the lives of the nine million refugees”.","links":[]},{"bq":"aos1-bq3","text":"Singer does not discuss friendship directly, but his impartiality cuts against favouring those close to us. Being “physically near to us” may make it more likely that we help someone, “but this does not show that we ought to help him rather than another who happens to be further away”. Any moral weight given to proximity must come from being better placed to help, not from the relationship itself.","links":[{"id":"q12","label":"AOS1 Q3","role":"part (b)"}]},{"bq":"aos1-bq1","text":"The pleasures of affluence come under moral scrutiny. Spending on “new clothes or a new car instead of giving it to famine relief” is something people “do not feel in any way ashamed or guilty about”, yet this way of looking at things “cannot be justified”. Giving the money away “is not charitable, or generous”; “we ought to give the money away, and it is wrong not to do so”.","links":[{"id":"q5","label":"AOS1 Q5","role":"part (b)"},{"id":"s2","label":"Stimulus Q2","role":"part (b)"}]}]},{"id":"weil","name":"Weil","text":"The Need for Roots","aos":"AOS2","cite":"S Weil, The Need for Roots, trans. A Wills, Routledge Classics, pp. 1 to 6","line":"Obligations come before rights. Every human being is owed respect simply for being human, and that respect is real only when it meets their vital needs, beginning with hunger.","terms":["obligations before rights","recognition makes a right effective","the eternal obligation","unconditional","respect","earthly needs","hunger as the model","positive rights"],"entries":[{"bq":"aos2-bq1","text":"“There exists an obligation towards every human being for the sole reason that he or she is a human being, without any other condition.” It is “eternal” and “unconditional”, and “all human beings are bound by identical obligations”; nobody “can escape them without being guilty of crime”. The one obligation is “respect”, which is “only performed if the respect is effectively expressed in a real, not a fictitious, way”, through “Man’s earthly needs”. Hunger is the model: “it is an eternal obligation towards the human being not to let him suffer from hunger when one has the chance of coming to his assistance”.","links":[{"id":"q20","label":"AOS2 Q1","role":"part (b)"},{"id":"q21","label":"AOS2 Q2","role":"stimulus"},{"id":"q22","label":"AOS2 Q3","role":"part (b)"},{"id":"q23","label":"AOS2 Q4","role":"part (b)"},{"id":"s5","label":"Stimulus Q5","role":"part (b)"}]},{"bq":"aos2-bq2","text":"“The notion of obligations comes before that of rights, which is subordinate and relative to the former.” A right is effective only through “other men who consider themselves as being under a certain obligation” to its holder: “a right which goes unrecognized by anybody is not worth very much”, while an unrecognised obligation “loses none of the full force of its existence”. “A man left alone in the universe would have no rights whatever, but he would have obligations.” The men of 1789 began with rights and “tumble[d] into a confusion”; positive rights express the obligation only “in a confused and imperfect form”.","links":[{"id":"q24","label":"AOS2 Q1","role":"stimulus"},{"id":"q26","label":"AOS2 Q3","role":"part (b)"}]},{"bq":"aos2-bq4","text":"Rights and obligations are the same relationship seen from two sides: “such words only express differences in point of view”. A man “considered in isolation, only has duties, amongst which are certain duties towards himself”; other men, from his point of view, “only have rights”. Obligations bind individuals, not groups: “there are no obligations for collectivities, as such”, but they exist for everyone who serves, commands or represents one.","links":[]},{"bq":"aos2-bq3","text":"The obligation to others is not grounded in anything in this world: “not based upon any de facto situation, nor upon jurisprudence, customs, social structure, relative state of forces, historical heritage”, nor on convention. It belongs to “a realm situated above all conditions”, and has “only a verification in the common consent accorded by the universal conscience”. “It is in relation to it that we measure our progress.”","links":[]}]},{"id":"mill","name":"Mill","text":"On Liberty","aos":"AOS2","cite":"JS Mill, On Liberty (1859), Penguin Classics, pp. 79 to 82","line":"Society may coerce an individual only to prevent harm to others. Over himself the individual is sovereign, and the only freedom worth the name is pursuing our own good in our own way.","terms":["the harm principle","self-protection","the individual is sovereign","moral coercion of public opinion","the three liberties","positive duties","inaction as the exception","maturity of faculties"],"entries":[{"bq":"aos1-bq4","text":"Human liberty has three regions: “the inward domain of consciousness”, including “absolute freedom of opinion”; “liberty of tastes and pursuits; of framing the plan of our life to suit our own character; of doing as we like” so long as we do not harm others, “even though they should think our conduct foolish, perverse, or wrong”; and “liberty… of combination among individuals”. “The only freedom which deserves the name, is that of pursuing our own good in our own way.”","links":[{"id":"q17","label":"AOS1 Q3","role":"part (b)"},{"id":"q19","label":"AOS1 Q5","role":"stimulus"},{"id":"s4","label":"Stimulus Q4","role":"part (b)"}]},{"bq":"aos2-bq2","text":"“The sole end for which mankind are warranted… in interfering with the liberty of action of any of their number, is self-protection.” Power may be used over someone against his will only “to prevent harm to others”; “his own good, either physical or moral, is not a sufficient warrant”. This covers “the moral coercion of public opinion” as well as law. “In the part which merely concerns himself, his independence is, of right, absolute. Over himself, over his own body and mind, the individual is sovereign.” The principle applies only to those “in the maturity of their faculties”, and Mill allows despotism over “barbarians, provided the end be their improvement”.","links":[{"id":"q24","label":"AOS2 Q1","role":"part (b)"},{"id":"q26","label":"AOS2 Q3","role":"stimulus"}]},{"bq":"aos2-bq1","text":"Our obligations are not only negative. There are “many positive acts for the benefit of others, which he may rightfully be compelled to perform”, such as giving evidence, bearing a fair share of common defence, and “saving a fellow-creature’s life”. “A person may cause evil to others not only by his actions but by his inaction.” Still, “to make him answerable for not preventing evil, is, comparatively speaking, the exception”, and where society should not enforce a duty, “the conscience of the agent himself should step into the vacant judgment seat”.","links":[{"id":"q21","label":"AOS2 Q2","role":"part (b)"},{"id":"q22","label":"AOS2 Q3","role":"stimulus"}]},{"bq":"aos2-bq4","text":"“The only part of the conduct of any one, for which he is amenable to society, is that which concerns others.” Mill admits that “whatever affects himself, may affect others through himself”, but holds that “mankind are greater gainers by suffering each other to live as seems good to themselves, than by compelling each to live as seems good to the rest”. “Each is the proper guardian of his own health, whether bodily, or mental and spiritual.”","links":[{"id":"q34","label":"AOS2 Q3","role":"stimulus"}]},{"bq":"aos1-bq2","text":"Nobody may be compelled to act “because it will make him happier”, or because others think it “wise, or even right”. These are reasons “for remonstrating with him, or reasoning with him, or persuading him, or entreating him, but not for compelling him”. Mill grounds this in “utility in the largest sense, grounded on the permanent interests of man as a progressive being”.","links":[]},{"bq":"aos2-bq3","text":"A person’s “own good, either physical or moral” never justifies compulsion. Society may argue, persuade and entreat, but may not force someone to be good for his own sake, and the conduct it may deter “must be calculated to produce evil to some one else”. Being made better is not a ground for coercion.","links":[]}]},{"id":"wolf","name":"Wolf","text":"Moral Saints","aos":"AOS2","cite":"S Wolf, “Moral Saints”, The Journal of Philosophy, 1982, pp. 419 to 427 and 435 to 439","line":"A moral saint, whose every action is as morally good as possible, is not an attractive ideal. Moral perfection crowds out the nonmoral interests and talents that make a life well-rounded, so a person may be perfectly wonderful without being perfectly moral.","terms":["the moral saint","the Loving Saint","the Rational Saint","nonmoral virtues","strangely barren","too good for his own well-being","supererogation","the point of view of individual perfection"],"entries":[{"bq":"aos2-bq3","text":"A moral saint is “a person whose every action is as morally good as possible”, and Wolf is “glad that neither I nor those about whom I care most are among them”. Moral virtues held “to an extreme degree” are “apt to crowd out the nonmoral virtues” and interests, so the saint who spends all his time “raising money for Oxfam” is “not reading Victorian novels, playing the oboe, or improving his backhand”, and his life “may seem… strangely barren”. “A person may be perfectly wonderful without being perfectly moral.” Yet moral value may still be “an important, even the most important, kind of value”, and “any plausible moral theory must make use of some conception of supererogation”.","links":[{"id":"q27","label":"AOS2 Q1","role":"stimulus"},{"id":"q28","label":"AOS2 Q2","role":"stimulus"},{"id":"q29","label":"AOS2 Q3","role":"part (b)"},{"id":"q30","label":"AOS2 Q4","role":"part (b)"},{"id":"s7","label":"Stimulus Q7","role":"part (b)"}]},{"bq":"aos1-bq2","text":"The Loving Saint’s happiness “would truly lie in the happiness of others”; the Rational Saint “pays little or no attention to his own happiness” and “feels the sacrifice as such”. Either way the saint may be “too good for his own well-being”. There seems “to be a kind of joy which the Loving Saint, either by nature or by practice, is incapable of experiencing”, and most of us find happiness in “material comforts”, chosen activities and “the love, respect, and companionship of people whom we love”.","links":[{"id":"q9","label":"AOS1 Q4","role":"stimulus"}]},{"bq":"aos1-bq1","text":"When the Loving Saint gives up “his fishing trip or his stereo or his hot fudge sundae at the drop of the moral hat”, we wonder “not at how much he loves morality, but at how little he loves these other things”. The Rational Saint keeps his desires but “denies himself the opportunity to act on them”, which suggests “a pathological fear of damnation, perhaps, or an extreme form of self-hatred that interferes with his ability to enjoy the enjoyable in life”. Being able to enjoy things is part of a good life.","links":[{"id":"q3","label":"AOS1 Q3","role":"part (b)"},{"id":"q4","label":"AOS1 Q4","role":"part (b)"},{"id":"q5","label":"AOS1 Q5","role":"stimulus"}]},{"bq":"aos2-bq1","text":"The desire to be as morally good as possible “subsumes or demotes” our other desires, so for the saint sacrifice has “the character, not of a choice, but of an imperative”. The moral point of view recognises that “one is just one person among others equally real and deserving of the good things in life”. But “there seems to be a limit to how much morality we can stand”, and “it is not part of common-sense morality that one ought to be a moral saint”.","links":[{"id":"q20","label":"AOS2 Q1","role":"part (b)"}]},{"bq":"aos2-bq4","text":"Wolf sets two points of view side by side. The moral point of view sees each of us as “just one person among others”; “the point of view of individual perfection” asks “what kinds of lives are good lives”. Each “subsumes the other”, and “our values cannot be fully comprehended on the model of a hierarchical system with morality at the top”. We have reason “to want people to live lives that are not morally perfect”.","links":[{"id":"q32","label":"AOS2 Q1","role":"part (b)"},{"id":"q33","label":"AOS2 Q2","role":"stimulus"}]},{"bq":"aos1-bq4","text":"“Our lives are not so comprehensively subject to the requirement that we apply for permission”, and “our nonmoral reasons for the goals we set ourselves are not excuses, but may rather be positive, good reasons”. The ideal of sainthood troubles her because it seems “to require either the lack or the denial of the existence of an identifiable, personal self”. Striving for “personal excellence”, like Groucho Marx or the head chef at Lutèce, is a trait “it is valuable and desirable for people to have”.","links":[]},{"bq":"aos1-bq3","text":"Love and companionship are among the ordinary “ingredients of happiness” that a saint pushes aside. Wolf prefers ideals with “independently admirable, nonmoral ground projects and dominant personal traits”, and finds relief in the “idiosyncrasies or eccentricities” of real people: “one prefers the blunt, tactless, and opinionated Betsy Trotwood to the unfailingly kind and patient Agnes Copperfield”. The saint, who “must be very, very nice”, risks being “dull-witted or humorless or bland”.","links":[]}]},{"id":"allen","name":"Allen","text":"Talking to Strangers","aos":"AOS2","cite":"DS Allen, Talking to Strangers: Anxieties of Citizenship since Brown v. Board of Education, University of Chicago Press, 2004, pp. 121 to 123 and 133 to 139","line":"Citizenship works like friendship. Equitable self-interest treats the good of others as part of one’s own, and sacrifice, attention to who is giving up what, and power sharing build the trust that justice alone cannot.","terms":["distributive justice","straightening-out justice","equality and autonomy","rivalrous versus equitable self-interest","second selves","sacrifice","habit of attention","power sharing","political friendship"],"entries":[{"bq":"aos2-bq4","text":"“Whereas rivalrous self-interest is a commitment to one’s own interests without regard to how they affect others, equitable self-interest treats the good of others as part of one’s own interests.” Because I “desire to continue living among strangers”, my regard for fellow citizens “should be equitable, not rivalrous”, “for my own long-term good”. Those who think the common good will result “if every citizen simply pursues her own self-interest without reservation… make a sad mistake”, since unrestrained self-interest will “corrode the trust that supports political bonds”.","links":[{"id":"q32","label":"AOS2 Q1","role":"stimulus"},{"id":"q33","label":"AOS2 Q2","role":"part (b)"},{"id":"q34","label":"AOS2 Q3","role":"part (b)"},{"id":"q35","label":"AOS2 Q4","role":"part (b)"},{"id":"q36","label":"AOS2 Q5","role":"part (b)"},{"id":"s8","label":"Stimulus Q8","role":"part (b)"}]},{"bq":"aos2-bq2","text":"Allen sets out Aristotle’s two kinds of justice. Distributive justice “organizes the allotment of public goods” by “proportional” equality, as dinner portions match appetites; Aristotle would have people receive “equivalent to what they have given”, with the rich giving more wealth and receiving more honour. Straightening-out justice restores “arithmetical equality”, because “every citizen deserves an autonomy equal to that of other citizens”. “Equality and freedom are the objectives of this justice”, but friendship “outpaces justice”: “no political order can meet the requirement that every collaborative decision be a perfect bargain”, and the equitable man “does not stand on his rights unduly”.","links":[{"id":"q25","label":"AOS2 Q2","role":"stimulus"},{"id":"q26","label":"AOS2 Q3","role":"part (b)"},{"id":"s6","label":"Stimulus Q6","role":"part (b)"}]},{"bq":"aos1-bq3","text":"Friends are “second selves”, and friendship is “the extension of one’s interests to include someone else’s in ways that annihilate loss”: “in being a friend to their friend, friends care for their own good”. “Friendship entails self-exposure”, and friends are “people to whom we are willing to be in debt”. Political friendship is the same virtue “without the emotional charge”, since we live together “because we desire to share our lives with strangers”. “Friendship is the bond of the city.”","links":[{"id":"q10","label":"AOS1 Q1","role":"part (b)"},{"id":"q11","label":"AOS1 Q2","role":"part (b)"},{"id":"q13","label":"AOS1 Q4","role":"part (b)"},{"id":"q14","label":"AOS1 Q5","role":"stimulus"}]},{"bq":"aos2-bq1","text":"“Sacrifice is friendship’s fundamental act”, though “there should be limits to what one is willing to give up”. Citizens need “a habit of attention by which citizens are attuned to the balances and imbalances in what citizens are giving up for each other”, and it is “a duty not only to repay service done to one, but also to take the initiative in doing a service oneself”: “someone like Elizabeth has to go first”. Givers who never make “themselves vulnerable before strangers” may be “distrusted”.","links":[{"id":"q22","label":"AOS2 Q3","role":"part (b)"},{"id":"q23","label":"AOS2 Q4","role":"part (b)"}]},{"bq":"aos1-bq4","text":"Autonomy “no more consists of getting one’s own way all the time in the political realm than in the sphere of friendship. It consists instead of getting one’s way in concert with others, and as modified by them.” Sacrifice is “the only action that reconciles agency and autonomy with not getting what one wants”, and political friends commit “to pursuing liberty and equality simultaneously”.","links":[{"id":"q16","label":"AOS1 Q2","role":"part (b)"},{"id":"q18","label":"AOS1 Q4","role":"part (b)"},{"id":"q19","label":"AOS1 Q5","role":"part (b)"}]},{"bq":"aos2-bq3","text":"Good citizenship is not “acting justly only, but also equitably”. It requires “an orientation toward others, a recognition how and why we have an interest in their good”, and the psychological state that “in politics is called consent, but in other contexts, goodwill”. Citizens who behave well toward strangers “avoid acting with either excessive deference or excessive aggression toward them”. Against Hobbes, who “reduced citizenship to fear”, Allen argues that institutions “cannot on their own solve the problem of rivalrous self-interest”.","links":[{"id":"q29","label":"AOS2 Q3","role":"part (b)"},{"id":"q31","label":"AOS2 Q5","role":"part (b)"}]},{"bq":"aos1-bq2","text":"Living well is a shared project. Living together “does not mean feeding in the same place, as with cattle, but conversing and communicating thoughts and plans” for “some benefit in common”. Since “the preservation of the polity is in a citizen’s interest”, it is “to her benefit to cultivate second-self relations even with strangers”, and equitable self-interest is what “serve[s] her well”.","links":[{"id":"q8","label":"AOS1 Q3","role":"part (b)"},{"id":"q9","label":"AOS1 Q4","role":"part (b)"}]}]}]}</script>
<script>
(function(){
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const BQSHORT = {aos1:['Pleasure and self-discipline','Happiness','Love and friendship','Freedom and authenticity'],
                   aos2:['Obligations to others','Rights and justice','Being morally good','The individual and others']};
  const STEP = {
    a:{I:['Idea',1],L:['Link',2],N:['Nuance',3]},
    b:{I:['Idea',1],R:['Respond',2],N:['Nuance',3]},
    c:{P:['Position',1],R:['Reasoning',2],E:['Example',4],D:['Depth',3]},
    sb:{'1':['Thinker one',1],'2':['Thinker two',2],X:['Compare',3]},
    sc:{P:['Position',1],R:['Reasoning',2],D:['Depth',3]}
  };
  const LEG = {a:['I','L','N'],b:['I','R','N'],c:['P','R','E','D'],sb:['1','2','X'],sc:['P','R','D']};
  const BQNAME = {};
  Object.keys(BQSHORT).forEach(a=>BQSHORT[a].forEach((n,i)=>{BQNAME[`${a}-bq${i+1}`]=n;}));
  const THINKERS = ['Plato','Aristotle','Nietzsche','Cicero','de Beauvoir','Mill','Singer','Weil','Wolf','Allen'];

  function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function wc(sents){return sents.map(s=>s[0]).join(' ').split(/\s+/).filter(Boolean).length;}
  function store(k,v){try{localStorage.setItem('u3sg-'+k,JSON.stringify(v));}catch(e){}}
  function load(k,d){try{const v=localStorage.getItem('u3sg-'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}}

  function renderSents(sents,part){
    let html='',cur=null,buf=[];
    const flush=()=>{if(!cur)return;const [name,n]=STEP[part][cur];html+=`<span class="seg seg-${n}"><span class="seglab">${name}</span>${buf.map(esc).join(' ')}</span> `;buf=[];};
    sents.forEach(([s,t])=>{if(t!==cur){flush();cur=t;}buf.push(s);});
    flush();
    return html.trim();
  }
  function legend(part){
    return `<div class="legend">${LEG[part].map(k=>{const [name,n]=STEP[part][k];return `<span class="l${n}"><i></i>${name}</span>`;}).join('')}</div>`;
  }
  function respBox(sents,part,id){
    return `<div class="resp" id="${id}"><div class="resp-top">${legend(part)}<span class="wc">${wc(sents)} words</span></div><p class="txt">${renderSents(sents,part)}</p><button type="button" class="reveal" data-reveal="${id}">Show model response</button></div>`;
  }
  function questionCard(q,bqn){
    const alts=q.b;
    const altTabs=alts.length>1?`<div class="alts" role="group" aria-label="Comparison thinker">${alts.map((a,i)=>`<button type="button" class="alt" data-q="${q.id}" data-alt="${i}" aria-pressed="${i===0}">${esc(a.label)}</button>`).join('')}<span class="hint">Part (b) asks for one other thinker. Each tab is a complete alternative answer.</span></div>`:'';
    return `<article class="q" id="${q.id}" data-thinkers="${esc([q.thinker].concat(alts.map(a=>a.thinker)).join('|'))}" data-stim="${esc(q.thinker)}">
      <button type="button" class="q-head" aria-expanded="false" aria-controls="${q.id}-body" data-toggle="${q.id}">
        <span class="q-num">Q${q.n}</span>
        <span class="q-title"><b>${esc(q.thinker)}</b> <span class="t">· ${esc(q.title)}</span></span>
        <svg class="chev" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 7.5l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="q-sum">${esc(q.sum)}</span>
        <span class="q-meta"></span>
      </button>
      <div class="q-body" id="${q.id}-body">
        <div class="stim">${q.stim.map(p=>`<p>${esc(p)}</p>`).join('')}</div>
        <p class="src">Source: ${esc(q.src)}</p>
        <div class="part"><div class="part-q"><span class="pl">(a)</span><span>${esc(q.aQ)}</span></div>${respBox(q.a,'a',q.id+'-a')}</div>
        <div class="part"><div class="part-q"><span class="pl">(b)</span><span>${esc(q.bQ)}</span></div>${altTabs}<div class="b-slot" id="${q.id}-bslot">${respBox(alts[0].s,'b',q.id+'-b')}</div></div>
        <div class="part"><div class="part-q"><span class="pl">(c)</span><span>${esc(q.cQ)}</span></div>${respBox(q.c,'c',q.id+'-c')}</div>
      </div>
    </article>`;
  }
  function countFor(aos,name){
    let n=0;aos.bqs.forEach(b=>b.qs.forEach(q=>{if(q.thinker===name||q.b.some(a=>a.thinker===name))n++;}));return n;
  }
  function renderAOS(aos){
    const total=aos.bqs.reduce((n,b)=>n+b.qs.length,0);
    const chips=THINKERS.map(t=>{const n=countFor(aos,t);return n?`<button type="button" class="chip" data-filter="${esc(t)}" aria-pressed="false">${esc(t)}<span class="ct">${n}</span></button>`:'';}).join('');
    return `<div class="panel-head"><span class="eyebrow">${esc(aos.label)}</span><h2>${esc(aos.title)}</h2><p>${total} practice questions across the four Big Questions, each with a stimulus passage and model responses to parts (a), (b) and (c).</p></div>
    <div class="toolbar">
      <div class="tb-row"><span class="tb-label">Big Question</span><button type="button" class="chip" data-bqfilter="" aria-pressed="true">All four</button></div>
      <div class="bqrow">${aos.bqs.map(b=>`<button type="button" class="bqchip" data-bqfilter="${b.id}" aria-pressed="false"><span class="n">${b.n}</span><span>${esc(b.text)}</span></button>`).join('')}</div>
      <div class="tb-row"><span class="tb-label">Thinker</span><button type="button" class="chip" data-filter="" aria-pressed="true">All</button>${chips}</div>
      <div class="tb-row">
        <button type="button" class="switch" role="switch" aria-checked="true" data-switch="colour"><span class="knob"></span>Colour by step</button>
        <button type="button" class="switch" role="switch" aria-checked="false" data-switch="practice"><span class="knob"></span>Practice mode</button>
        <span class="tb-sep"></span>
        <button type="button" class="linkbtn" data-expand="1">Expand all</button>
        <button type="button" class="linkbtn" data-expand="0">Collapse all</button>
      </div>
    </div>
    <p class="practice-tip">Practice mode hides every model response. Read the passage and the question, plan your own answer, then show the model to compare.</p>
    <p class="filter-note" hidden></p>
    ${aos.bqs.map(b=>`<section class="bq" id="${b.id}"><div class="bq-head"><span class="eyebrow">Big Question ${b.n}</span><h3>${esc(b.text)}</h3><span class="count">${b.qs.length} questions</span></div>${b.qs.map(q=>questionCard(q,b.n)).join('')}</section>`).join('')}`;
  }
  function switches(){
    return `<div class="tb-row">
        <button type="button" class="switch" role="switch" aria-checked="true" data-switch="colour"><span class="knob"></span>Colour by step</button>
        <button type="button" class="switch" role="switch" aria-checked="false" data-switch="practice"><span class="knob"></span>Practice mode</button>
        <span class="tb-sep"></span>
        <button type="button" class="linkbtn" data-expand="1">Expand all</button>
        <button type="button" class="linkbtn" data-expand="0">Collapse all</button>
      </div>`;
  }
  function stimCard(s){
    const fig=s.img?`<figure class="stim-fig"><img src="${s.img.src}" alt="${esc(s.img.alt)}"><figcaption>${esc(s.img.caption)}</figcaption></figure>`:'';
    const paras=s.stim.length?`<div class="stim">${s.stim.map(p=>`<p>${esc(p)}</p>`).join('')}</div>`:'';
    return `<article class="q" id="${s.id}" data-thinkers="${esc(s.pair.join('|'))}" data-stim="">
      <button type="button" class="q-head" aria-expanded="false" aria-controls="${s.id}-body" data-toggle="${s.id}">
        <span class="q-num">Q${s.n}</span>
        <span class="q-title"><b>${esc(s.title)}</b></span>
        <svg class="chev" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 7.5l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="q-sum">${esc(s.bq)}</span>
        <span class="q-meta"></span>
      </button>
      <div class="q-body" id="${s.id}-body">
        <p class="stim-intro">${esc(s.intro)}</p>${paras}${fig}
        <div class="part" style="margin-top:14px"><div class="part-q"><span class="pl">(a)</span><span>${esc(s.aQ)}</span></div>${respBox(s.a,'c',s.id+'-a')}</div>
        <div class="part"><div class="part-q"><span class="pl">(b)</span><span>${esc(s.bQ)}</span></div><span class="pairlab">${esc(s.pairLabel)}</span>${respBox(s.b,'sb',s.id+'-b')}</div>
        <div class="part"><div class="part-q"><span class="pl">(c)</span><span>${esc(s.cQ)}</span></div>${respBox(s.c,'sc',s.id+'-c')}</div>
      </div>
    </article>`;
  }
  function renderStim(){
    const groups=DATA.aos.map(a=>`<section class="bq"><div class="group-head"><span class="eyebrow">${esc(a.label)}</span><h3>${esc(a.title)}</h3></div>${DATA.stim.filter(s=>s.aos===a.id).map(stimCard).join('')}</section>`).join('');
    return `<div class="panel-head"><span class="eyebrow">Stimulus-style questions</span><h2>An unseen stimulus, your own thinkers</h2><p>Eight practice questions in the format of Question 3 on the 2025 exam, one for each Big Question. The passage comes from outside the set texts, part (a) is your own justified response with the stimulus as the central example, part (b) compares two Unit 3 thinkers on a claim from the passage, and part (c) asks which response is more compelling.</p></div>
    <div class="toolbar">${switches()}</div>
    <p class="practice-tip">Practice mode hides every model response. Read the passage and the question, plan your own answer, then show the model to compare.</p>
    <p class="tnote">Part (b) shows one possible pair of thinkers for each question. Other pairs can score just as well, provided both thinkers address the claim in the question. Part (c) must refer to one of the two thinkers used in part (b).</p>
    ${groups}`;
  }
  function thinkerById(id){return DATA.thinkers.find(t=>t.id===id);}
  function thinkerDetail(t){
    const order=['aos1-bq1','aos1-bq2','aos1-bq3','aos1-bq4','aos2-bq1','aos2-bq2','aos2-bq3','aos2-bq4'];
    const entries=t.entries.slice().sort((x,y)=>order.indexOf(x.bq)-order.indexOf(y.bq));
    const group=aosId=>{
      const es=entries.filter(e=>e.bq.startsWith(aosId));if(!es.length)return '';
      const a=DATA.aos.find(x=>x.id===aosId);
      return `<section><div class="group-head"><span class="eyebrow">${esc(a.label)}</span><h3>${esc(a.title)}</h3></div>${es.map(e=>{
        const bq=a.bqs.find(b=>b.id===e.bq);
        const links=e.links.length?`<div class="tlinks"><span>In this guide:</span>${e.links.map(l=>`<button type="button" class="tlink" data-open="${l.id}">${esc(l.label)} <span class="r">· ${esc(l.role)}</span></button>`).join('')}</div>`:'';
        return `<div class="tentry"><span class="eyebrow">Big Question ${bq.n}</span><h4>${esc(bq.text)}</h4><p>${esc(e.text)}</p>${links}</div>`;}).join('')}</section>`;
    };
    return `<div class="thead"><span class="tn">${esc(t.name)}</span><span class="tt">${esc(t.text)}</span><span class="cite">${esc(t.cite)}</span></div>
      <p class="tline">${esc(t.line)}</p>
      <div class="terms">${t.terms.map(x=>`<span>${esc(x)}</span>`).join('')}</div>
      ${group('aos1')}${group('aos2')}`;
  }
  function renderThinkers(sel){
    const chips=`<div class="tb-row"><span class="tb-label">Thinker</span><button type="button" class="chip" data-thinker="" aria-pressed="${!sel}">All</button>${DATA.thinkers.map(t=>`<button type="button" class="chip" data-thinker="${t.id}" aria-pressed="${sel===t.id}">${esc(t.name)}</button>`).join('')}</div>`;
    let body='';
    if(sel){body=thinkerDetail(thinkerById(sel));}
    else{body=`<p class="tnote">Every thinker in the Unit 3 set texts, with what their extract says on each Big Question it speaks to. Any Unit 3 thinker can be used for any Big Question, whichever area of study their text sits under.</p><div class="tgrid">${DATA.thinkers.map(t=>`<button type="button" class="tcard" data-thinker="${t.id}"><span class="tn">${esc(t.name)}</span><span class="tt">${esc(t.text)}</span><span class="tl">${esc(t.line)}</span></button>`).join('')}</div>`;}
    return `<div class="panel-head"><span class="eyebrow">Thinker overview</span><h2>The ten thinkers and the Big Questions</h2><p>Main ideas from each set text extract, arranged by Big Question, with short quotes you can use and links to the questions in this guide where that thinker appears.</p></div>
    <div class="toolbar">${chips}</div>${body}`;
  }
  function renderGuide(){
    const stepList=(part,items)=>`<ol class="steps">${items.map(([k,title,desc],i)=>{const [name,n]=STEP[part][k];return `<li class="step"><span class="sl sl-${n}">Step ${i+1} · ${name}</span><span class="sd"><b>${title}</b>${desc}</span></li>`;}).join('')}</ol>`;
    const mapList=aos=>`<div><h4>${esc(aos.label)} · ${esc(aos.title)}</h4><ol>${aos.bqs.map((b,i)=>`<li><a href="#${b.id}" data-goto="${aos.id}" data-jump="${b.id}">${esc(b.text)}</a> <span class="ct">${b.qs.length} questions</span></li>`).join('')}</ol></div>`;
    return `<div class="panel-head"><span class="eyebrow">How to answer</span><h2>Writing a Section A response</h2><p>Each Section A question is worth 10 marks, assessed as a whole across parts (a), (b) and (c). The pattern below is the one every set-text model response in this guide follows. The stimulus-style variant is described further down.</p></div>
    <div class="guide">
      <div class="callout"><b>Watch for the concept shift.</b> The passage is explicitly about one concept, part (a) asks you to connect it to a Big Question concept, and part (c) usually returns to the concept that is most directly in the passage. In the 2025 exam, Nietzsche\u2019s passage was about suffering, part (a) asked about self-discipline, and part (c) asked about suffering. Answer what each part actually asks.</div>
      <div class="card"><h3>Part (a) · Idea, Link, Nuance</h3><p class="sub">Paraphrase the passage in your own words. No direct quotes. Around 80 to 120 words.</p>
        ${stepList('a',[['I','Paraphrase the central claim.','Show you can interpret the passage, not just repeat it. Do not copy phrases from it.'],['L','Bridge to the concept in the question.','The passage rarely uses the exact term the question asks about. State clearly what the thinker would say about that concept. This is where most answers fall down.'],['N','Add a however.','Draw on other parts of the same thinker’s extracts to qualify, deepen or complicate the claim. The wider extract supports the passage analysis rather than replacing it.']])}</div>
      <div class="card"><h3>Part (b) · Idea, Respond, Nuance</h3><p class="sub">Quotes from the extracts are encouraged. Around 80 to 120 words. The comparison thinker must come from Unit 3.</p>
        ${stepList('b',[['I','Introduce the comparison thinker’s position.','Use a short quote from their extracts and map their idea directly onto the original thinker’s claim.'],['R','Say whether they agree or disagree, and why.','State the specific grounds. Anchor the counter-argument with another quote. Stay on the concept the question names.'],['N','Show similarity within difference.','Where do they unexpectedly agree despite overall disagreement, or the reverse? This is what separates a comparison from a strong comparison.']])}</div>
      <div class="card"><h3>Part (c) · Position, Reasoning, Example, Depth</h3><p class="sub">Your own justified response. Around 100 to 150 words. A concrete example is required.</p>
        ${stepList('c',[['P','Take a clear stance.','One or two sentences. Partial agreement is fine, but commit.'],['R','Justify it with real reasoning.','Reasons, not thinker summaries.'],['E','Weave in a concrete example.','A real case that directly illustrates the argument, built into the reasoning rather than bolted on at the end.'],['D','Raise a counter-argument, then answer it.','Acknowledge the complexity and respond to it. This shows philosophical maturity.']])}</div>
      <div class="card"><h3>The stimulus-style variant</h3><p class="sub">The format of Question 3 on the 2025 exam. The passage is from outside the set texts and the parts are arranged differently. See the Stimulus Questions tab.</p>
        <ol class="steps">
          <li class="step"><span class="sl sl-1">Part (a)</span><span class="sd"><b>Your own justified response, with the stimulus as the central example.</b>Take a position, reason it through, and apply the precise details of the stimulus rather than mentioning it in passing. Raise an objection and answer it. The examiners did not treat answers that ignored the stimulus material as fully answering the question.</span></li>
          <li class="step"><span class="sl sl-2">Part (b)</span><span class="sd"><b>Compare two Unit 3 thinkers on one claim from the passage.</b>Set out how each would respond to that specific claim, with a short quote for each, then compare them. Choose thinkers who actually address the claim.</span></li>
          <li class="step"><span class="sl sl-3">Part (c)</span><span class="sd"><b>Which response is more compelling?</b>Commit to one of the two thinkers from part (b), give your reasons, concede what the other gets right, then answer an objection. Using a different thinker here is not a full answer.</span></li>
        </ol></div>
      <div class="card"><h3>What the examiners said</h3><p class="sub">Drawn from the 2025 Examiners’ Report on Section A.</p>
        <ul class="rules">
          <li><b>Refer to the passage.</b> Answers to part (a) that never referred to the passage were not treated as fully answering the question, however well they knew the text.</li>
          <li><b>Make the connection.</b> High-scoring part (a) answers linked the concept in the passage (the discipline of suffering) to the concept in the question (self-discipline). Answers that stayed on the passage concept scored lower.</li>
          <li><b>Be selective.</b> Bring in only the parts of the thinker’s text that bear on the passage and the concept. Piling in their other big ideas scored less highly.</li>
          <li><b>Choose the comparison thinker for the concept.</b> In part (b), pick a Unit 3 thinker who actually addresses the concept, and connect their view directly to the stimulus thinker’s. Outlining their view on its own, or choosing a thinker who does not address the concept, scored less highly. A thinker from outside Unit 3 is not a full answer.</li>
          <li><b>Notice the shift in part (c).</b> Then give an example whenever the question asks for one. Answers without an example were not treated as fully answering. Where a contemporary example is asked for, a hypothetical, a generic case or the passage’s own example does not count.</li>
          <li><b>Any well-justified position can score highly</b>, including one that contradicts the stimulus thinker.</li>
          <li><b>Stay inside the extracts.</b> No biography, no other works, no outside knowledge of the philosophers.</li>
        </ul></div>
      <div class="card"><h3>Using this guide</h3>
        <ul class="use">
